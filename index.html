<script>
/* LERNI – Fragetypen: Bewertung (rein, testbar) und Anzeige.

   Jeder Typ in TYP_UI liefert render(f, ctx) → {
     el,                       Eingabebereich
     bereit(): bool,           darf „Prüfen“ gedrückt werden?
     pruefen(): { s, … },      bewerten und Rückmeldung im Eingabebereich zeigen
     selbst: true              (karte, offen) Bewertung durch den Lernenden, ctx.fertig(s, unsicher) meldet sie
   }
   ctx: { rnd, aenderung() (Knopf-Zustand neu prüfen), fertig(s, unsicher, text), kurs } */
'use strict';

const Bewerter = {
  luecke(f, eingaben, doch = []) {
    const L = Lerni.luecken(f.text).luecken;
    const einzel = L.map((l, i) => !!doch[i] || U.passt(eingaben[i], l.a));
    return { s: einzel.filter(Boolean).length / L.length, einzel };
  },
  /* gewaehlt: Indizes in f.optionen. Mehrfachauswahl: (richtige Treffer − falsche) / Anzahl richtige */
  mc(f, gewaehlt) {
    const richtig = f.optionen.map((o, i) => o.r ? i : -1).filter((i) => i >= 0);
    if (richtig.length === 1) return { s: gewaehlt.length === 1 && gewaehlt[0] === richtig[0] ? 1 : 0 };
    const treffer = gewaehlt.filter((i) => f.optionen[i].r).length, falsch = gewaehlt.length - treffer;
    return { s: U.clamp((treffer - falsch) / richtig.length, 0, 1) };
  },
  wf: (f, antwort) => ({ s: antwort === f.wahr ? 1 : 0 }),
  /* reihenfolge: Indizes in f.schritte in der gewählten Reihenfolge. Anteil der Schritte am richtigen Platz */
  reihe(f, reihenfolge) {
    const platz = reihenfolge.map((idx, pos) => idx === pos);
    return { s: platz.filter(Boolean).length / f.schritte.length, platz };
  },
  /* zuordnung[i] = Index des rechten Partners für links i */
  paare(f, zuordnung) {
    const ok = f.paare.map((p, i) => zuordnung[i] === i);
    return { s: ok.filter(Boolean).length / f.paare.length, ok };
  },
  zahl(f, text) {
    const v = U.zahl(text);
    return { s: isFinite(v) && Math.abs(v - f.loesung) <= Lerni.toleranz(f) ? 1 : 0, wert: v };
  },
  offen: (f, abgehakt) => ({ s: f.kernpunkte.length ? abgehakt / f.kernpunkte.length : 0 }),
};

/* Eigene Skizze(n) als HTML: bild ist ein Name oder eine Liste von Namen aus Lerni.grafik(kurs, name, …) */
function grafikHtml(kursId, bild) {
  return Lerni.bilder(bild).map((b) => {
    const g = Lerni.grafikVon(kursId, b); if (!g) return '';
    return '<figure class="grafik" data-grafik="' + U.esc(b) + '"><div class="gsvg">' + g.svg + '</div>' +
      (g.titel || g.text ? '<figcaption>' + (g.titel ? '<b>' + U.inline(U.esc(g.titel)) + '</b>' : '') + (g.text ? ' ' + U.inline(U.esc(g.text)) : '') + '</figcaption>' : '') + '</figure>';
  }).join('');
}

/* Lösung als HTML (für Rückmeldung, Frage-Details, Klausur-Auswertung) */
function loesungHtml(f) {
  return loesungOhneBild(f) + grafikHtml(f.kurs, f.bildLoesung);
}
function loesungOhneBild(f) {
  const E = (t) => t ? '<div class="erkl">' + U.md(t) + '</div>' : '';
  switch (f.typ) {
    case 'offen': return '<div class="muster">' + U.md(f.antwort) + '</div><div class="kp-t">Kernpunkte</div><ul class="kp-l">' + f.kernpunkte.map((k) => '<li>' + U.inline(U.esc(k)) + '</li>').join('') + '</ul>' + E(f.erklaerung);
    case 'karte': return U.md(f.hinten) + E(f.erklaerung);
    case 'luecke': {
      const { teile } = Lerni.luecken(f.text);
      return '<p>' + teile.map((t, i) => i % 2 ? '<b class="lsg">' + U.esc(t.split('|')[0].trim()) + '</b>' : U.inline(U.esc(t))).join('').replace(/\n/g, '<br>') + '</p>' + E(f.erklaerung);
    }
    case 'mc': return '<ul class="kp-l">' + f.optionen.filter((o) => o.r).map((o) => '<li>' + U.inline(U.esc(o.t)) + (o.warum ? ' <span class="muted">– ' + U.inline(U.esc(o.warum)) + '</span>' : '') + '</li>').join('') + '</ul>' + E(f.erklaerung);
    case 'wf': return '<p><b>' + (f.wahr ? 'Wahr' : 'Falsch') + '.</b> ' + U.inline(U.esc(f.warum || '')) + '</p>' + E(f.erklaerung);
    case 'reihe': return '<ol class="kp-l">' + f.schritte.map((s) => '<li>' + U.inline(U.esc(s)) + '</li>').join('') + '</ol>' + E(f.erklaerung);
    case 'paare': return '<ul class="kp-l">' + f.paare.map((p) => '<li>' + U.inline(U.esc(p[0])) + ' → <b>' + U.inline(U.esc(p[1])) + '</b></li>').join('') + '</ul>' + E(f.erklaerung);
    case 'zahl': return '<p><b>' + U.fmtNum(f.loesung) + (f.einheit ? ' ' + U.esc(f.einheit) : '') + '</b></p>' + (f.rechenweg ? '<div class="erkl">' + U.md(f.rechenweg) + '</div>' : '') + E(f.erklaerung);
  }
  return '';
}
/* Fragetext (ohne Antwortbereich), mit Skizze, falls die Frage eine hat (bild) */
function frageHtml(f) {
  let t;
  switch (f.typ) {
    case 'karte': t = U.md(f.vorne); break;
    case 'wf': t = U.md(f.aussage); break;
    case 'luecke': t = U.md(f.frage || 'Fülle die Lücken.'); break;
    default: t = U.md(f.frage);
  }
  return t + grafikHtml(f.kurs, f.bild);
}
/* Text für „Mit Claude prüfen“ */
function claudePrompt(f, antwort) {
  const k = Lerni.kursById[f.kurs];
  return [
    'Bitte korrigiere meine Antwort auf eine Klausurfrage' + (k ? ' im Fach „' + k.name + '“' : '') + ' wie ein strenger, fairer Prüfer.',
    '', 'FRAGE:', U.plain(f.frage),
    '', 'ERWARTETE KERNPUNKTE:', f.kernpunkte.map((x) => '- ' + U.plain(x)).join('\n'),
    '', 'MUSTERANTWORT:', String(f.antwort).trim(),
    '', 'MEINE ANTWORT:', String(antwort || '').trim() || '(keine)',
    '', 'Sag mir: 1) welche Kernpunkte ich getroffen habe, 2) was fehlt oder fachlich falsch ist, 3) Punkte von 0 bis ' + (f.punkte || 10) + ', 4) einen kurzen Tipp, wie ich mir das Fehlende merke.',
  ].join('\n');
}

const TYP_UI = {
  /* ---------- Auswahl (eine oder mehrere richtig) ---------- */
  mc: {
    render(f, ctx) {
      const mehr = f.optionen.filter((o) => o.r).length > 1;
      const ord = U.shuffle(f.optionen.map((_, i) => i), ctx.rnd), gew = new Set();
      const knoepfe = ord.map((i) => el('button', { class: 'opt', 'aria-pressed': 'false', html: '<span class="mk"></span><span class="ot">' + U.inline(U.esc(f.optionen[i].t)) + '</span>', onclick: (ev) => {
        if (fertig) return;
        if (!mehr) { gew.clear(); knoepfe.forEach((b) => b.setAttribute('aria-pressed', 'false')); }
        if (gew.has(i)) gew.delete(i); else gew.add(i);
        ev.currentTarget.setAttribute('aria-pressed', String(gew.has(i))); ctx.aenderung();
      } }));
      let fertig = false;
      const box = el('div', { class: 'opts' + (mehr ? ' mehr' : '') }, [mehr ? el('div', { class: 'hint', text: 'Mehrere Antworten sind richtig.' }) : null].concat(knoepfe));
      return {
        el: box, bereit: () => gew.size > 0,
        pruefen() {
          fertig = true; const res = Bewerter.mc(f, [...gew]);
          ord.forEach((i, k) => {
            const o = f.optionen[i], b = knoepfe[k], g = gew.has(i);
            b.classList.add(o.r ? (g ? 'ok' : 'missed') : (g ? 'bad' : 'dim')); b.disabled = true;
            if (o.warum && (g || o.r)) b.appendChild(el('span', { class: 'warum', html: U.inline(U.esc(o.warum)) }));
          });
          return res;
        },
      };
    },
  },

  /* ---------- Wahr oder falsch ---------- */
  wf: {
    render(f, ctx) {
      let wahl = null, fertig = false;
      const mk = (v, t) => el('button', { class: 'opt wfb', 'aria-pressed': 'false', text: t, onclick: () => { if (fertig) return; wahl = v; [bw, bf].forEach((b) => b.setAttribute('aria-pressed', String(b === (v ? bw : bf)))); ctx.aenderung(); } });
      const bw = mk(true, 'Wahr'), bf = mk(false, 'Falsch');
      return {
        el: el('div', { class: 'opts wf' }, [bw, bf]), bereit: () => wahl !== null,
        pruefen() {
          fertig = true; const res = Bewerter.wf(f, wahl);
          const richtigB = f.wahr ? bw : bf, gewB = wahl ? bw : bf;
          richtigB.classList.add(gewB === richtigB ? 'ok' : 'missed'); if (gewB !== richtigB) gewB.classList.add('bad');
          bw.disabled = bf.disabled = true;
          return res;
        },
      };
    },
  },

  /* ---------- Lückentext: Eingabe oder Auswahl (auswahl: true), „Doch richtig“ je Lücke ---------- */
  luecke: {
    render(f, ctx) {
      const { teile, luecken } = Lerni.luecken(f.text), felder = [], doch = [];
      let pool = null;
      if (f.auswahl) pool = U.shuffle([...new Set(luecken.map((l) => l.a[0]).concat(f.ablenker || []))], ctx.rnd);
      const p = el('div', { class: 'lt' });
      teile.forEach((t, i) => {
        if (i % 2 === 0) { if (t) p.appendChild(el('span', { html: U.inline(U.esc(t)).replace(/\n/g, '<br>') })); return; }
        const l = luecken[(i - 1) / 2], w = Math.max(4, Math.min(22, Math.max(...l.a.map((a) => a.length)) + 1));
        let inp;
        if (pool) {
          inp = el('select', { class: 'gap', 'aria-label': 'Lücke ' + ((i + 1) / 2), onchange: () => ctx.aenderung() }, [el('option', { value: '', text: '…' })].concat(pool.map((x) => el('option', { value: x, text: x }))));
        } else {
          inp = el('input', { class: 'gap', type: 'text', size: w, style: 'width:' + (w * 0.62 + 1.2) + 'em', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Lücke ' + ((i + 1) / 2), oninput: () => ctx.aenderung(),
            onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); const n = felder[felder.indexOf(inp) + 1]; if (n) n.focus(); else ctx.enter(); } } });
        }
        felder.push(inp); p.appendChild(inp);
      });
      const box = el('div', { class: 'ltbox' }, [p]);
      let res = null;
      return {
        el: box, bereit: () => felder.some((x) => x.value.trim()),
        fokus: () => { if (!pool && felder[0] && !('ontouchstart' in window)) felder[0].focus(); },
        pruefen() {
          res = Bewerter.luecke(f, felder.map((x) => x.value), doch);
          felder.forEach((inp, i) => {
            inp.disabled = true; inp.classList.add(res.einzel[i] ? 'ok' : 'bad');
            if (!res.einzel[i]) {
              const k = el('span', { class: 'korr' }, [el('b', { text: luecken[i].a[0] })]);
              if (inp.value.trim()) k.appendChild(el('button', { class: 'doch', text: 'Doch richtig', onclick: () => {
                doch[i] = true; inp.classList.remove('bad'); inp.classList.add('ok'); k.remove();
                res = Bewerter.luecke(f, felder.map((x) => x.value), doch); ctx.neueBewertung(res.s);
              } }));
              inp.after(k);
            }
          });
          return res;
        },
      };
    },
  },

  /* ---------- Reihenfolge: Schritte nacheinander antippen ---------- */
  reihe: {
    render(f, ctx) {
      const n = f.schritte.length, gewaehlt = [];
      let fertig = false;
      const ziel = el('ol', { class: 'rz' }), pool = el('div', { class: 'rpool' });
      const zeichne = () => {
        ziel.innerHTML = ''; pool.innerHTML = '';
        gewaehlt.forEach((idx) => ziel.appendChild(el('li', {}, [el('button', { class: 'rchip on', html: U.inline(U.esc(f.schritte[idx])), onclick: () => { if (fertig) return; gewaehlt.splice(gewaehlt.indexOf(idx), 1); zeichne(); ctx.aenderung(); } })])));
        for (let k = gewaehlt.length; k < n; k++) ziel.appendChild(el('li', { class: 'leer' }, [el('span', { text: '…' })]));
        mischung.filter((idx) => gewaehlt.indexOf(idx) < 0).forEach((idx) => pool.appendChild(el('button', { class: 'rchip', html: U.inline(U.esc(f.schritte[idx])), onclick: () => { if (fertig) return; gewaehlt.push(idx); zeichne(); ctx.aenderung(); } })));
      };
      let mischung = U.shuffle(f.schritte.map((_, i) => i), ctx.rnd);
      if (mischung.every((v, i) => v === i)) mischung = mischung.slice().reverse();
      zeichne();
      return {
        el: el('div', { class: 'reihe' }, [el('div', { class: 'hint', text: 'Tippe die Schritte in der richtigen Reihenfolge an. Nochmal tippen nimmt einen zurück.' }), ziel, pool]),
        bereit: () => gewaehlt.length === n,
        pruefen() {
          fertig = true; const res = Bewerter.reihe(f, gewaehlt);
          [...ziel.querySelectorAll('li')].forEach((li, pos) => {
            li.classList.add(res.platz[pos] ? 'ok' : 'bad');
            if (!res.platz[pos]) li.appendChild(el('span', { class: 'korr', text: 'gehört auf Platz ' + (gewaehlt[pos] + 1) }));
          });
          return res;
        },
      };
    },
  },

  /* ---------- Zuordnen: links antippen, dann rechts ---------- */
  paare: {
    render(f, ctx) {
      const n = f.paare.length, zu = new Array(n).fill(-1), rechtsOrd = U.shuffle(f.paare.map((_, i) => i), ctx.rnd);
      let aktiv = -1, fertig = false;
      const L = f.paare.map((p, i) => el('button', { class: 'pz', html: '<span class="pt">' + U.inline(U.esc(p[0])) + '</span>', onclick: () => { if (fertig) return; if (zu[i] >= 0) { zu[i] = -1; aktiv = i; } else aktiv = aktiv === i ? -1 : i; zeichne(); ctx.aenderung(); } }));
      const R = rechtsOrd.map((ri) => el('button', { class: 'pz', html: '<span class="pt">' + U.inline(U.esc(f.paare[ri][1])) + '</span>', onclick: () => {
        if (fertig) return;
        const vorher = zu.indexOf(ri); if (vorher >= 0) zu[vorher] = -1;
        if (aktiv >= 0) { zu[aktiv] = ri; aktiv = zu.indexOf(-1) >= 0 && zu.indexOf(-1) !== aktiv ? zu.indexOf(-1) : -1; }
        zeichne(); ctx.aenderung();
      } }));
      const nr = (i) => { const x = el('i', { class: 'pn', text: String(i + 1) }); return x; };
      const zeichne = () => {
        L.forEach((b, i) => { b.classList.toggle('sel', i === aktiv); b.classList.toggle('on', zu[i] >= 0); b.querySelectorAll('.pn').forEach((x) => x.remove()); if (zu[i] >= 0) b.prepend(nr(i)); });
        R.forEach((b, k) => { const ri = rechtsOrd[k], li = zu.indexOf(ri); b.classList.toggle('on', li >= 0); b.querySelectorAll('.pn').forEach((x) => x.remove()); if (li >= 0) b.prepend(nr(li)); });
      };
      aktiv = 0; zeichne();
      return {
        el: el('div', { class: 'paare' }, [el('div', { class: 'hint', text: 'Links antippen, dann den passenden Partner rechts. Gleiche Nummer = Paar.' }), el('div', { class: 'pcols' }, [el('div', { class: 'pcol' }, L), el('div', { class: 'pcol' }, R)])]),
        bereit: () => zu.every((x) => x >= 0),
        pruefen() {
          fertig = true; aktiv = -1; zeichne(); const res = Bewerter.paare(f, zu);

        const alle = (v) => { haken.fill(v); liste.querySelectorAll('.kp').forEach((b) => b.setAttribute('aria-pressed', String(v))); stand(); };

          el('div', { class: 'hint', text: 'Tippe die Kernpunkte an, die in deiner Antwort vorkamen – ehrlich sein lohnt sich.' }),
          liste,
          el('div', { class: 'row' }, [el('button', { class: 'btn small', text: 'Nichts', onclick: () => alle(false) }), el('button', { class: 'btn small', text: 'Alles', onclick: () => alle(true) }),

          weiter,

    },
  },
};

<script>
/* LERNI – Lernsitzung: Reihenfolge, Wiedervorlage falscher Fragen, Ergebnis. Ohne DOM (testbar). */
'use strict';

const MODUS_KURZ = { heute: 'l', liste: 'w', einheit: 'e', thema: 't', offen: 'o', mix: 'm', fragen: 'w', klausur: 'k' };

class Sitzung {
  /* fragen: Liste von Fragen; info: { modus, titel, kurs } */
  constructor(fragen, info) {
    this.queue = fragen.slice(); this.i = 0; this.info = info;
    this.ergebnisse = [];                          // { f, s, u, wdh }
    this.nochmal = new Set(); this.t0 = Date.now(); this.tFrage = Date.now();
    this.beendet = false;
  }
  get aktuell() { return this.queue[this.i]; }
  get anzahl() { return this.queue.length; }
  get erste() { return this.ergebnisse.filter((e) => !e.wdh); }
  start() { this.tFrage = Date.now(); }

  /* Antwort festhalten. Falsche (und teilweise) Fragen kommen einmal wieder – ein paar Fragen später. */
  erfassen(s, unsicher, text) {
    const f = this.aktuell, ms = Math.min(Date.now() - this.tFrage, 15 * 60000);
    const wdh = this.ergebnisse.some((e) => e.f === f);
    Store.antwort(f, s, unsicher, ms, MODUS_KURZ[this.info.modus] || 'l', text);
    this.ergebnisse.push({ f, s, u: !!unsicher, wdh });
    if (s < RICHTIG && !this.nochmal.has(f.qid)) {
      this.nochmal.add(f.qid);
      this.queue.splice(Math.min(this.i + 4, this.queue.length), 0, f);
    }
  }
  weiter() { this.i++; this.tFrage = Date.now(); return this.i < this.queue.length; }
  abschliessen() {
    if (this.beendet) return; this.beendet = true;
    const e = this.erste;
    if (!e.length) return;
    Store.sitzungEnde({ t: Math.floor(this.t0 / 1000), modus: this.info.modus, titel: this.info.titel, kurs: this.info.kurs, n: e.length, r: e.filter((x) => x.s >= RICHTIG).length, ms: Date.now() - this.t0 });
  }
  zusammenfassung() {
    const e = this.erste, z = { n: e.length, richtig: 0, teilweise: 0, falsch: 0, unsicher: 0, punkte: 0, ms: Date.now() - this.t0 };
    for (const x of e) { z[Lernlogik.ergebnis(x.s)]++; if (x.u) z.unsicher++; z.punkte += x.s; }
    z.quote = e.length ? z.punkte / e.length : 0;
    z.nochmalFalsch = e.filter((x) => x.s < RICHTIG).map((x) => x.f.qid);
    return z;
  }
}

const App = {

    this.bannerEl = el('div', { id: 'banner', class: 'hidden' });
    document.body.append(this.bannerEl, this.view, this.tabs, this.toastEl);
    this.theme();
    // Skizzen antippen → groß ansehen (Querformat, Zwei-Finger-Zoom)
    this.view.addEventListener('click', (e) => { const g = e.target.closest && e.target.closest('figure.grafik'); if (g) this.lupe(g); });
  },
  lupe(fig) {
    const zu = () => { d.remove(); document.removeEventListener('keydown', esc); };
    const esc = (e) => { if (e.key === 'Escape') zu(); };
    const d = el('div', { class: 'glupe', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Grafik groß', onclick: (e) => { if (!e.target.closest('.ib')) zu(); } }, [
      el('button', { class: 'ib', 'aria-label': 'Schließen', html: ICON.zu, onclick: zu }),

      el('div', { class: 'ghint', text: 'Tipp: iPhone quer halten oder mit zwei Fingern zoomen. Antippen schließt.' }),
    ]);
    document.addEventListener('keydown', esc);
    document.body.appendChild(d);

  theme() {
    const t = Store.data.set.theme, root = document.documentElement;
    if (t === 'hell') root.dataset.theme = 'light'; else if (t === 'dunkel') root.dataset.theme = 'dark'; else delete root.dataset.theme;
    const dunkel = t === 'dunkel' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dunkel ? '#10131f' : '#f5f6fa');
  },

  /* ---------- Navigation ---------- */
  kurs() { const s = Store.data.set, K = Lerni.sichtbareKurse(); let k = Lerni.kursById[s.kurs]; if (!k || k.versteckt) k = K[0] || Lerni.kurse[0]; return k; },
  tab(id) {
    this.reiter = id; this.stapel = [];
    this.oeffne({ lernen: this.home, logbuch: this.logbuch, einst: this.einstellungen }[id]);
  },
  oeffne(fn, ...args) {
    const cur = this.stapel[this.stapel.length - 1]; if (cur) cur.scroll = this.view.scrollTop;
    this.stapel.push({ fn, args }); this.zeichne(0);
  },
  /* Aktuelle Seite ersetzen (z. B. Sitzung → Ergebnis), ohne Zurück-Eintrag */
  ersetze(fn, ...args) { this.stapel.pop(); this.stapel.push({ fn, args }); this.zeichne(0); },
  zurueck() { if (this.stapel.length > 1) this.stapel.pop(); const cur = this.stapel[this.stapel.length - 1]; this.zeichne(cur.scroll || 0); },

  dialog({ titel, text, knoepfe }) {

  },

<script>
/* LERNI – Seiten: Start, Einheit mit Kurzskript, Logbuch, Frage-Details, Einstellungen mit Sicherung */
'use strict';

const UIScreens = {
  /* ================= Start ================= */
  home() {
    const k = this.kurs(), set = Store.data.set;
    if (!k) return this.seite({ titel: 'Lerni', inhalt: [el('p', { class: 'leer', text: 'Noch keine Inhalte geladen.' })] });
    const fr = k.alleFragen, z = Lernlogik.zaehlen(fr), heute = Lernlogik.heute(), serie = Lernlogik.serie();
    const plan = Lernlogik.plan(k.id, 'heute');
    const neuFrei = Math.max(0, set.neuProTag - Lernlogik.neuHeute(k.id));
    const inhalt = [];

    // Hinweise: in Safari statt Home-Bildschirm-App, Sicherung fällig
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios && !navigator.standalone && !window.matchMedia('(display-mode: standalone)').matches) {
      inhalt.push(el('div', { class: 'card hinweis' }, [el('b', { text: 'Tipp: Als App auf den Home-Bildschirm' }),
        el('p', { html: 'Tippe unten auf <b>Teilen</b> → <b>Zum Home-Bildschirm</b> und lerne ab dann nur über das Symbol. Dort bleibt dein Lernstand dauerhaft gespeichert (Safari-Tabs und Home-Bildschirm-App haben getrennte Speicher).' })]));
    }
    const S = Store.data.sich, tageSeit = S.zuletzt ? (Date.now() - S.zuletzt) / 864e5 : 999;
    if (S.seit >= 150 || (S.seit >= 30 && tageSeit > 14)) {

      zeile('Neue Fragen pro Tag', 'Mehr = schneller durch, aber mehr Wiederholungen später', this.wahl([[5, '5'], [10, '10'], [20, '20'], [40, '40']], set.neuProTag, (v) => setze('neuProTag', v))),

      el('p', { class: 'muted small', text: 'Letzte Sicherung: ' + (S.zuletzt ? U.fmtDay(U.dayNum(S.zuletzt), true) + ' · seitdem ' + U.plural(S.seit, 'Antwort', 'Antworten') : 'noch keine') }),
      el('div', { class: 'row wrap' }, [
        el('button', { class: 'btn primary', html: ICON.teilen + ' Sicherung speichern', onclick: () => this.sichern() }),
        el('button', { class: 'btn', html: ICON.hoch + ' Sicherung laden', onclick: () => this.ladenDatei() }),
      ]),

        el('button', { class: 'btn small', text: 'Text einfügen', onclick: () => this.ladenText() }),
        Store.hatVorImport() ? el('button', { class: 'btn small', text: 'Stand vor dem Laden zurückholen', onclick: async () => { if (await this.bestaetigen('Zurückholen?', 'Der Lernstand von vor dem letzten Laden oder Zurücksetzen kommt zurück.', 'Zurückholen')) { Store.vorImportZurueck(); this.toast('Zurückgeholt'); this.tab('einst'); } } }) : null,

      zeile('Speicher', U.fmtInt(Store.groesse() / 1024) + ' KB belegt' + (Store.fehler ? ' · Fehler: ' + Store.fehler : ''), null),
      zeile('Selbsttest', 'Prüft Inhalte und Lernlogik (für die Entwicklung)', el('button', { class: 'btn small', text: 'Starten', onclick: () => { location.href = location.pathname + '?selftest'; } })),
      zeile('Lernstand löschen', 'Alle Antworten und das Logbuch dieses Geräts', el('button', { class: 'btn small danger', text: 'Löschen', onclick: async () => {
        if (!(await this.bestaetigen('Lernstand löschen?', 'Alle Antworten, das Logbuch und die Wiederholungsplanung werden gelöscht. Einstellungen bleiben. Bis zum nächsten Laden einer Sicherung lässt es sich noch zurückholen.', 'Löschen', true))) return;
        Store.zuruecksetzen(); this.toast('Lernstand gelöscht'); this.tab('lernen');
      } })),
    ]));
    inhalt.push(el('p', { class: 'muted small center', text: 'Lerni · lernt nur auf deinem Gerät, sendet nichts.' }));
    return this.seite({ titel: 'Einstellungen', inhalt });
  },

  /* ---------- Sicherung ---------- */
  async sichern() {
    const text = Store.exportText(), name = Store.exportName();
    let datei = null; try { datei = new File([text], name, { type: 'application/json' }); } catch (e) { /* alter Browser */ }
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      try { await navigator.share({ files: [datei], title: 'Lerni-Sicherung' }); Store.merkeExport(); this.toast('Sicherung gespeichert'); this.neu(); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = el('a', { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    Store.merkeExport(); this.toast('Sicherung gespeichert: ' + name); this.neu();
  },
  ladenDatei() {
    const inp = el('input', { type: 'file', accept: '.json,application/json,text/plain', style: 'display:none' });
    inp.addEventListener('change', async () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) this.importieren(await f.text()); });
    document.body.appendChild(inp); inp.click();
  },
  ladenText() {
    const ta = el('textarea', { rows: 6, placeholder: 'Kopierten Lernstand hier einfügen', 'aria-label': 'Lernstand als Text' });
    const d = el('div', { class: 'dlg' }, [el('div', { class: 'dlgbox' }, [el('h2', { text: 'Lernstand einfügen' }), ta, el('div', { class: 'dlgk' }, [
      el('button', { class: 'btn', text: 'Abbrechen', onclick: () => d.remove() }),
      el('button', { class: 'btn primary', text: 'Laden', onclick: () => { d.remove(); this.importieren(ta.value); } }),
    ])])]);
    document.body.appendChild(d); ta.focus();
  },
  async importieren(text) {
    let wann = '';
    try { const o = JSON.parse(text); if (o && o.exportiert) wann = ' vom ' + new Date(o.exportiert).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { /* Meldung kommt beim Import */ }
    if (!(await this.bestaetigen('Sicherung laden?', 'Die Sicherung' + U.esc(wann) + ' ersetzt den Lernstand auf diesem Gerät. Der jetzige Stand lässt sich danach unter Einstellungen zurückholen.', 'Laden'))) return;
    try { const r = Store.importText(text); this.theme(); this.toast('Geladen: ' + r.fragen + ' Fragen, ' + r.antworten + ' Antworten'); this.tab('lernen'); } catch (e) { this.dialog({ titel: 'Laden ging nicht', text: U.esc(e.message) }); }
  },
};

<script>
/* LERNI – Lernrunde: eine Frage je Seite, Prüfen, Rückmeldung, Weiter; danach das Ergebnis */
'use strict';

const UILernen = {
  lernSeite(s) {
    const f = s.aktuell;
    if (!f) return this.ergebnisSeite(s);
    const e = Lerni.einheitVon(f), inf = Lernlogik.info(f), r = Store.rec(f.qid) || Store.recOderNeu(f.qid);
    const wdh = s.ergebnisse.some((x) => x.f === f);
    s.start();
    let unsicher = false, res = null, geprueft = false;

    const pruefKnopf = el('button', { class: 'btn primary wide', id: 'pruefen', text: 'Prüfen', disabled: true, onclick: () => pruefen() });
    const unsKnopf = el('button', { class: 'unsicher', id: 'unsicher', 'aria-pressed': 'false', text: 'Unsicher', title: 'Markieren, wenn du geraten hast oder nicht sicher bist', onclick: () => { unsicher = !unsicher; unsKnopf.setAttribute('aria-pressed', String(unsicher)); } });
    const fuss = el('div', { class: 'fuss' }, [unsKnopf, pruefKnopf]);
    const rueck = el('div', { class: 'rueck hidden', 'aria-live': 'polite' });

    const naechste = () => {
      if (s.weiter()) this.ersetze(this.lernSeite, s);
      else { s.abschliessen(); this.ersetze(this.ergebnisSeite, s); }
    };
    const weiter = () => { s.erfassen(res.s, unsicher); naechste(); };
    const zeigeErgebnis = () => {
      const erg = Lernlogik.ergebnis(res.s);
      rueck.className = 'rueck ' + erg;
      rueck.innerHTML = '';
      rueck.appendChild(el('div', { class: 'rk' }, [
        el('b', { text: { richtig: 'Richtig', teilweise: 'Teilweise richtig', falsch: 'Leider falsch' }[erg] }),
        res.s > 0 && res.s < 1 ? el('span', { text: U.fmtPct(res.s) }) : null,
        unsicher && erg === 'richtig' ? el('span', { class: 'muted', text: 'kommt trotzdem bald wieder' }) : null,
      ]));
      const mehr = ['wf', 'zahl', 'reihe'].includes(f.typ) ? loesungHtml(f) : grafikHtml(f.kurs, f.bildLoesung) + (f.erklaerung ? '<div class="erkl">' + U.md(f.erklaerung) + '</div>' : '');
      if (mehr) rueck.appendChild(el('div', { class: 'md', html: mehr }));
      if (f.quelle) rueck.appendChild(el('div', { class: 'quelle', text: 'Quelle: ' + f.quelle }));
    };
    const pruefen = () => {
      if (geprueft || !ui.bereit()) return;
      geprueft = true; res = ui.pruefen(); zeigeErgebnis();
      fuss.innerHTML = '';
      fuss.appendChild(el('button', { class: 'btn primary wide', id: 'weiter', text: s.i + 1 < s.anzahl ? 'Weiter' : 'Fertig', onclick: weiter }));
      setTimeout(() => rueck.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 30);
    };
    const ctx = {
      rnd: U.rng(U.hash(f.qid) ^ (Date.now() & 0xffffff)),
      aenderung: () => { pruefKnopf.disabled = !ui.bereit(); },
      enter: () => { if (!geprueft) pruefen(); else weiter(); },
      fertig: (sc, u, text) => { s.erfassen(sc, u, text); naechste(); },
      neueBewertung: (sc) => { res.s = sc; zeigeErgebnis(); },
      aufgedeckt: () => { },
    };
    const ui = TYP_UI[f.typ].render(f, ctx);

    const karte = el('div', { class: 'card frage-k' }, [
      el('div', { class: 'meta' }, [
        wdh ? el('span', { class: 'badge wdh', text: 'Nochmal' }) : inf.neu ? el('span', { class: 'badge neu', text: 'Neu' }) : null,
        el('span', { text: TYPEN[f.typ].name + (e ? ' · ' + e.titel : '') }),
        f.wichtig > 1 ? el('span', { class: 'wichtig', text: '★'.repeat(f.wichtig - 1), title: 'Klausurrelevant' }) : null,
      ]),
      el('div', { class: 'md frage-t', html: frageHtml(f) }),
      ui.el,
    ]);
    const stern = el('button', { class: 'ib' + (r.fav ? ' on' : ''), 'aria-label': 'Merken', html: ICON.stern, onclick: () => { r.fav = r.fav ? 0 : 1; Store.save(); stern.classList.toggle('on', !!r.fav); this.toast(r.fav ? 'Gemerkt' : 'Nicht mehr gemerkt'); } });
    const schliessen = async () => {
      if (s.ergebnisse.length && !(await this.bestaetigen('Runde beenden?', 'Deine bisherigen Antworten sind schon gespeichert.', 'Beenden'))) return;
      s.abschliessen();
      if (s.ergebnisse.length) this.ersetze(this.ergebnisSeite, s); else this.zurueck();
    };
    const fortschritt = el('div', { class: 'fbar' }, [el('i', { style: 'width:' + (s.i / s.anzahl * 100).toFixed(1) + '%' })]);
    const inhalt = [fortschritt, karte, rueck];
    if (!ui.selbst) inhalt.push(fuss);

    // Enter prüft bzw. geht weiter (Tastatur am Rechner)
    const taste = (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && ev.target.tagName !== 'TEXTAREA' && ev.target.tagName !== 'BUTTON' && !ui.selbst) { ev.preventDefault(); ctx.enter(); } };
    document.addEventListener('keydown', taste);
    this._aufraeumen = () => document.removeEventListener('keydown', taste);
    if (ui.fokus) setTimeout(ui.fokus, 60);

    return this.seite({ titel: (s.i + 1) + ' / ' + s.anzahl, ueber: s.info.titel, schliessen, aktionen: [stern], inhalt, ohneTabs: true, klasse: 'lernen' });
  },

  ergebnisSeite(s) {
    const z = s.zusammenfassung();
    const spruch = z.quote >= 0.9 ? 'Stark! Das sitzt.' : z.quote >= 0.7 ? 'Gut dabei.' : z.quote >= 0.4 ? 'Dranbleiben – Wiederholung macht’s.' : 'Genau dafür ist Üben da.';
    const k = Lerni.kursById[s.info.kurs], naechster = k ? Lernlogik.plan(k.id, 'heute') : [];
    const inhalt = [
      el('div', { class: 'card ergebnis' }, [
        this.ring(z.quote, U.fmtPct(z.quote), 'richtig', z.quote >= 0.8 ? 'var(--ok)' : z.quote >= 0.5 ? 'var(--mid)' : 'var(--bad)'),
        el('div', { class: 'einfo' }, [
          el('b', { text: spruch }),
          el('div', { class: 'ezahlen' }, [
            el('span', { class: 'ok', text: z.richtig + ' gewusst' }), el('span', { class: 'mid', text: z.teilweise + ' teilweise' }), el('span', { class: 'bad', text: z.falsch + ' falsch' }),
          ]),
          el('div', { class: 'muted small', text: U.plural(z.n, 'Frage', 'Fragen') + ' in ' + U.fmtDur(z.ms) + (z.unsicher ? ' · ' + z.unsicher + ' unsicher' : '') }),
        ]),
      ]),
      el('div', { class: 'row wrap' }, [
        z.nochmalFalsch.length ? el('button', { class: 'btn primary', text: 'Die ' + z.nochmalFalsch.length + ' nicht gewussten nochmal', onclick: () => this.ersetze(this.lernSeite, new Sitzung(z.nochmalFalsch.map((q) => Lerni.fragen[q]), { modus: 'fragen', titel: 'Nochmal', kurs: s.info.kurs })) }) : null,
        naechster.length ? el('button', { class: 'btn' + (z.nochmalFalsch.length ? '' : ' primary'), text: 'Weiterlernen', onclick: () => this.ersetze(this.lernSeite, new Sitzung(naechster, { modus: 'heute', titel: 'Heute lernen', kurs: s.info.kurs })) }) : null,
        el('button', { class: 'btn', text: 'Zur Übersicht', onclick: () => this.tab('lernen') }),
      ]),
      el('h2', { class: 'abschnitt', text: 'Deine Antworten' }),
      el('div', { class: 'liste' }, s.erste.map((x) => el('button', { class: 'zeile frage', onclick: () => this.oeffne(this.frageDetail, x.f.qid) }, [
        el('span', { class: 'dots' }, [el('i', { class: Lernlogik.ergebnis(x.s) + (x.u ? ' u' : '') })]),
        el('span', { class: 'zb' }, [el('span', { class: 'zt', text: U.short(x.f.frage || x.f.vorne || x.f.aussage || x.f.text, 100) }), el('span', { class: 'zm', text: TYPEN[x.f.typ].name + ' · ' + Math.round(x.s * 100) + ' %' + (x.u ? ' · unsicher' : '') })]),
      ]))),
    ];
    return this.seite({ titel: 'Geschafft', ueber: s.info.titel, schliessen: () => this.tab('lernen'), inhalt, ohneTabs: true });
  },
};
Object.assign(App, UILernen);

<script>
/* LERNI – Klausur-Simulation: offene Fragen mit Zeitlimit, ohne Hilfe. Erst am Ende Musterantworten und Selbstbewertung.
   Eine laufende Simulation steht in localStorage (KLAUSUR_KEY), damit sie weiterläuft, wenn iOS die App im Hintergrund beendet. */
'use strict';

const KLAUSUR_KEY = 'lerni.klausur';

const UIKlausur = {
  _kcfg: { n: 5, min: 30, wahl: 'kritisch', aus: null },

  klausurOffen() { try { const K = JSON.parse(localStorage.getItem(KLAUSUR_KEY) || 'null'); return K && K.qids && K.qids.every((q) => Lerni.fragen[q]) ? K : null; } catch (e) { return null; } },
  _kSpeichern(K) { try { localStorage.setItem(KLAUSUR_KEY, JSON.stringify(K)); } catch (e) { /* voll – läuft trotzdem */ } },
  _kLoeschen() { try { localStorage.removeItem(KLAUSUR_KEY); } catch (e) { /* egal */ } },

  klausurStart() {
    const k = this.kurs(), C = this._kcfg, offen = this.klausurOffen();
    const pool = (aus) => k.alleFragen.filter((f) => f.typ === 'offen' && (!aus || aus.indexOf(f.einheit) >= 0));
    const n = pool(C.aus).length;
    const rer = () => this.ersetze(this.klausurStart);
    const inhalt = [];
    if (offen) inhalt.push(el('div', { class: 'card hinweis' }, [el('b', { text: 'Eine Simulation läuft noch' }), el('p', { text: 'Begonnen ' + U.relDay(U.dayNum(offen.t0)) + ' um ' + U.fmtTime(offen.t0 / 1000) + ', ' + offen.qids.length + ' Aufgaben.' }),
      el('div', { class: 'row' }, [el('button', { class: 'btn primary', text: 'Fortsetzen', onclick: () => this.ersetze(offen.abgegeben ? this.klausurAuswertung : this.klausurLauf, offen) }),
        el('button', { class: 'btn', text: 'Verwerfen', onclick: () => { this._kLoeschen(); rer(); } })])]));
    inhalt.push(el('p', { text: 'Wie in der echten Klausur: Du beantwortest offene Fragen ohne Hilfe und mit Zeitlimit. Erst am Ende siehst du die Musterantworten und bewertest dich anhand der Kernpunkte.' }));
    const zeile = (t, ctrl) => el('div', { class: 'einst' }, [el('div', { class: 'et', text: t }), ctrl]);
    inhalt.push(el('div', { class: 'card' }, [
      zeile('Aufgaben', this.wahl([[3, '3'], [5, '5'], [8, '8'], [12, '12']], C.n, (v) => { C.n = v; rer(); })),
      zeile('Zeit', this.wahl([[0, 'ohne'], [15, '15 min'], [30, '30 min'], [60, '60 min'], [90, '90 min']], C.min, (v) => { C.min = v; rer(); })),
      zeile('Auswahl', this.wahl([['kritisch', 'Schwächen'], ['neu', 'Neue zuerst'], ['zufall', 'Zufall']], C.wahl, (v) => { C.wahl = v; rer(); })),
    ]));
    if (k.einheitenListe.length > 1) {
      const aus = C.aus || k.einheitenListe.map((e) => e.id);
      inhalt.push(el('h2', { class: 'abschnitt', text: 'Einheiten' }));
      inhalt.push(el('div', { class: 'chips' }, k.einheitenListe.map((e, i) => this.chip((i + 1) + ' · ' + e.titel, aus.indexOf(e.id) >= 0, () => {
        const neu = aus.indexOf(e.id) >= 0 ? aus.filter((x) => x !== e.id) : aus.concat(e.id);
        C.aus = neu.length === k.einheitenListe.length ? null : neu; rer();
      }, pool([e.id]).length))));
    }
    inhalt.push(el('p', { class: 'muted small', text: n + ' offene Fragen in der Auswahl.' }));
    inhalt.push(el('button', { class: 'btn primary wide gross', id: 'klausurLos', text: 'Klausur beginnen', disabled: !n, onclick: () => {
      const K = { qids: this._kWahl(pool(C.aus), Math.min(C.n, n), C.wahl).map((f) => f.qid), antworten: [], i: 0, t0: Date.now(), dauer: C.min * 60000, kurs: k.id, abgegeben: false, bewertung: [], ri: 0 };
      this._kSpeichern(K); this.ersetze(this.klausurLauf, K);
    } }));
    return this.seite({ titel: 'Klausur-Simulation', ueber: k.name, zurueck: true, inhalt });
  },
  _kWahl(pool, n, wahl) {
    const mit = pool.map((f) => ({ f, i: Lernlogik.info(f) }));
    if (wahl === 'zufall') return U.shuffle(pool).slice(0, n);
    if (wahl === 'neu') return U.shuffle(mit.filter((x) => x.i.neu)).concat(U.shuffle(mit.filter((x) => !x.i.neu))).slice(0, n).map((x) => x.f);
    // Schwächen: gut die Hälfte nach Dringlichkeit, der Rest zufällig (auch Neues), damit es nicht vorhersehbar wird
    const gesehen = mit.filter((x) => !x.i.neu).sort((a, b) => b.i.crit - a.i.crit), nk = Math.min(gesehen.length, Math.ceil(n * 0.6));
    const erste = gesehen.slice(0, nk).map((x) => x.f), rest = U.shuffle(pool.filter((f) => erste.indexOf(f) < 0));
    return U.shuffle(erste.concat(rest.slice(0, n - nk)));
  },

  klausurLauf(K) {
    const fr = K.qids.map((q) => Lerni.fragen[q]), f = fr[K.i];
    const ende = K.dauer ? K.t0 + K.dauer : 0;
    const uhr = el('span', { class: 'uhr' });
    const tick = () => {
      if (!ende) { uhr.textContent = U.fmtClock((Date.now() - K.t0) / 1000); return; }
      const rest = (ende - Date.now()) / 1000; uhr.textContent = U.fmtClock(rest); uhr.classList.toggle('knapp', rest < 300);
      if (rest <= 0 && !K.abgegeben) { clearInterval(iv); K.abgegeben = true; setTimeout(() => { this.toast('Zeit ist um – Abgabe'); abgeben(); }, 0); }   // nicht mitten im Aufbau der Seite wechseln
    };
    const iv = setInterval(tick, 1000);
    this._aufraeumen = () => { clearInterval(iv); clearTimeout(this._kt); this._kSpeichern(K); };   // letzte Tastendrücke sichern
    const ta = el('textarea', { class: 'antw gross', rows: 10, placeholder: 'Deine Antwort …', 'aria-label': 'Antwort auf Aufgabe ' + (K.i + 1) });
    ta.value = K.antworten[K.i] || '';
    ta.addEventListener('input', () => { K.antworten[K.i] = ta.value; clearTimeout(this._kt); this._kt = setTimeout(() => this._kSpeichern(K), 300); });
    const gehe = (i) => { K.antworten[K.i] = ta.value; K.i = i; this._kSpeichern(K); this.ersetze(this.klausurLauf, K); };
    const abgeben = () => { K.antworten[K.i] = ta.value; K.abgegeben = true; K.tEnde = Date.now(); K.ri = 0; this._kSpeichern(K); this.ersetze(this.klausurAuswertung, K); };
    const punkte = (x) => x.punkte || 10;
    const nav = el('div', { class: 'knav' }, fr.map((x, i) => el('button', { class: 'kn' + (i === K.i ? ' on' : '') + ((K.antworten[i] || '').trim() ? ' voll' : ''), text: String(i + 1), 'aria-label': 'Aufgabe ' + (i + 1), onclick: () => gehe(i) })));
    tick();
    return this.seite({
      titel: 'Aufgabe ' + (K.i + 1) + ' / ' + fr.length, ueber: 'Klausur-Simulation', ohneTabs: true, klasse: 'klausur',
      schliessen: async () => { if (await this.bestaetigen('Simulation unterbrechen?', 'Du kannst sie später unter „Klausur-Simulation“ fortsetzen. Die Zeit läuft weiter.', 'Unterbrechen')) this.tab('lernen'); },
      aktionen: [uhr],
      inhalt: [nav,
        el('div', { class: 'card frage-k' }, [el('div', { class: 'meta' }, [el('span', { text: punkte(f) + ' Punkte' })]), el('div', { class: 'md frage-t', html: frageHtml(f) }), ta]),
        el('div', { class: 'row' }, [
          K.i > 0 ? el('button', { class: 'btn', text: 'Zurück', onclick: () => gehe(K.i - 1) }) : null,
          K.i + 1 < fr.length ? el('button', { class: 'btn primary', text: 'Nächste Aufgabe', onclick: () => gehe(K.i + 1) }) : null,
        ]),
        el('button', { class: 'btn wide' + (K.i + 1 === fr.length ? ' primary' : ''), id: 'abgeben', text: 'Abgeben', onclick: async () => {
          const leer = fr.filter((_, i) => !(i === K.i ? ta.value : K.antworten[i] || '').trim()).length;
          if (await this.bestaetigen('Abgeben?', leer ? leer + ' Aufgabe(n) sind noch leer.' : 'Danach siehst du die Musterantworten.', 'Abgeben')) abgeben();
        } }),
      ],
    });
  },

  /* Auswertung: jede Aufgabe mit Musterantwort und Kernpunkten, danach die Gesamtpunkte */
  klausurAuswertung(K) {
    const fr = K.qids.map((q) => Lerni.fragen[q]);
    if (K.ri >= fr.length) return this.klausurErgebnis(K, fr);
    const f = fr[K.ri], antwort = K.antworten[K.ri] || '', haken = f.kernpunkte.map(() => false);
    const stand = el('span', { class: 'kpstand' });
    const weiter = el('button', { class: 'btn primary wide', id: 'kWeiter', onclick: () => {
      const s = Bewerter.offen(f, haken.filter(Boolean).length).s;
      K.bewertung[K.ri] = s;
      Store.antwort(f, s, false, Math.round(((K.tEnde || Date.now()) - K.t0) / fr.length), 'k', antwort);
      K.ri++; this._kSpeichern(K); this.ersetze(this.klausurAuswertung, K);
    } });
    const neu = () => { const n = haken.filter(Boolean).length; stand.textContent = n + ' von ' + f.kernpunkte.length; weiter.textContent = (K.ri + 1 < fr.length ? 'Nächste Aufgabe' : 'Zum Ergebnis') + ' · ' + Math.round(Bewerter.offen(f, n).s * (f.punkte || 10) * 10) / 10 + ' P.'; };
    const liste = el('div', { class: 'kps' }, f.kernpunkte.map((k, i) => el('button', { class: 'kp', 'aria-pressed': 'false', html: '<span class="mk"></span><span>' + U.inline(U.esc(k)) + '</span>', onclick: (ev) => { haken[i] = !haken[i]; ev.currentTarget.setAttribute('aria-pressed', String(haken[i])); neu(); } })));
    neu();
    return this.seite({
      titel: 'Auswertung ' + (K.ri + 1) + ' / ' + fr.length, ueber: 'Klausur-Simulation', ohneTabs: true,
      schliessen: async () => { if (await this.bestaetigen('Auswertung unterbrechen?', 'Du kannst sie später fortsetzen.', 'Unterbrechen')) this.tab('lernen'); },
      inhalt: [
        el('div', { class: 'card frage-k' }, [el('div', { class: 'md frage-t', html: frageHtml(f) })]),
        el('div', { class: 'card' }, [el('div', { class: 'lt-t', text: 'Deine Antwort' }), antwort.trim() ? el('p', { class: 'vorlage', text: antwort }) : el('p', { class: 'muted', text: '(leer)' })]),
        el('div', { class: 'card loesung' }, [el('div', { class: 'lt-t', text: 'Musterantwort' }), el('div', { class: 'md muster', html: U.md(f.antwort) }), f.bildLoesung ? el('div', { html: grafikHtml(f.kurs, f.bildLoesung) }) : null, f.erklaerung ? el('div', { class: 'erkl', html: U.md(f.erklaerung) }) : null]),
        el('div', { class: 'card kpbox' }, [el('div', { class: 'kphead' }, [el('span', { class: 'lt-t', text: 'Welche Kernpunkte hattest du?' }), stand]), liste,
          el('button', { class: 'btn small', text: 'Mit Claude prüfen', onclick: async () => { const ok = await U.kopieren(claudePrompt(f, antwort)); this.toast(ok ? 'Kopiert – in der Claude-App einfügen' : 'Kopieren ging nicht'); } })]),
        weiter,
      ],
    });
  },
  klausurErgebnis(K, fr) {
    const max = fr.reduce((a, f) => a + (f.punkte || 10), 0), erreicht = fr.reduce((a, f, i) => a + (K.bewertung[i] || 0) * (f.punkte || 10), 0);
    const q = max ? erreicht / max : 0;
    if (!K.gespeichert) {
      K.gespeichert = true;
      Store.sitzungEnde({ t: Math.floor(K.t0 / 1000), modus: 'klausur', titel: 'Klausur-Simulation', kurs: K.kurs, n: fr.length, r: K.bewertung.filter((s) => s >= RICHTIG).length, ms: (K.tEnde || Date.now()) - K.t0 });
      this._kLoeschen();
    }
    const alles = () => [
      'Bitte korrigiere meine Probeklausur wie ein strenger, fairer Prüfer. Gib je Aufgabe Punkte, sag was fehlt oder falsch ist, und fasse am Ende meine größten Lücken zusammen.', '',
      ...fr.map((f, i) => ['AUFGABE ' + (i + 1) + ' (' + (f.punkte || 10) + ' Punkte): ' + U.plain(f.frage), 'Kernpunkte: ' + f.kernpunkte.map(U.plain).join('; '), 'Meine Antwort: ' + ((K.antworten[i] || '').trim() || '(leer)'), ''].join('\n')),
    ].join('\n');
    return this.seite({
      titel: 'Klausur-Ergebnis', ueber: 'Klausur-Simulation', ohneTabs: true, schliessen: () => this.tab('lernen'),
      inhalt: [
        el('div', { class: 'card ergebnis' }, [
          this.ring(q, U.fmtPct(q), 'Punkte', q >= 0.8 ? 'var(--ok)' : q >= 0.5 ? 'var(--mid)' : 'var(--bad)'),
          el('div', { class: 'einfo' }, [
            el('b', { text: (Math.round(erreicht * 10) / 10).toLocaleString('de-DE') + ' von ' + max + ' Punkten' }),
            el('div', { class: 'muted small', text: q >= 0.5 ? 'Nach der üblichen 50-%-Grenze bestanden.' : 'Unter der üblichen 50-%-Grenze – die Kernpunkte unten zeigen, wo es hakt.' }),
            el('div', { class: 'muted small', text: 'Bearbeitungszeit ' + U.fmtDur((K.tEnde || Date.now()) - K.t0) }),
          ]),
        ]),
        el('div', { class: 'liste' }, fr.map((f, i) => el('button', { class: 'zeile frage', onclick: () => this.oeffne(this.frageDetail, f.qid) }, [
          el('span', { class: 'dots' }, [el('i', { class: Lernlogik.ergebnis(K.bewertung[i] || 0) })]),
          el('span', { class: 'zb' }, [el('span', { class: 'zt', text: U.short(f.frage, 100) }), el('span', { class: 'zm', text: Math.round((K.bewertung[i] || 0) * (f.punkte || 10) * 10) / 10 + ' / ' + (f.punkte || 10) + ' Punkte' })]),
        ]))),
        el('div', { class: 'row wrap' }, [
          el('button', { class: 'btn', text: 'Ganze Klausur an Claude', onclick: async () => { const ok = await U.kopieren(alles()); this.toast(ok ? 'Kopiert – in der Claude-App einfügen' : 'Kopieren ging nicht'); } }),
          el('button', { class: 'btn primary', text: 'Fertig', onclick: () => this.tab('lernen') }),
        ]),
      ],
    });
  },
};
Object.assign(App, UIKlausur);

</script>
<script>
/* LERNI – Start: Lernstand laden, Inhalte verknüpfen, Oberfläche zeigen, Service Worker und Updates.

   Updates: Der Service Worker holt die Seite immer zuerst aus dem Netz (offline aus dem Speicher).
   Kommt die App aus dem Hintergrund zurück, fragt sie version.json ab. Ist eine neuere Version online,
   lädt sie neu – auf der Startseite sofort, sonst nach Rückfrage (damit keine Lernrunde abbricht). */
'use strict';

const Updates = {
  _zuletzt: 0,
  async pruefen(manuell) {
    if (typeof LERNI_BUILD === 'undefined' || location.protocol === 'file:') { if (manuell) App.toast('Entwicklungsfassung – keine Updates'); return; }
    if (!manuell && Date.now() - this._zuletzt < 60000) return;
    this._zuletzt = Date.now();
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const v = await r.json();
      if (!v.id || v.id === LERNI_BUILD.id) { if (manuell) App.toast('Du hast die neueste Version'); return; }
      const cur = App.stapel[App.stapel.length - 1], ruhig = !cur || cur.fn === App.home || cur.fn === App.logbuch || cur.fn === App.einstellungen;
      if (ruhig && !manuell) { location.reload(); return; }
      App.banner('Neue Version verfügbar (' + v.stamp + ')', 'Aktualisieren', () => location.reload());
    } catch (e) { if (manuell) App.toast('Keine Verbindung – später nochmal'); }
  },
};

function lerniStart() {
  Lerni.fertig();
  Store.load();
  App.init();
  App.tab('lernen');
  if (Store.data.set.kurs == null && App.kurs()) { Store.data.set.kurs = App.kurs().id; Store.save(); }
  Store.dauerhaft();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && typeof LERNI_BUILD !== 'undefined') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Service Worker geht es auch, nur nicht offline */ });
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Updates.pruefen(false); App.neuWennRuhig(); } });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => App.theme());
  setTimeout(() => Updates.pruefen(false), 3000);

  if (/[?&]selftest\b/.test(location.search)) {
    const s = document.createElement('script'); s.src = 'selftest.js?t=' + Date.now(); document.body.appendChild(s);
  }
}
/* Nach Mitternacht oder langer Pause: Startseite neu zeichnen (fällige Fragen, Tagesziel) */
App.neuWennRuhig = function () {
  const cur = this.stapel[this.stapel.length - 1];
  if (cur && (cur.fn === this.home || cur.fn === this.logbuch)) this.neu();
};

window.lerni = { App, Store, Lerni, Lernlogik, Bewerter, TYP_UI, Updates };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lerniStart); else lerniStart();
//# sourceURL=js/main.js
</script>
