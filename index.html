  <style>
/* LERNI – Oberfläche. Farben als Tokens, hell und dunkel. Kein backdrop-filter (bremst ältere iPhones). */
:root {
  --bg: #f5f6fa; --card: #ffffff; --card2: #eef0f6; --text: #151827; --muted: #686d82; --line: #e2e4ed;
  --pri: #4f46e5; --pri-t: #ffffff; --pri-soft: #ebe9fd;
  --ok: #15803d; --ok-soft: #e4f5ea; --mid: #c26a04; --mid-soft: #fcf0de; --bad: #d42626; --bad-soft: #fde7e7;
  --st-neu: #c3c6d4; --bar: #c7cadb;
  --shadow: 0 1px 2px rgba(20, 24, 40, .05), 0 6px 18px rgba(20, 24, 40, .05);
  --r: 16px; --tabs: 58px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131f; --card: #1a1e2e; --card2: #252a3b; --text: #eceef6; --muted: #9ba1b8; --line: #2d3348;
    --pri: #8b93fa; --pri-t: #10131f; --pri-soft: #292c4f;
    --ok: #4ade80; --ok-soft: #16301f; --mid: #fbbf24; --mid-soft: #33290f; --bad: #f87171; --bad-soft: #3b1b1e;
    --st-neu: #464c64; --bar: #3b4159; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131f; --card: #1a1e2e; --card2: #252a3b; --text: #eceef6; --muted: #9ba1b8; --line: #2d3348;
  --pri: #8b93fa; --pri-t: #10131f; --pri-soft: #292c4f;
  --ok: #4ade80; --ok-soft: #16301f; --mid: #fbbf24; --mid-soft: #33290f; --bad: #f87171; --bad-soft: #3b1b1e;
  --st-neu: #464c64; --bar: #3b4159; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
ul, ol { margin: 0 0 10px; padding-left: 22px; }
ul:last-child, ol:last-child { margin-bottom: 0; }
li { margin: 3px 0; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Gerüst ---------- */
#view { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--tabs) + var(--safe-b) + 24px); }
body.ohne-tabs #view { padding-bottom: calc(var(--safe-b) + 16px); }
body.ohne-tabs #tabs { display: none; }
.seite { max-width: 680px; margin: 0 auto; min-height: 100%; }
.kopf {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px;
  padding: calc(var(--safe-t) + 10px) 12px 10px 16px; background: var(--bg); border-bottom: 1px solid transparent;
}
.kopf .kt { flex: 1; min-width: 0; }
.kopf h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 750; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kopf .ueber { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kopf .ka { display: flex; align-items: center; gap: 4px; }
.lernen .kopf h1, .klausur .kopf h1 { font-size: 19px; }
.ib { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; color: var(--text); }
.ib:active { background: var(--card2); }
.ib.on { color: var(--mid); }
.ib.on svg { fill: currentColor; }
.inhalt { padding: 4px 16px 16px; }

#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
  height: calc(var(--tabs) + var(--safe-b)); padding-bottom: var(--safe-b); background: var(--card); border-top: 1px solid var(--line);
}
#tabs button { flex: 1; max-width: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
#tabs button.on { color: var(--pri); }
#toast {
  position: fixed; left: 50%; bottom: calc(var(--tabs) + var(--safe-b) + 14px); transform: translate(-50%, 20px); z-index: 30;
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg);
  font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
body.ohne-tabs #toast { bottom: calc(var(--safe-b) + 90px); }
#banner {
  position: fixed; left: 12px; right: 12px; top: calc(var(--safe-t) + 8px); z-index: 25; display: flex; align-items: center; gap: 10px;
  max-width: 656px; margin: 0 auto; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--pri-soft); color: var(--text); font-size: 15px; font-weight: 600; box-shadow: var(--shadow);
}
#banner span { flex: 1; }

/* ---------- Bausteine ---------- */
.card { background: var(--card); border-radius: var(--r); padding: 16px; margin: 0 0 12px; box-shadow: var(--shadow); }
.card.hinweis { background: var(--pri-soft); box-shadow: none; }
.card.hinweis p { margin: 6px 0 10px; font-size: 15px; }
.abschnitt { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 26px 2px 10px; display: flex; align-items: center; gap: 8px; }
.abschnitt svg { width: 18px; height: 18px; }
.leer { color: var(--muted); text-align: center; padding: 30px 10px; }
.row { display: flex; gap: 10px; margin-top: 12px; }
.row.wrap { flex-wrap: wrap; }
.row > .btn { flex: 1; }
.row.wrap > .btn { flex: 1 1 auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px;
  border-radius: 13px; background: var(--card2); color: var(--text); font-weight: 650; font-size: 16px; text-align: center;
}
.btn svg { width: 19px; height: 19px; }
.btn:active:not(:disabled) { filter: brightness(.94); }
.btn.primary { background: var(--pri); color: var(--pri-t); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.wide { display: flex; width: 100%; margin-top: 12px; }
.btn.gross { min-height: 54px; font-size: 18px; }
.btn:disabled { opacity: .45; }

.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 84px; height: 84px; }
.ring circle { fill: none; stroke-width: 8; }
.ring .rg { stroke: var(--card2); }
.ring .rv { stroke-linecap: round; transition: stroke-dasharray .4s; }
.ring .rt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.ring .rt b { font-size: 17px; }
.ring .rt small { font-size: 11px; color: var(--muted); }

.sbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--card2); margin: 6px 0; }
.sbar i { display: block; height: 100%; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
.legende span { display: inline-flex; align-items: center; gap: 5px; }
.legende i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dots i.richtig { background: var(--ok); } .dots i.teilweise { background: var(--mid); } .dots i.falsch { background: var(--bad); }
.dots i.u { background: transparent !important; box-shadow: inset 0 0 0 2px var(--mid); }
.dots i.richtig.u { box-shadow: inset 0 0 0 2px var(--ok); }
.dots i.falsch.u { box-shadow: inset 0 0 0 2px var(--bad); }

.seg { display: inline-flex; background: var(--card2); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { min-height: 34px; padding: 4px 12px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.inhalt > .seg { display: flex; margin-bottom: 14px; }
.inhalt > .seg button { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 600; }
.chip b { font-size: 12px; color: var(--muted); }
.chip.on { background: var(--pri); color: var(--pri-t); }
.chip.on b { color: inherit; opacity: .8; }

.liste { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.zeile { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; border-top: 1px solid var(--line); min-height: 56px; }
.zeile:first-child { border-top: 0; }
button.zeile:active { background: var(--card2); }
.zeile.sel { background: var(--pri-soft); }
.zeile .zb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.zeile .zt { font-weight: 600; font-size: 16px; line-height: 1.3; }
.zeile .zm { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.zeile .pf { color: var(--muted); }
.zeile .pf svg { width: 18px; height: 18px; }
.zeile .nr { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--pri-soft); color: var(--pri); font-weight: 750; font-size: 15px; flex: none; }
.zeile .stl { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.zeile .quote { font-size: 15px; }
.zeile.frage .zt { font-weight: 500; font-size: 15px; }
.zeile .sbar { margin: 4px 0 0; height: 6px; }

.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.kpi b { font-size: 21px; line-height: 1.2; }
.kpi small { font-size: 13px; color: var(--muted); }
@media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, 1fr); } }

.einst { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.einst:first-child { border-top: 0; padding-top: 0; }
.einst .et { font-weight: 600; }
.einst small { display: block; color: var(--muted); font-size: 13px; max-width: 360px; }
input.datum { min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); font-size: 16px; }

/* ---------- Start ---------- */
.kurswahl { padding: 8px 12px; border-radius: 10px; background: var(--card2); font-weight: 650; font-size: 14px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.klausur { display: flex; align-items: center; gap: 16px; }
.card.klausur.leer { justify-content: space-between; flex-wrap: wrap; text-align: left; padding: 16px; }
.card.klausur.leer small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.card.klausur .kz { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
.card.klausur .kz b { font-size: 34px; line-height: 1; color: var(--pri); }
.card.klausur .kz small { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; margin-top: 4px; }
.card.klausur .kinfo { display: flex; flex-direction: column; gap: 8px; font-size: 15px; flex: 1; }
.card.klausur .kinfo input { align-self: flex-start; }
.card.heute .hz { display: flex; align-items: center; gap: 16px; }
.card.heute .hinfo { display: flex; flex-direction: column; gap: 3px; font-size: 15px; }
.serie { display: flex; align-items: center; gap: 4px; font-size: 16px; }
.serie svg { color: #f97316; width: 20px; height: 20px; }
.serie b { font-size: 18px; }
.fertig { margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--ok-soft); font-size: 15px; }
.kacheln { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .kacheln { grid-template-columns: repeat(3, 1fr); } }
.kachel { background: var(--card); border-radius: 14px; padding: 12px 13px; text-align: left; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 104px; }
.kachel:active { filter: brightness(.96); }
.kachel .kn { font-weight: 700; font-size: 15px; line-height: 1.25; }
.kachel b { font-size: 26px; line-height: 1.1; margin: 4px 0 2px; color: var(--pri); }
.kachel small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.kachel.leer b { color: var(--muted); }
.kachel.leer { opacity: .7; }
#k_klausur { background: var(--pri-soft); box-shadow: none; }

/* ---------- Einheit, Skript ---------- */
details.skript { background: var(--card); border-radius: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
details.skript summary, details.card summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 650; }
details.skript summary { padding: 14px 16px; }
details.skript summary small { color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; }
details summary::-webkit-details-marker { display: none; }
details.skript summary::after, details.card summary::after { content: '›'; font-size: 22px; color: var(--muted); transition: transform .2s; }
details[open] summary::after { transform: rotate(90deg); }
details.skript .md { padding: 0 16px 4px; }
details.skript .btn { margin: 0 16px 16px; }

.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li { margin: 3px 0; }
.md h4 { margin: 14px 0 6px; font-size: 16px; }
/* Eigene Skizzen (Lerni.grafik): Farben über Tokens, damit hell und dunkel passen. Antippen vergrößert. */
.grafik { margin: 12px 0; padding: 10px; background: var(--card2); border-radius: 12px; cursor: zoom-in; }
.grafik .gsvg svg { display: block; width: 100%; height: auto; max-height: 440px; stroke: var(--text); stroke-width: 1.4; fill: none; font-size: 12.5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
.grafik svg text { fill: var(--text); stroke: none; }
.grafik svg .k { font-size: 10.5px; } .grafik svg .g { font-size: 15px; } .grafik svg .b { font-weight: 700; }
.grafik svg .m, .grafik svg .m text { fill: var(--muted); } .grafik svg .tp, .grafik svg .tp text { fill: var(--pri); } .grafik svg .to, .grafik svg .to text { fill: var(--ok); }
.grafik svg .tm, .grafik svg .tm text { fill: var(--mid); } .grafik svg .tb, .grafik svg .tb text { fill: var(--bad); }
.grafik svg .f0 { fill: var(--card); } .grafik svg .f1 { fill: var(--pri-soft); } .grafik svg .f2 { fill: var(--ok-soft); } .grafik svg .f3 { fill: var(--mid-soft); } .grafik svg .f4 { fill: var(--bad-soft); } .grafik svg .fl { fill: var(--line); }
.grafik svg .s1 { stroke: var(--pri); } .grafik svg .s2 { stroke: var(--ok); } .grafik svg .s3 { stroke: var(--mid); } .grafik svg .s4 { stroke: var(--bad); } .grafik svg .sm { stroke: var(--muted); } .grafik svg .s0 { stroke: none; }
.grafik svg .d { stroke-dasharray: 5 4; } .grafik svg .w { stroke-width: 2.6; } .grafik svg .n { stroke-width: .9; }
.grafik svg .pf { fill: var(--text); stroke: none; } .grafik svg .pfp { fill: var(--pri); stroke: none; }
.grafik figcaption { margin-top: 8px; font-size: 14px; color: var(--muted); line-height: 1.35; }
.grafik figcaption b { color: var(--text); }
.glupe { position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow: auto; padding: calc(var(--safe-t) + 56px) 12px calc(var(--safe-b) + 20px); animation: dlgin .15s; }
.glupe .grafik { cursor: zoom-out; max-width: 1100px; margin: 0 auto; }
.glupe .grafik .gsvg svg { max-height: none; }
.glupe .ib { position: fixed; top: calc(var(--safe-t) + 8px); right: 12px; z-index: 46; background: var(--card); border-radius: 50%; }
.glupe .ghint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }
mark { background: color-mix(in srgb, var(--mid) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; background: var(--card2); border-radius: 5px; padding: 1px 5px; }
.math { font-family: "Times New Roman", Georgia, serif; font-style: italic; font-size: 1.05em; white-space: nowrap; }

/* ---------- Lernrunde ---------- */
/* Knöpfe unten in Daumenreichweite, auch wenn die Frage kurz ist */
.seite.lernen { display: flex; flex-direction: column; }
.seite.lernen .inhalt { flex: 1; display: flex; flex-direction: column; width: 100%; }
.seite.lernen .fuss { margin-top: auto; }
.fbar { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; margin: 0 0 12px; }
.fbar i { display: block; height: 100%; background: var(--pri); border-radius: 2px; transition: width .3s; }
.frage-k { padding: 18px 16px; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.badge { font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; }
.badge.neu { background: var(--pri-soft); color: var(--pri); }
.badge.wdh { background: var(--mid-soft); color: var(--mid); }
.wichtig { color: var(--mid); letter-spacing: 1px; }
.frage-t { font-size: 19px; line-height: 1.45; font-weight: 550; margin-bottom: 16px; }
.hint { font-size: 13px; color: var(--muted); margin: -6px 0 10px; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 13px; text-align: left; background: var(--card2); border: 2px solid transparent; font-size: 16px; line-height: 1.35; }
.opt .mk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; margin-top: 1px; position: relative; }
.opts.mehr .opt .mk { border-radius: 6px; }
.opt .ot { flex: 1; min-width: 0; }
.opt[aria-pressed="true"] { border-color: var(--pri); background: var(--pri-soft); }
.opt[aria-pressed="true"] .mk { border-color: var(--pri); background: var(--pri); box-shadow: inset 0 0 0 3px var(--pri-soft); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .mk { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 3px var(--ok-soft); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .mk { border-color: var(--bad); background: var(--bad); box-shadow: inset 0 0 0 3px var(--bad-soft); }
.opt.missed { border-color: var(--ok); border-style: dashed; }
.opt.dim { opacity: .55; }
.opt:disabled { color: var(--text); }
.opt .warum { flex-basis: 100%; font-size: 14px; color: var(--muted); padding-left: 34px; }
.opts.wf { flex-direction: row; }
.opts.wf .opt { justify-content: center; font-weight: 700; font-size: 17px; min-height: 56px; align-items: center; }

<script>
/* LERNI – Inhalte: Kurse, Einheiten und Fragen registrieren, prüfen und nachschlagen.
   Inhaltsdateien (content/<kurs>/*.js) rufen Lerni.kurs({...}) und Lerni.einheit('kurs', {...}) auf.
   Das Format ist in docs/INHALTE.md beschrieben. Läuft auch in Node (tools/check.js). */
'use strict';

/* Fragetypen: Anzeigename, Standard-Stufe im Lernpfad (1 Erkennen, 2 Erinnern, 3 Erklären), Pflichtfelder */
const TYPEN = {
  offen: { name: 'Offene Frage', stufe: 3, felder: ['frage', 'antwort', 'kernpunkte'] },
  karte: { name: 'Karteikarte', stufe: 2, felder: ['vorne', 'hinten'] },
  luecke: { name: 'Lückentext', stufe: 2, felder: ['text'] },
  mc: { name: 'Auswahl', stufe: 1, felder: ['frage', 'optionen'] },
  wf: { name: 'Wahr oder falsch', stufe: 1, felder: ['aussage', 'wahr'] },
  reihe: { name: 'Reihenfolge', stufe: 2, felder: ['frage', 'schritte'] },
  paare: { name: 'Zuordnen', stufe: 1, felder: ['frage', 'paare'] },
  zahl: { name: 'Rechnen', stufe: 2, felder: ['frage', 'loesung'] },
};
const STUFEN = ['', 'Erkennen', 'Erinnern', 'Erklären'];

const Lerni = {
  kurse: [], kursById: {}, fragen: {},            // fragen: qid → Frage
  _roh: [],                                       // Einheiten in Ladereihenfolge, verknüpft in fertig()
  grafiken: {},                                   // 'kurs:id' → { titel, svg, text } – eigene Skizzen (SVG), siehe docs/INHALTE.md

  kurs(def) { this.kurse.push(def); this.kursById[def.id] = def; def.einheitenListe = []; },
  einheit(kursId, def) { this._roh.push({ kursId, def }); },
  grafik(kursId, id, def) { this.grafiken[kursId + ':' + id] = def; },
  grafikVon(kursId, id) { return this.grafiken[kursId + ':' + id]; },
  /* Grafik-Namen eines Felds (bild: 'x' oder ['x', 'y']) als Liste */
  bilder(v) { return v == null || v === '' ? [] : Array.isArray(v) ? v : [v]; },

  /* Nach dem Laden aller Inhaltsdateien: Einheiten den Kursen zuordnen, Fragen verknüpfen und nummerieren */
  fertig() {
    this.fragen = {};
    for (const k of this.kurse) k.einheitenListe = [];
    for (const { kursId, def } of this._roh) {
      const k = this.kursById[kursId]; if (!k) continue;
      def.kurs = kursId; k.einheitenListe.push(def);
    }
    for (const k of this.kurse) {
      const ord = k.einheiten || [];
      k.einheitenListe.sort((a, b) => ((ord.indexOf(a.id) + 1) || 999) - ((ord.indexOf(b.id) + 1) || 999));
      k.alleFragen = [];
      k.einheitenListe.forEach((e, ei) => {
        e.nr = ei;
        const themen = [];
        for (const s of e.skript || []) if (s.thema && themen.indexOf(s.thema) < 0) themen.push(s.thema);
        (e.fragen || []).forEach((f, fi) => {
          if (f.thema && themen.indexOf(f.thema) < 0) themen.push(f.thema);
          f.qid = this.qid(k.id, f.id); f.kurs = k.id; f.einheit = e.id;
          f.stufe = f.stufe || (TYPEN[f.typ] || {}).stufe || 2;
          f.wichtig = f.wichtig || 1;
          f.ord = ei * 100000 + (themen.indexOf(f.thema) + 1) * 1000 + fi;   // Lernpfad: Einheit, Thema, Datei
          if (!this.fragen[f.qid]) { this.fragen[f.qid] = f; k.alleFragen.push(f); }
        });
        e.themen = themen;
      });
    }
    this.kurse.sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0));
  },

  qid: (kursId, frageId) => kursId + ':' + frageId,
  einheitVon(f) { const k = this.kursById[f.kurs]; return k && k.einheitenListe.find((e) => e.id === f.einheit); },
  sichtbareKurse() { return this.kurse.filter((k) => !k.versteckt); },

  /* Lücken in „Der [[Testeffekt|Testing-Effekt]] besagt …“ → [{ a: ['Testeffekt', 'Testing-Effekt'] }] */
  luecken(text) {
    const teile = String(text || '').split(/\[\[(.+?)\]\]/), out = [];
    for (let i = 1; i < teile.length; i += 2) out.push({ a: teile[i].split('|').map((x) => x.trim()).filter(Boolean) });
    return { teile, luecken: out };
  },
  /* Toleranz einer Rechenaufgabe: Zahl (absolut) oder „2%“ (relativ); Standard 0,5 % */
  toleranz(f) {
    const t = f.toleranz;
    if (typeof t === 'number') return Math.abs(t);
    if (typeof t === 'string' && /%$/.test(t.trim())) return Math.abs(f.loesung) * parseFloat(t) / 100;
    return Math.max(Math.abs(f.loesung) * 0.005, 1e-9);
  },

  /* Inhalte prüfen: fehler = App würde falsch lernen, hinweise = Qualität */
  pruefen() {
    const fehler = [], hinweise = [];
    const F = (w, t) => fehler.push(w + ': ' + t), H = (w, t) => hinweise.push(w + ': ' + t);
    const leer = (v) => v == null || (typeof v === 'string' && !v.trim()) || (Array.isArray(v) && !v.length);
    const idsKurs = {};
    for (const { kursId, def } of this._roh) if (!this.kursById[kursId]) F('Einheit ' + def.id, 'Kurs „' + kursId + '“ gibt es nicht (Lerni.kurs fehlt oder steht später)');
    for (const k of this.kurse) {
      const wk = 'Kurs ' + k.id;
      if (!/^[a-z0-9-]+$/.test(k.id || '')) F(wk, 'id nur aus a–z, 0–9 und -');
      if (leer(k.name)) F(wk, 'name fehlt');
      if (k.klausur && U.keyToNum(k.klausur) == null) F(wk, 'klausur als JJJJ-MM-TT angeben');
      const ids = idsKurs[k.id] = {}, eids = {};
      const entfernt = new Set(k.entfernt || []);
      for (const e of k.einheitenListe) {
        const we = wk + ' / Einheit ' + e.id;
        if (eids[e.id]) F(we, 'Einheit doppelt'); eids[e.id] = 1;
        if (leer(e.titel)) F(we, 'titel fehlt');
        if (!Array.isArray(e.fragen)) { F(we, 'fragen muss eine Liste sein'); continue; }
        const bildOk = (w, v) => { for (const b of this.bilder(v)) if (!this.grafikVon(k.id, b)) F(w, 'Grafik „' + b + '“ gibt es nicht (Lerni.grafik fehlt)'); };
        for (const s of e.skript || []) { if (leer(s.titel) || leer(s.text)) F(we, 'Skript-Abschnitt ohne titel oder text'); bildOk(we + ' / Skript ' + s.titel, s.bild); }
        for (const f of e.fragen) {
          const w = we + ' / ' + (f.id || '(ohne id)');
          if (!/^[A-Za-z0-9._-]+$/.test(f.id || '')) { F(w, 'id fehlt oder enthält Sonderzeichen'); continue; }
          if (ids[f.id]) F(w, 'id doppelt im Kurs'); ids[f.id] = 1;
          if (entfernt.has(f.id)) F(w, 'id steht in kurs.entfernt – entfernte ids nie wiederverwenden');
          const T = TYPEN[f.typ];
          if (!T) { F(w, 'unbekannter typ „' + f.typ + '“'); continue; }
          for (const feld of T.felder) if (leer(f[feld]) && f[feld] !== false) F(w, 'Feld ' + feld + ' fehlt');
          if (![1, 2, 3].includes(f.stufe)) F(w, 'stufe muss 1, 2 oder 3 sein');
          if (![1, 2, 3].includes(f.wichtig)) F(w, 'wichtig muss 1, 2 oder 3 sein');
          if (leer(f.thema)) H(w, 'thema fehlt (für Lernpfad und Mischen)');
          bildOk(w, f.bild); bildOk(w, f.bildLoesung);
          this._pruefeTyp(f, w, F, H);
        }
      }
      for (const id of entfernt) if (!/^[A-Za-z0-9._-]+$/.test(id)) F(wk, 'kurs.entfernt enthält ungültige id ' + id);
    }
    for (const [key, g] of Object.entries(this.grafiken)) {
      const w = 'Grafik ' + key;
      if (!this.kursById[key.split(':')[0]]) F(w, 'Kurs fehlt');
      if (!g || typeof g.svg !== 'string' || !/^\s*<svg[\s>]/.test(g.svg) || !/<\/svg>\s*$/.test(g.svg)) F(w, 'svg muss mit <svg beginnen und mit </svg> enden');
      else if (/<script|\son\w+\s*=|javascript:|<foreignObject/i.test(g.svg)) F(w, 'svg enthält Skript oder Ereignis-Attribute');
      else if (!/viewBox=/.test(g.svg)) F(w, 'svg braucht viewBox (sonst skaliert es nicht)');
      if (!g || leer(g.titel)) H(w, 'titel fehlt');
    }
    return { fehler, hinweise };
  },
  _pruefeTyp(f, w, F, H) {
    switch (f.typ) {
      case 'offen':
        if (!Array.isArray(f.kernpunkte)) F(w, 'kernpunkte muss eine Liste sein');
        else if (f.kernpunkte.length < 2) H(w, 'weniger als 2 Kernpunkte – Selbstbewertung wird grob');
        if (f.punkte != null && !(f.punkte > 0)) F(w, 'punkte muss > 0 sein');
        break;
      case 'luecke': {
        const L = this.luecken(f.text).luecken;
        if (!L.length) F(w, 'Lückentext ohne [[Lücke]]');
        if (L.some((l) => !l.a.length)) F(w, 'leere Lücke [[ ]]');
        if (f.ablenker && !Array.isArray(f.ablenker)) F(w, 'ablenker muss eine Liste sein');
        break;
      }
      case 'mc':
        if (!Array.isArray(f.optionen) || f.optionen.length < 2) { F(w, 'mindestens 2 optionen'); break; }
        if (f.optionen.some((o) => !o || typeof o.t !== 'string' || !o.t.trim())) F(w, 'jede Option braucht t');
        if (!f.optionen.some((o) => o.r)) F(w, 'keine Option ist richtig (r: true)');
        if (new Set(f.optionen.map((o) => U.norm(o.t))).size < f.optionen.length) F(w, 'Optionen doppelt');
        break;
      case 'wf':
        if (typeof f.wahr !== 'boolean') F(w, 'wahr muss true oder false sein');
        if (!f.warum) H(w, 'warum fehlt – gerade bei „falsch“ wichtig');
        break;
      case 'reihe':
        if (!Array.isArray(f.schritte) || f.schritte.length < 3) F(w, 'mindestens 3 schritte');
        else if (new Set(f.schritte.map(U.norm)).size < f.schritte.length) F(w, 'Schritte doppelt');
        break;
      case 'paare':
        if (!Array.isArray(f.paare) || f.paare.length < 2 || f.paare.some((p) => !Array.isArray(p) || p.length !== 2)) { F(w, 'paare als [[links, rechts], …] mit mindestens 2 Paaren'); break; }
        if (new Set(f.paare.map((p) => U.norm(p[0]))).size < f.paare.length || new Set(f.paare.map((p) => U.norm(p[1]))).size < f.paare.length) F(w, 'Paare nicht eindeutig');
        if (f.paare.length > 6) H(w, 'mehr als 6 Paare wird am Handy eng');
        break;
      case 'zahl':
        if (typeof f.loesung !== 'number' || !isFinite(f.loesung)) F(w, 'loesung muss eine Zahl sein');
        if (f.toleranz != null && !(typeof f.toleranz === 'number' || /^\s*\d+([.,]\d+)?\s*%\s*$/.test(String(f.toleranz)))) F(w, 'toleranz als Zahl oder "2%"');
        if (!f.rechenweg) H(w, 'rechenweg fehlt');
        break;
    }
  },
};

- Ressourcen, Arbeitskräfte, Wissen, Kapital und Konsument:innen sind **geographisch ungleich verteilt**.

    { id: 'e01-07', typ: 'offen', thema: 'Definitionen', wichtig: 2, punkte: 4, quelle: 'VL03, S. 12 und 35',

      antwort: `1. Wie sind wirtschaftliche Aktivitäten ungleichmäßig über den Raum verteilt, und wie lässt sich das erklären? 2. Wie prägen die einzigartigen Merkmale bestimmter Orte die Form und Entwicklung wirtschaftlicher Aktivitäten? 3. Wie sind wirtschaftliche Aktivitäten im Raum miteinander verbunden, sodass das Geschehen an einem Ort andere Orte beeinflusst? 4. Wie zeigt sich Macht über den Raum, vor allem in staatlich kontrollierten Territorien, im Wirtschaftsleben?`,
      kernpunkte: ['Ungleiche Verteilung wirtschaftlicher Aktivitäten im Raum (und ihre Erklärung)', 'Einfluss der besonderen Merkmale von Orten (place)', 'Verbindungen zwischen Orten (Netzwerke): was an einem Ort passiert, beeinflusst andere', 'Macht über den Raum (Territorien, Staat)'],
      erklaerung: 'Die dahinterliegenden Schlüsselkonzepte: **ungleiche Entwicklung, Ort (place), Netzwerke, territoriale Macht**.' },

    /* ---------- Abgrenzung ---------- */
    { id: 'e01-08', typ: 'offen', thema: 'Abgrenzung', wichtig: 2, punkte: 4, quelle: 'VL03, S. 15',
      frage: 'Nennen Sie vier Unterschiede zwischen der neoklassischen Mainstream-Ökonomie und der Wirtschaftsgeographie (nach MacKinnon/Cumbers).',
      antwort: `Die Mainstream-Ökonomie sieht die Wirtschaft als autonome Sphäre mit eigenen Gesetzen, die Wirtschaftsgeographie als eingebettet in soziale, politische und kulturelle Beziehungen. Die Ökonomie geht vom rationalen Handeln eigeninteressierter Individuen aus, die WiGeo von Individuen und Gruppen, die in bestimmten geographischen Kontexten handeln. Für die Ökonomie ist Geographie unwichtig, weil überall dieselben Kräfte wirken; für die WiGeo ist sie grundlegend. Ungleiche Entwicklung gilt der Ökonomie als vorübergehend (Marktkräfte gleichen aus), der WiGeo als dauerhaft und tief verwurzelt.`,
      kernpunkte: ['Wirtschaft: autonome Sphäre ↔ eingebettet in soziale, politische, kulturelle Beziehungen', 'Handeln: rationale, eigeninteressierte Individuen ↔ Akteure in bestimmten geographischen Kontexten', 'Geographie: ignoriert (universelle Kräfte) ↔ grundlegend', 'Ungleiche Entwicklung: vorübergehend, von Marktkräften beseitigt ↔ dauerhaft, tief verwurzelt'] },
    { id: 'e01-09', typ: 'mc', thema: 'Abgrenzung', wichtig: 2, quelle: 'VL03, S. 15–16',
      frage: 'Wie sieht die neoklassische Mainstream-Ökonomie laut Vorlesung ungleiche räumliche Entwicklung?',
      optionen: [
        { t: 'Als vorübergehendes Phänomen, das Marktkräfte beseitigen', r: true, warum: 'Genau so steht es in der Tabelle nach MacKinnon/Cumbers.' },
        { t: 'Als dauerhaftes, tief verwurzeltes Merkmal', warum: 'Das ist die Sicht der Wirtschaftsgeographie.' },
        { t: 'Als Wesensmerkmal der kapitalistischen Entwicklung', warum: 'Das ist die Sicht der Geographischen Politischen Ökonomie (Harvey).' },
        { t: 'Als Folge unterschiedlicher Denkstile der Forschung', warum: 'Denkstile erklären Theorien, nicht ungleiche Entwicklung selbst.' },
      ] },
    { id: 'e01-10', typ: 'wf', thema: 'Abgrenzung', wichtig: 2, quelle: 'VL03, S. 16',
      aussage: 'Der Mainstream der Wirtschaftswissenschaften geht laut Vorlesung von einer „laborförmigen“ Welt aus, in der überall die gleichen Bedingungen und Gesetze gelten.',
      wahr: true, warum: 'Die WiGeo setzt dagegen eine Welt voraus, die durch räumliche Unterschiede und Ungleichheit geprägt ist.' },

    /* ---------- Gliederung ---------- */
    { id: 'e01-11', typ: 'mc', thema: 'Gliederung', quelle: 'VL03, S. 18',
      frage: 'Gliederung nach Wirtschaftssektoren: Welche Zuordnung trifft **nicht** zu?',
      optionen: [
        { t: 'Fischerei – sekundärer Sektor', r: true, warum: 'Fischerei ist Urproduktion und gehört zum primären Sektor.' },
        { t: 'Bergbau – primärer Sektor', warum: 'Trifft zu: Bergbau zählt zur Urproduktion.' },
        { t: 'Bauwirtschaft – sekundärer Sektor', warum: 'Trifft zu: Bau gehört zur Sachgüterproduktion.' },
        { t: 'Banken – tertiärer Sektor', warum: 'Trifft zu: Banken sind Dienstleistungen.' },
      ] },
    { id: 'e01-12', typ: 'offen', thema: 'Gliederung', punkte: 2, quelle: 'VL03, S. 18',
      frage: 'Begründen Sie, warum eine streng sektorale Gliederung der Wirtschaftsgeographie immer weniger zeitgemäß ist.',
      antwort: `Zum einen gibt es statistische Zuordnungsprobleme, weil etwa in Großunternehmen ganz unterschiedliche Tätigkeiten (Produktion, Forschung, Vertrieb, Dienstleistungen) zusammenfallen. Zum anderen werden Produktionssysteme immer komplexer und reichen über Branchen- und Sektorgrenzen hinweg. Neuere Lehrbücher vermeiden die Sektorgliederung deshalb; wichtig bleibt aber der sektorale Strukturwandel.`,
      kernpunkte: ['Statistische Zuordnungsprobleme (verschiedene Tätigkeiten innerhalb von Großunternehmen)', 'Produktionssysteme immer komplexer, branchen- und sektorübergreifend'] },
    { id: 'e01-13', typ: 'mc', thema: 'Gliederung', quelle: 'VL03, S. 19',
      frage: 'Eine Studie untersucht, nach welchen Standortfaktoren ein einzelnes Unternehmen seinen neuen Standort auswählt. Welcher Betrachtungsweise entspricht das?',
      optionen: [
        { t: 'Einzelwirtschaftlich (mikroökonomisch)', r: true, warum: 'Im Mittelpunkt steht der einzelne Betrieb mit seinen Standortfaktoren.' },
        { t: 'Gesamtwirtschaftlich (makroökonomisch)', warum: 'Makro betrachtet Aktivitäten und Standortmuster eines ganzen Wirtschaftsraums (Staat, Industrieregion).' },
        { t: 'Sektoral (Drei-Sektoren-Hypothese)', warum: 'Die Sektorgliederung ordnet nach Wirtschaftszweigen, nicht nach der Betrachtungsebene.' },
        { t: 'Idiographisch (länderkundlich)', warum: 'Idiographisch beschreibt die Besonderheiten eines Raumausschnitts, nicht Standortentscheidungen.' },
      ] },

    /* ---------- Entwicklung ---------- */
    { id: 'e01-14', typ: 'paare', thema: 'Entwicklung', quelle: 'VL03, S. 18 und 20–22',
      frage: 'Ordne jeder Person ihren Beitrag zu.',
      paare: [
        ['Karl Andree', 'Geographie des Welthandels'],
        ['Friedrich Ratzel', 'Geodeterminismus'],
        ['Rudolf Lütgens', 'Wechselwirkungsprinzip'],
        ['Alfred Hettner', 'WiGeo als Teil der Länderkunde'],
        ['Walter Isard', 'Regional science (USA)'],
        ['Jean Fourastié', 'Drei-Sektoren-Hypothese'],
      ] },
    { id: 'e01-15', typ: 'mc', thema: 'Entwicklung', wichtig: 2, quelle: 'VL03, S. 20–21',
      frage: 'Was trifft auf das Wechselwirkungsprinzip (Rudolf Lütgens) zu?',
      optionen: [
        { t: 'Der wirtschaftende Mensch gestaltet die Natur durch sein Handeln zugleich um.', r: true, warum: 'Das ist der Kern; es ersetzte ab den 1920ern teilweise den Geodeterminismus.' },
        { t: 'Naturgegebenheiten bestimmen menschliches Handeln weitgehend einseitig.', warum: 'Das ist der Geodeterminismus (Ratzel).' },
        { t: 'Die Wirtschaft ist nur ein Geofaktor unter vielen in der Landschaftskunde.', warum: 'Das beschreibt Hettners Integration in die Länderkunde.' },
        { t: 'Standortstrukturen ändern sich durch regionsinterne Wachstumsdeterminanten.', warum: 'Das ist das Systemelement „Prozess“ der Raumwirtschaftslehre.' },
      ] },
    { id: 'e01-16', typ: 'luecke', thema: 'Entwicklung', wichtig: 2, quelle: 'VL03, S. 22',
      text: 'Nach der Kritik an der Länderkunde auf dem Geographentag in [[Kiel]] (1969) wandelte sich das Erkenntnisinteresse: statt der [[idiographischen|idiographische]] Frage nach den Besonderheiten einzelner Räume nun das [[nomothetische|nomothetisch]] Interesse an allgemeingültigen raumökonomischen Gesetzmäßigkeiten.' },
    { id: 'e01-17', typ: 'offen', thema: 'Entwicklung', wichtig: 2, punkte: 2, quelle: 'VL03, S. 22 und 26',
      frage: 'Erläutern Sie den Unterschied zwischen idiographischem und nomothetischem Erkenntnisinteresse und ordnen Sie beide der Entwicklung der Disziplin zu.',
      antwort: `Idiographisch heißt: Man beschreibt die individuellen Merkmale bestimmter Erdoberflächenausschnitte – typisch für die Länder- und Landschaftskunde. Nomothetisch heißt: Man sucht allgemeingültige raumökonomische Gesetzmäßigkeiten – typisch für die Raumwirtschaftslehre nach der quantitativen Wende (Kiel 1969).`,
      kernpunkte: ['Idiographisch: Besonderheiten einzelner Räume beschreiben → Länderkunde', 'Nomothetisch: allgemeingültige Gesetzmäßigkeiten suchen → Raumwirtschaftslehre/quantitative Wende nach Kiel 1969'] },
    { id: 'e01-18', typ: 'reihe', thema: 'Entwicklung', wichtig: 2, quelle: 'VL03, S. 20 und 36',
      frage: 'Bring die Phasen der Wirtschaftsgeographie in die zeitliche Reihenfolge.',
      schritte: ['Länderkundliche Beschreibung, Produktenkunde, Welthandelsgeographie', 'Wirtschaftsraum/Wirtschaftslandschaft, erste Standorttheorien', 'Quantitative Revolution: Raumwirtschaftslehre', 'Globalisierungsforschung, New Economic Geography', 'Pluralisierung: relational, evolutionär, institutionell …'] },
    { id: 'e01-19', typ: 'mc', thema: 'Entwicklung', quelle: 'VL03, S. 20',
      frage: 'Was trifft auf „New (regional) Economic Geography“ und „Geographical Economics“ zu? (mehrere möglich)',
      optionen: [
        { t: 'New Economic Geography (Scott, Storper) befasst sich u. a. mit regionalen Clustern.', r: true, warum: 'So auf der Folie: Globalisierungsforschung, regionale Cluster, eingebundene Theoriebildung.' },
        { t: 'Geographical Economics (Krugman) bezieht den Raum in die Wirtschaftswissenschaften ein.', r: true, warum: 'Die Folie betont: „Einbeziehung von Raum in die WiWi“.' },
        { t: 'Beide Begriffe bezeichnen denselben Ansatz.', warum: 'Die Folie hebt ausdrücklich hervor: New Economic Geography ≠ Geographical Economics.' },
        { t: 'Beide entstanden in der Länderkunde des 19. Jahrhunderts.', warum: 'Beide gehören in die Zeit ab den 1980/90ern.' },
      ] },
    { id: 'e01-20', typ: 'wf', thema: 'Entwicklung', quelle: 'VL03, S. 20–21',
      aussage: 'Die frühe Wirtschaftsgeographie des 19. Jahrhunderts war eng mit der kolonialen Expansion europäischer Mächte verbunden.',
      wahr: true, warum: 'Sie diente dem „imperial-kolonialen Projekt“, z. B. durch Produktenkunde (Inventarisierung von Ressourcen); sie war naturdeterministisch und teils rassistisch geprägt.' },

    /* ---------- Raumwirtschaftslehre ---------- */
    { id: 'e01-21', typ: 'mc', thema: 'RWL', wichtig: 3, quelle: 'VL03, S. 23; Musterklausur WS23/24, 2.4',
      frage: 'Der raumwirtschaftliche Ansatz unterscheidet drei Systemelemente eines ökonomischen Raumsystems. Welches gehört **nicht** dazu?',
      optionen: [
        { t: 'Relationalität', r: true, warum: 'Relationalität gehört zur späteren relationalen Wirtschaftsgeographie, nicht zur RWL.' },
        { t: 'Struktur', warum: 'Gehört dazu: Verteilung der Aktivitäten auf Standorte und Regionen.' },
        { t: 'Interaktion', warum: 'Gehört dazu: Bewegung von Produktionsfaktoren, Gütern, Dienstleistungen.' },
        { t: 'Prozess', warum: 'Gehört dazu: Veränderung der Strukturen durch interne Wachstumsdeterminanten.' },
      ] },
    { id: 'e01-22', typ: 'offen', thema: 'RWL', wichtig: 3, punkte: 3, quelle: 'VL03, S. 23; Musterklausur WS23/24, 2.4', bildLoesung: 'raumsystem',
      frage: 'Nennen und erläutern Sie die drei Systemelemente eines ökonomischen Raumsystems im raumwirtschaftlichen Ansatz.',
      antwort: `Struktur meint die Verteilung ökonomischer Aktivitäten (Produktion, Konsum) auf Standorte (Standortstruktur) bzw. Regionen (Regionalstruktur). Interaktion meint die Bewegung mobiler Produktionsfaktoren (Arbeit, Kapital, Wissen) sowie von Gütern und Dienstleistungen zwischen Standorten bzw. Regionen. Prozess meint die Veränderung von Standort- und Regionalstruktur als Folge standort- bzw. regionsinterner Wachstumsdeterminanten. Die drei Elemente hängen wechselseitig voneinander ab.`,
      kernpunkte: ['Struktur: Verteilung ökonomischer Aktivitäten auf Standorte bzw. Regionen', 'Interaktion: Bewegung von Arbeit, Kapital, Wissen, Gütern, Dienstleistungen zwischen Standorten/Regionen', 'Prozess: Veränderung der Standort-/Regionalstruktur durch interne Wachstumsdeterminanten'],
      erklaerung: 'Die Folie formuliert „Prozess“ verkürzt („… von Standortstruktur und Regionalstruktur als Folge standort- bzw. regionsinterner Wachstumsdeterminanten“); gemeint ist die **Veränderung** der Strukturen.' },
    { id: 'e01-23', typ: 'karte', thema: 'RWL', wichtig: 2, quelle: 'VL03, S. 22',
      vorne: 'Raumwirtschaftslehre (Definition nach Schätzl) und ihr Menschenbild',
      hinten: `„Wissenschaft von der **räumlichen Ordnung und der räumlichen Organisation der Wirtschaft**.“ Menschenbild: **homo oeconomicus** – vollständig rational, perfekt informiert, nutzenmaximierend (wie in der Neoklassik).` },
    { id: 'e01-24', typ: 'mc', thema: 'RWL', wichtig: 2, quelle: 'VL03, S. 22–23 und 26',
      frage: 'Welche Aussagen treffen auf die Raumwirtschaftslehre zu? (mehrere möglich)',
      optionen: [
        { t: 'Ihr Menschenbild ist der homo oeconomicus.', r: true, warum: 'Vollständig rational, perfekt informiert, nutzenmaximierend.' },
        { t: 'Ihr Ziel ist es, räumliche Gesetzmäßigkeiten zu finden.', r: true, warum: 'Nomothetisch, modelltheoretisch, positivistisch.' },
        { t: 'Ihr Ziel ist die idiographische Raumbeschreibung.', warum: 'Das ist das Ziel der Länderkunde.' },
        { t: 'Sie versteht Raum als soziales Konstrukt.', warum: 'Das ist das Raumkonzept der relationalen WiGeo; die RWL denkt in Wirtschaftsräumen.' },
      ] },
    { id: 'e01-25', typ: 'mc', thema: 'RWL', quelle: 'VL03, S. 23',
      frage: 'Welcher der folgenden ist **kein** Hauptbeitrag des raumwirtschaftlichen Ansatzes?',
      optionen: [
        { t: 'Theorien der sozialen Einbettung (embeddedness)', r: true, warum: 'Einbettung ist ein Begriff der relationalen bzw. institutionellen WiGeo.' },
        { t: 'Standorttheorien', warum: 'Hauptbeitrag: optimaler Standort des Einzelbetriebs, optimale Verteilung aller Standorte.' },
        { t: 'Räumliche Mobilitätstheorien', warum: 'Hauptbeitrag: Ursachen und Wirkungen der Mobilität von Faktoren, Gütern, Dienstleistungen.' },
        { t: 'Regionale Wachstums- und Entwicklungstheorien', warum: 'Hauptbeitrag: Entwicklung einzelner Regionen und interregionale Unterschiede erklären.' },
      ] },
    { id: 'e01-26', typ: 'karte', thema: 'RWL', quelle: 'VL03, S. 23',
      vorne: 'Akteursgruppenansatz (Kulke)',
      hinten: `Weiterentwicklung des raumwirtschaftlichen Ansatzes: Drei Akteursgruppen – **Anbieter** (Unternehmen/Betriebe), **Nachfrager** (Konsument:innen) und **Planer/Politiker** – prägen über Waren- und Informationsströme sowie Lenkung die Struktur und Dynamik von Standorten und Raumsystemen.` },

    /* ---------- Relationale WiGeo ---------- */
    { id: 'e01-27', typ: 'offen', thema: 'Relational', wichtig: 3, punkte: 3, quelle: 'VL03, S. 24',
      frage: 'Erläutern Sie die drei Prinzipien der relationalen Wirtschaftsgeographie (Bathelt/Glückler).',
      antwort: `Kontextualität: Wirtschaftliches Handeln ist situiert und lässt sich nicht durch universelle Gesetze erklären, sondern nur aus seinen raumzeitlichen Beziehungskontexten. Pfadabhängigkeit: Diese Kontexte übertragen sich historisch – Entscheidungen und Interaktionen der Vergangenheit prägen die Handlungskontexte der Gegenwart. Kontingenz: Trotzdem legt die Geschichte eines Entwicklungspfades die Zukunft nicht fest; neue Wachstumspfade sind möglich.`,
      kernpunkte: ['Kontextualität: situiertes Handeln, nicht durch universelle Gesetze erklärbar', 'Pfadabhängigkeit: Entscheidungen der Vergangenheit prägen heutige Handlungskontexte', 'Kontingenz: Pfadgeschichte determiniert die Zukunft nicht, neue Pfade möglich'] },
    { id: 'e01-28', typ: 'mc', thema: 'Relational', wichtig: 2, quelle: 'VL03, S. 24–25',
      frage: 'Welche Aussage trifft **nicht** auf die relationale Wirtschaftsgeographie zu?',
      optionen: [
        { t: 'Wirtschaftliches Handeln lässt sich durch universelle Raumgesetze erklären.', r: true, warum: 'Widerspricht dem Prinzip der Kontextualität – das ist eher der Anspruch der RWL.' },
        { t: 'Gegenstand ist die Struktur und Dynamik ökonomischer Beziehungen in räumlicher Perspektive.', warum: 'Trifft zu.' },
        { t: 'Sie ist akteurs- und handlungsorientiert und betont Einbettung (embeddedness).', warum: 'Trifft zu.' },
        { t: 'Die Geschichte eines Entwicklungspfades determiniert die Zukunft nicht.', warum: 'Trifft zu: Prinzip der Kontingenz.' },
      ] },
    { id: 'e01-29', typ: 'wf', thema: 'Relational', wichtig: 2, quelle: 'VL03, S. 24',
      aussage: 'Nach dem Prinzip der Kontingenz legt die Geschichte eines Entwicklungspfades die weitere Entwicklung einer Region fest.',
      wahr: false, warum: 'Kontingenz heißt gerade: Die Pfadgeschichte **determiniert die Zukunft nicht**, neue Wachstumspfade sind möglich. Dass die Vergangenheit prägt, beschreibt die Pfadabhängigkeit.' },
    { id: 'e01-30', typ: 'paare', thema: 'Relational', wichtig: 3, quelle: 'VL03, S. 26; Musterklausur WS23/24, 1.2',
      frage: 'Raumkonzepte: Ordne jedem Denkstil sein Raumverständnis zu.',
      paare: [
        ['Länderkunde', '„Natürliche“ Länder und Landschaftsräume'],
        ['Raumwirtschaftslehre', 'Wirtschaftsraum'],
        ['Relationale WiGeo', 'Raum als soziales Konstrukt, räumliche Perspektive'],
      ] },
    { id: 'e01-31', typ: 'offen', thema: 'Relational', wichtig: 2, punkte: 3, quelle: 'VL03, S. 26',
      frage: 'Vergleichen Sie Raumwirtschaftslehre und relationale Wirtschaftsgeographie hinsichtlich Forschungsgegenstand, Forschungsziel und Menschenbild.',
      antwort: `Gegenstand der RWL ist das ökonomische Raumsystem, Gegenstand der relationalen WiGeo sind wirtschaftliche Beziehungen im räumlichen Kontext. Die RWL will räumliche Gesetzmäßigkeiten finden, die relationale WiGeo Prinzipien sozioökonomischen Austauschs in räumlichen Strukturen. Die RWL arbeitet mit dem homo oeconomicus, die relationale WiGeo mit einem pluralen Menschenbild (z. B. homo socio-oeconomicus, Satisficer).`,
      kernpunkte: ['Gegenstand: ökonomisches Raumsystem ↔ wirtschaftliche Beziehungen im räumlichen Kontext', 'Ziel: räumliche Gesetzmäßigkeiten ↔ Prinzipien sozioökonomischen Austauschs', 'Menschenbild: homo oeconomicus ↔ plural (homo socio-oeconomicus, Satisficer)'] },
    { id: 'e01-32', typ: 'offen', thema: 'Relational', wichtig: 3, punkte: 2, quelle: 'VL03, S. 26 und 32; Musterklausur WS23/24, 1.2',
      frage: 'Warum gibt es keine allgemeingültige Definition für „Raum“?',
      antwort: `Was „Raum“ ist, hängt vom jeweiligen Denkstil bzw. Paradigma ab: Die Länderkunde denkt in „natürlichen“ Ländern und Landschaftsräumen, die Raumwirtschaftslehre in Wirtschaftsräumen (containerhaftes Raumverständnis), die relationale WiGeo versteht Raum als soziales Konstrukt bzw. als Perspektive. Diese Konzepte folgen unterschiedlichen Erkenntnisinteressen – Raumbeschreibung, Gesetzmäßigkeiten oder Beziehungen – und lassen sich nicht auf eine Definition zurückführen.`,
      kernpunkte: ['Raumverständnis hängt vom Denkstil/Paradigma ab (Landschaftsraum – Wirtschaftsraum/Container – soziales Konstrukt)', 'Unterschiedliche Erkenntnisinteressen und Forschungsziele erfordern unterschiedliche Raumkonzepte'],
      erklaerung: 'Die Musterklausur fragt das direkt (1.2, 2 P.). Vertiefung zu absoluten und relationalen Raumkonzepten: Zusatz-Einheit am Ende.' },

    /* ---------- Paradigmen und Denkstile ---------- */
    { id: 'e01-33', typ: 'paare', thema: 'Paradigmen', wichtig: 2, quelle: 'VL03, S. 28',

      paare: [

        ['Geographische Politische Ökonomie', 'Kapitalismus, Arbeit, Kapital, Ungleichheit'],

      ] },
    { id: 'e01-34', typ: 'mc', thema: 'Paradigmen', wichtig: 2, quelle: 'VL03, S. 30',
      frage: 'Was trifft auf die Geographische Politische Ökonomie (GPE) zu? (mehrere möglich)',
      optionen: [
        { t: 'Zentraler Gründungstext ist Harveys „The Limits to Capital“ (1982).', r: true, warum: 'Eine geographische Kritik und Erweiterung von Marx’ Theorie des Kapitalismus.' },
        { t: 'Ungleiche Entwicklung gilt als Kern kapitalistischer Wirtschaftsentwicklung.', r: true, warum: 'Genau das unterscheidet sie von der Neoklassik.' },
        { t: 'Sie beginnt wie die Neoklassik beim Tausch.', warum: 'Die GPE beginnt bei der Produktion; menschliche Arbeit ist Quelle der Wertschöpfung.' },
        { t: 'Die Entwicklung einer Region folgt vor allem aus ihren ortsbasierten Attributen.', warum: 'Entscheidend ist die Position im wirtschaftlichen Gesamtsystem und die Beziehungen zu anderen Orten.' },
      ] },
    { id: 'e01-35', typ: 'luecke', thema: 'Paradigmen', wichtig: 2, quelle: 'VL03, S. 29',
      frage: 'Evolutionary Economic Geography (evolutionäre Wirtschaftsgeographie). Fülle die Lücken.',
      text: 'Sie erklärt wirtschaftlichen Wandel mit Begriffen der biologischen Evolutionstheorie: [[Variation]], [[Selektion]] und Replikation bzw. Retention. Entwicklungspfade entstehen aus zufälligen, offenen Ereignissen, die sich durch [[selbstverstärkende]] Mechanismen verfestigen.' },
    { id: 'e01-36', typ: 'wf', thema: 'Paradigmen', wichtig: 2, quelle: 'VL03, S. 30',
      aussage: 'Institutionen im Sinne der institutionellen Wirtschaftsgeographie sind Organisationen wie die UN, die WTO oder die EU.',
      wahr: false, warum: 'Institutionen sind gesellschaftliche **Spielregeln und Normen** (formell und informell) – ausdrücklich **nicht** Organisationen.' },

<script>
/* LERNI – Lernstand im Browser (localStorage): Antworten, Logbuch, Einstellungen, Sicherung.

   Der Lernstand hängt an den Frage-IDs („kurs:frage“), nicht an der App-Version. Neue App-Versionen
   übernehmen ihn deshalb automatisch. Ändert sich das Format, bekommt SCHEMA +1 und MIGRATIONEN
   einen Übergang – alte Stände nie verwerfen.

   Aufbau (Kurzform, damit auch Tausende Antworten klein bleiben):
   q[qid]   = { h: [[zeitSek, punkte0bis100, unsicher0/1], … letzte 30], n, r: richtig, f: falsch,
                box: Kasten 0–6, due: fällig am Tag (U.dayNum), t0: zuerst gesehen (Sek.), fav, notiz, a: letzte Antwort (offen) }
   log      = [[zeitSek, qid, punkte, unsicher, ms, modus], …]   (Logbuch, gekürzt ab LOG_MAX)
   tage[JJJJ-MM-TT] = [antworten, richtig, ms]
   sitzungen = [{ t, modus, titel, kurs, n, r, ms }]
   kurse[id] = { klausur: 'JJJJ-MM-TT' }        (eigener Klausurtermin, überschreibt den aus dem Inhalt) */
'use strict';

const SAVE_KEY = 'lerni.save';
const BACKUP_KEY = 'lerni.vorImport';
const SCHEMA = 1;
const LOG_MAX = 20000, H_MAX = 30;

/* Übergänge: MIGRATIONEN[n] macht aus Schema n das Schema n+1 */
const MIGRATIONEN = {
  // 1: (d) => { … },
};

const Store = {
  data: null,
  fehler: null,                                   // letzter Speicherfehler (für Einstellungen)

  defaults() {
    return {
      schema: SCHEMA, erstellt: Date.now(), geaendert: 0,
      set: { ziel: 20, neuProTag: 10, laenge: 15, offen: 'schreiben', theme: 'auto', kurs: null, tipps: true },
      kurse: {}, q: {}, log: [], tage: {}, sitzungen: [],
      sich: { zuletzt: 0, seit: 0 },
    };
  },

  load() {
    let d = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    this.data = this.pruefeUndErgaenze(d);
    return this.data;
  },
  /* Alten oder fremden Stand ins aktuelle Format bringen, fehlende Felder ergänzen */
  pruefeUndErgaenze(d) {
    const def = this.defaults();
    if (!d || typeof d !== 'object') return def;
    d.schema = d.schema || 1;
    while (d.schema < SCHEMA) { const m = MIGRATIONEN[d.schema]; if (m) m(d); d.schema++; }
    for (const k in def) if (d[k] == null || typeof d[k] !== typeof def[k] || Array.isArray(d[k]) !== Array.isArray(def[k])) d[k] = def[k];
    for (const k in def.set) if (d.set[k] == null) d.set[k] = def.set[k];
    for (const k in def.sich) if (d.sich[k] == null) d.sich[k] = def.sich[k];
    return d;
  },

  save() {
    const d = this.data; d.geaendert = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); this.fehler = null; return true; } catch (e) {
      // Speicher voll: Logbuch kürzen (Zusammenfassung je Frage bleibt) und erneut versuchen
      if (d.log.length > 2000) { d.log = d.log.slice(-Math.floor(d.log.length / 2)); try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); this.fehler = null; return true; } catch (e2) { /* unten */ } }
      this.fehler = String(e && e.message || e); return false;
    }
  },

  rec(qid) { return this.data.q[qid]; },
  recOderNeu(qid) { return this.data.q[qid] || (this.data.q[qid] = { h: [], n: 0, r: 0, f: 0, box: 0, due: 0, t0: 0 }); },

  /* Eine Antwort festhalten. s = 0…1, unsicher = bool, ms = Bearbeitungszeit, modus = Kürzel der Sitzung */
  antwort(f, s, unsicher, ms, modus, antwortText) {
    const d = this.data, now = Math.floor(Date.now() / 1000), p = Math.round(U.clamp(s, 0, 1) * 100), u = unsicher ? 1 : 0;
    const r = this.recOderNeu(f.qid);
    r.h.push([now, p, u]); if (r.h.length > H_MAX) r.h.splice(0, r.h.length - H_MAX);
    r.n++; if (s >= RICHTIG) r.r++; else if (s < TEILWEISE) r.f++;
    if (!r.t0) r.t0 = now;
    if (antwortText != null && String(antwortText).trim()) r.a = String(antwortText).slice(0, 4000);
    Lernlogik.planen(r, s, unsicher, Lernlogik.kappe(f.kurs));
    d.log.push([now, f.qid, p, u, Math.round(ms || 0), modus || 'l']);
    if (d.log.length > LOG_MAX) d.log.splice(0, d.log.length - Math.floor(LOG_MAX * 0.75));
    const key = U.dayKey(), t = d.tage[key] || (d.tage[key] = [0, 0, 0]);
    t[0]++; if (s >= RICHTIG) t[1]++; t[2] += Math.round(ms || 0);
    d.sich.seit++;
    this.save();
    return r;
  },
  sitzungEnde(info) {
    const d = this.data; d.sitzungen.push(info);
    if (d.sitzungen.length > 400) d.sitzungen.splice(0, d.sitzungen.length - 300);
    this.save();
  },

  klausurTermin(kursId) {
    const eigen = (this.data.kurse[kursId] || {}).klausur, k = Lerni.kursById[kursId];
    return eigen != null ? eigen : (k && k.klausur) || '';
  },
  setKlausur(kursId, key) { (this.data.kurse[kursId] || (this.data.kurse[kursId] = {})).klausur = key || ''; this.save(); },

  /* ---------- Sicherung ---------- */
  exportText() { return JSON.stringify({ app: 'lerni', schema: SCHEMA, exportiert: new Date().toISOString(), daten: this.data }); },
  exportName() { return 'lerni-sicherung-' + U.dayKey() + '.json'; },
  merkeExport() { this.data.sich = { zuletzt: Date.now(), seit: 0 }; this.save(); },
  /* Sicherung einlesen. Wirft einen Fehler mit lesbarer Meldung. Der alte Stand bleibt als BACKUP_KEY erhalten. */
  importText(text) {
    let o; try { o = JSON.parse(text); } catch (e) { throw new Error('Die Datei ist keine Lerni-Sicherung (kein gültiges JSON).'); }
    const d = o && o.app === 'lerni' ? o.daten : (o && o.q && o.set ? o : null);
    if (!d || typeof d !== 'object' || typeof d.q !== 'object') throw new Error('Die Datei ist keine Lerni-Sicherung.');
    if (Math.max(d.schema || 1, o.schema || 1) > SCHEMA) throw new Error('Die Sicherung stammt aus einer neueren App-Version. Erst die App aktualisieren.');
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(this.data)); } catch (e) { /* kein Platz für die Kopie – trotzdem weiter */ }
    this.data = this.pruefeUndErgaenze(d);
    this.data.sich = { zuletzt: Date.now(), seit: 0 };
    this.save();
    return { fragen: Object.keys(this.data.q).length, antworten: this.data.log.length };
  },
  hatVorImport() { try { return !!localStorage.getItem(BACKUP_KEY); } catch (e) { return false; } },
  vorImportZurueck() {
    const raw = localStorage.getItem(BACKUP_KEY); if (!raw) return false;
    this.data = this.pruefeUndErgaenze(JSON.parse(raw)); localStorage.removeItem(BACKUP_KEY); this.save(); return true;
  },
  zuruecksetzen() {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(this.data)); } catch (e) { /* egal */ }
    const set = this.data.set; this.data = this.defaults(); this.data.set = set; this.save();
  },
  groesse() { try { return (localStorage.getItem(SAVE_KEY) || '').length * 2; } catch (e) { return 0; } },
  /* Browser bitten, den Speicher nicht bei Platzmangel zu räumen */
  async dauerhaft() {
    try { if (navigator.storage && navigator.storage.persist) return (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) { /* nicht unterstützt */ }
    return null;
  },
};
//# sourceURL=js/store.js
</script>
<script>
/* LERNI – Lernlogik: Wiederholungsplan, Kennzahlen je Frage, Listen („kritischste 10“ usw.), Sitzungsplan.

   Wiederholungsplan: Karteikasten mit 7 Fächern. Richtig und sicher → ein Fach weiter, richtig aber
   unsicher → Fach bleibt, teilweise → ein Fach zurück, falsch → Fach 0 (heute nochmal).
   Abstände KASTEN_TAGE; vor der Klausur höchstens die halbe Restzeit, damit alles vorher noch einmal drankommt.

   Bewertung einer Antwort: s = 0…1. Ab RICHTIG gilt sie als gewusst, unter TEILWEISE als falsch. */
'use strict';

const KASTEN_TAGE = [0, 1, 2, 4, 8, 16, 32];
const RICHTIG = 0.8, TEILWEISE = 0.4;

const LISTEN = [
  { id: 'faellig', name: 'Heute fällig', desc: 'Nach Plan zur Wiederholung dran' },
  { id: 'kritisch', name: 'Die 10 kritischsten', desc: 'Oft falsch, wackelig oder unsicher – nach Dringlichkeit' },
  { id: 'falsch', name: 'Zuletzt falsch', desc: 'Beim letzten Mal nicht oder nur teilweise gewusst' },
  { id: 'wackelig', name: 'Wackelkandidaten', desc: 'Mal richtig, mal falsch – oder oft unsicher' },
  { id: 'oftfalsch', name: 'Oft falsch', desc: 'Mindestens zweimal falsch, Fehlerquote über 40 %' },
  { id: 'glueck', name: 'Glückstreffer', desc: 'Zuletzt richtig, aber unsicher markiert' },
  { id: 'neu', name: 'Neue Fragen', desc: 'Noch nie beantwortet – in Lernpfad-Reihenfolge' },
  { id: 'gemerkt', name: 'Gemerkt', desc: 'Mit Stern markiert' },
  { id: 'sitzt', name: 'Sitzt', desc: 'Mehrfach sicher gewusst' },
];
const LISTE_BY_ID = Object.fromEntries(LISTEN.map((l) => [l.id, l]));

const STATUS = {
  neu: { name: 'Neu', farbe: 'var(--st-neu)' },
  falsch: { name: 'Falsch', farbe: 'var(--bad)' },
  wackelig: { name: 'Wackelig', farbe: 'var(--mid)' },
  lernend: { name: 'Lernend', farbe: 'var(--pri)' },
  sitzt: { name: 'Sitzt', farbe: 'var(--ok)' },
};

const Lernlogik = {
  ergebnis: (s) => s >= RICHTIG ? 'richtig' : s >= TEILWEISE ? 'teilweise' : 'falsch',

  /* Größter Abstand bis zur nächsten Wiederholung: halbe Restzeit bis zur Klausur (mind. 1 Tag) */
  kappe(kursId) {
    const k = U.keyToNum(Store.klausurTermin(kursId)); if (k == null) return null;
    const rest = k - U.dayNum(); return rest > 0 ? Math.max(1, Math.floor(rest / 2)) : null;
  },
  planen(r, s, unsicher, kappe) {
    let box = r.box || 0;
    if (s >= RICHTIG) box = unsicher ? Math.max(1, box) : box + 1;
    else if (s >= TEILWEISE) box = Math.max(1, box - 1);
    else box = 0;
    r.box = Math.min(box, KASTEN_TAGE.length - 1);
    let tage = KASTEN_TAGE[r.box]; if (kappe != null) tage = Math.min(tage, kappe);
    r.due = U.dayNum() + tage;
  },

  /* Kennzahlen einer Frage. crit = Dringlichkeit 0…~1,5 (für „kritischste“) */
  info(f) {
    const r = Store.rec(f.qid);
    if (!r || !r.n) return { neu: true, n: 0, status: 'neu', crit: 0, fav: !!(r && r.fav) };
    const h = r.h, last = h[h.length - 1], s = last[1] / 100, heute = U.dayNum();
    const recent = h.slice(-8);
    let w = 0, e = 0;
    recent.forEach((x, i) => { const wi = Math.pow(0.7, recent.length - 1 - i); w += wi; e += wi * (1 - x[1] / 100); });
    const err = e / w;
    const six = h.slice(-6);
    let wechsel = 0; for (let i = 1; i < six.length; i++) if ((six[i][1] >= 80) !== (six[i - 1][1] >= 80)) wechsel++;
    const flip = six.length > 1 ? wechsel / (six.length - 1) : 0;
    const unsure = six.filter((x) => x[2]).length / six.length;
    const ueber = Math.max(0, heute - r.due);
    const crit = (0.45 * err + 0.2 * flip + 0.15 * unsure + 0.1 * (s < RICHTIG ? 1 : 0) + 0.1 * Math.min(1, ueber / 7)) * (1 + 0.25 * (f.wichtig - 1));
    const wackelig = (six.length >= 3 && flip >= 0.4) || (r.n >= 2 && unsure >= 0.5);
    let status;
    if (s < TEILWEISE) status = 'falsch';
    else if (wackelig) status = 'wackelig';
    else if (r.box >= 3 && s >= RICHTIG && !last[2] && err < 0.25) status = 'sitzt';
    else status = 'lernend';
    return {
      neu: false, n: r.n, s, err, flip, unsure, crit, wackelig, status, box: r.box, due: r.due, faellig: r.due <= heute,
      lastUnsure: !!last[2], lastT: last[0], fav: !!r.fav, falschN: r.f, richtigN: r.r, quote: r.r / r.n,
    };
  },

  /* Fragen eines Kurses (optional nur eine Einheit) */
  fragenVon(kursId, einheitId) {
    const k = Lerni.kursById[kursId]; if (!k) return [];
    return einheitId ? k.alleFragen.filter((f) => f.einheit === einheitId) : k.alleFragen;
  },
  liste(id, fragen) {
    const mit = fragen.map((f) => ({ f, i: this.info(f) }));
    const nachCrit = (a, b) => b.i.crit - a.i.crit;
    let sel;
    switch (id) {
      case 'faellig': sel = mit.filter((x) => !x.i.neu && x.i.faellig).sort(nachCrit); break;
      case 'kritisch': sel = mit.filter((x) => !x.i.neu && x.i.crit > 0.08).sort(nachCrit).slice(0, 10); break;
      case 'falsch': sel = mit.filter((x) => !x.i.neu && x.i.s < RICHTIG).sort((a, b) => b.i.lastT - a.i.lastT); break;
      case 'wackelig': sel = mit.filter((x) => !x.i.neu && x.i.wackelig).sort(nachCrit); break;
      case 'oftfalsch': sel = mit.filter((x) => !x.i.neu && x.i.falschN >= 2 && x.i.falschN / x.i.n >= 0.4).sort(nachCrit); break;
      case 'glueck': sel = mit.filter((x) => !x.i.neu && x.i.s >= RICHTIG && x.i.lastUnsure).sort(nachCrit); break;
      case 'neu': return this.lernpfad(fragen.filter((f) => this.info(f).neu));
      case 'gemerkt': sel = mit.filter((x) => x.i.fav); break;
      case 'sitzt': sel = mit.filter((x) => x.i.status === 'sitzt'); break;
      default: sel = mit;
    }
    return sel.map((x) => x.f);
  },
  zaehlen(fragen) {
    const c = { alle: fragen.length };
    const st = { neu: 0, falsch: 0, wackelig: 0, lernend: 0, sitzt: 0 };
    for (const l of LISTEN) c[l.id] = this.liste(l.id, fragen).length;
    for (const f of fragen) st[this.info(f).status]++;
    c.status = st; return c;
  },

  /* Neue Fragen in Lernpfad-Reihenfolge: erst Erkennen, dann Erinnern, dann Erklären je Thema.
     Offene Fragen (Stufe 3) eines Themas erst, wenn mind. die Hälfte der leichteren Fragen dazu gesehen ist. */
  lernpfad(neue) {
    const gesehen = {}, gesamt = {};
    for (const f of neue.length ? Lerni.kursById[neue[0].kurs].alleFragen : []) {
      if (f.stufe >= 3) continue;
      const key = f.einheit + '|' + f.thema; gesamt[key] = (gesamt[key] || 0) + 1;
      if (!this.info(f).neu) gesehen[key] = (gesehen[key] || 0) + 1;
    }
    const bereit = (f) => { if (f.stufe < 3) return true; const key = f.einheit + '|' + f.thema; return !gesamt[key] || (gesehen[key] || 0) / gesamt[key] >= 0.5; };
    const gruppe = (f) => Math.floor(f.ord / 1000);                   // Einheit + Thema
    const sortiert = neue.slice().sort((a, b) => gruppe(a) - gruppe(b) || a.stufe - b.stufe || a.ord - b.ord);
    return sortiert.filter(bereit).concat(sortiert.filter((f) => !bereit(f)));
  },
  neuHeute(kursId) {
    const start = Math.floor(new Date().setHours(0, 0, 0, 0) / 1000);
    return this.fragenVon(kursId).filter((f) => { const r = Store.rec(f.qid); return r && r.t0 >= start; }).length;
  },

  /* Sitzung zusammenstellen.
     modus: 'heute' (fällige + neue), 'liste' (opt.liste), 'einheit' (opt.einheit), 'offen', 'mix', 'thema' (opt.einheit, opt.thema), 'fragen' (opt.qids) */
  plan(kursId, modus, opt = {}) {
    const L = opt.laenge || Store.data.set.laenge;
    const alle = this.fragenVon(kursId, opt.einheit);
    let out;
    switch (modus) {
      case 'heute': {
        const due = this.liste('faellig', alle);
        const frei = Math.max(0, Store.data.set.neuProTag - this.neuHeute(kursId));
        const neu = this.liste('neu', alle).slice(0, frei);
        const nDue = Math.min(due.length, Math.max(L - neu.length, Math.ceil(L * 0.7)));
        out = this.verzahnen(due.slice(0, nDue), neu.slice(0, L - nDue));
        break;
      }
      case 'einheit': {
        const due = this.liste('faellig', alle), neu = this.liste('neu', alle);
        const rest = alle.filter((f) => due.indexOf(f) < 0 && neu.indexOf(f) < 0).sort((a, b) => this.info(b).crit - this.info(a).crit);
        const nDue = Math.min(due.length, Math.ceil(L * 0.6));
        out = this.verzahnen(due.slice(0, nDue), neu.slice(0, L - nDue));
        if (out.length < L) out = out.concat(rest.slice(0, L - out.length));
        break;
      }
      case 'thema': out = this.lernpfad(alle.filter((f) => f.thema === opt.thema)); break;
      case 'liste': {
        const l = this.liste(opt.liste, alle);
        out = opt.liste === 'neu' || opt.liste === 'kritisch' ? l.slice(0, L) : U.shuffle(l).slice(0, L);
        break;
      }
      case 'offen': {
        const off = alle.filter((f) => f.typ === 'offen');
        const gesehen = off.filter((f) => !this.info(f).neu).sort((a, b) => this.info(b).crit - this.info(a).crit);
        const neu = off.filter((f) => this.info(f).neu);
        out = this.verzahnen(gesehen.slice(0, Math.ceil(L / 2)), neu).slice(0, L);
        if (out.length < L) out = out.concat(gesehen.slice(Math.ceil(L / 2))).slice(0, L);
        break;
      }
      case 'mix': out = U.shuffle(alle).slice(0, L); break;
      case 'fragen': out = (opt.qids || []).map((q) => Lerni.fragen[q]).filter(Boolean); break;
      default: out = [];
    }
    return modus === 'thema' || modus === 'fragen' ? out : this.mischen(out);
  },
  /* Neue Fragen gleichmäßig zwischen die Wiederholungen streuen */
  verzahnen(alt, neu) {
    if (!alt.length) return neu.slice(); if (!neu.length) return alt.slice();
    const out = [], step = (alt.length + neu.length) / neu.length;
    let ai = 0, ni = 0;
    for (let i = 0; i < alt.length + neu.length; i++) {
      if (ni < neu.length && (i + 1) >= (ni + 1) * step - step / 2) out.push(neu[ni++]); else if (ai < alt.length) out.push(alt[ai++]); else out.push(neu[ni++]);
    }
    return out;
  },
  /* Nicht zweimal hintereinander dasselbe Thema (Verschachteln hilft beim Behalten) */
  mischen(list) {
    const rest = list.slice(), out = [];
    while (rest.length) {
      const prev = out[out.length - 1];
      let i = prev ? rest.findIndex((f) => f.thema !== prev.thema || f.einheit !== prev.einheit) : 0;
      if (i < 0) i = 0;
      out.push(rest.splice(i, 1)[0]);
    }
    return out;
  },

  /* ---------- Tages- und Gesamtwerte ---------- */
  heute() { const t = Store.data.tage[U.dayKey()] || [0, 0, 0]; return { n: t[0], r: t[1], ms: t[2] }; },
  serie() {
    const T = Store.data.tage; let n = 0, d = U.dayNum();
    if (!T[U.numToKey(d)]) d--;                   // heute noch nicht gelernt: Serie bis gestern zählt
    while (T[U.numToKey(d)] && T[U.numToKey(d)][0] > 0) { n++; d--; }
    return n;
  },
  tageBisKlausur(kursId) { const k = U.keyToNum(Store.klausurTermin(kursId)); return k == null ? null : k - U.dayNum(); },
  /* Trefferquote je Fragetyp und Zeitraum aus dem Logbuch */
  quoten(kursId, seitTagen) {
    const ab = seitTagen ? Date.now() / 1000 - seitTagen * 86400 : 0, proTyp = {}, ges = { n: 0, r: 0 };
    for (const [t, qid, p] of Store.data.log) {
      if (t < ab) continue; const f = Lerni.fragen[qid]; if (!f || (kursId && f.kurs !== kursId)) continue;
      const x = proTyp[f.typ] || (proTyp[f.typ] = { n: 0, r: 0 }); x.n++; ges.n++;
      if (p >= RICHTIG * 100) { x.r++; ges.r++; }
    }
    return { proTyp, ges };
  },
};
