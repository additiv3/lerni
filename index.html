- **Überakkumulation:** Überschuss an Kapital (Warenschwemme, ungenutzte Kapazitäten, Geld ohne profitable Anlage) und an Arbeit (Arbeitslosigkeit) in einem territorialen System.
- **Spatial fix:** räumliche „Lösung“ durch **geographische Expansion** – das Kapital wird mobiler.
- **Temporal fix:** zeitliche Verschiebung durch Investitionen, deren Rückfluss in der Zukunft liegt (Infrastruktur, Immobilien, Bildung). Kombination: **spatio-temporal fix**.

**Vier räumliche Strategien:** Erschließung **neuer Märkte** · **Verlagerung** der Produktion · Nutzung **billiger Arbeitskräfte** · **Export der Entwertung** über das Finanzsystem (regionale Finanzkrisen).

**Time-space compression:** Transport- und Kommunikationsinnovationen verkürzen die Zirkulationszeit des Kapitals – „**Vernichtung von Raum durch Zeit**“ (Marx), Distanz verliert an Bedeutung.

Aber: „Es gibt keinen dauerhaften spatial fix für die inneren Widersprüche des Kapitalismus.“ Seit den 1970ern ist der Kapitalismus von chronischer Überakkumulation geprägt; frühere fixes – vor allem die **Finanzialisierung** als Absorption überschüssigen Kapitals – führten selbst in die nächste Krise (**2008**).

**Rounds of accumulation** – eine „Zick-Zack-Bewegung“: Investitionen prägen die Geographie eines Ortes; diese Geographie prägt wiederum künftige Investitionen und Desinvestitionen.

Produktionskomplexe sind nicht statisch, der Kapitalismus ist **dynamisch-expansiv**: Manche Regionen erfinden sich neu (**Liverpool, London Docklands, Silicon Valley**), andere nur auf wackeligen Beinen (**Lausitz, Ruhrgebiet, Nordostengland**), wieder andere verfallen ohne Perspektive (**Detroit, Teile der Midlands**).

Zwei Deutungen (MacKinnon/Cumbers):
- **Neoklassik:** ein **temporärer** Zustand, der sich ausgleicht.
- **Geographische Politische Ökonomie:** ein **Wesensmerkmal des Kapitalismus**. „Globalisierung produziert und nutzt Ungleichheit – nicht zufällig, sondern strategisch“; „Globalization is uneven geographical development“. Globale Produktion spielt Territorien gegeneinander aus (Kosten, Steuern, Umweltauflagen, Arbeitskontrolle).

**Zusammenfassung der Theorien:** Regulationstheorie – Globalisierung als konflikthafte Antwort auf die Fordismuskrise · Harvey – Globalisierung als (auf Dauer scheiternder) spatial fix der Überakkumulation seit den 1970ern · Massey – räumliche Arbeitsteilung · GPE – ungleiche Entwicklung als Wesensmerkmal.

==Neoklassik: Ungleichheit vorübergehend. GPE: Globalisierung ist ungleiche Entwicklung.==`,

<script>
/* e05 Globalisierung III: Ketten, Netzwerke, De-Globalisierung – VL04-05 Teil 2 (Rosol, 21.05.2026).

Lerni.einheit('wirtschaftsgeographie', {
  id: 'e05',

  quelle: 'VL04-05 Globalisierung (Rosol), PDF-Seiten 57–85',
  skript: [
    {
      thema: 'Thesen', titel: 'Globalisierung als Produktionsnetzwerk',
      text: `Drei Thesen der Vorlesung:
1. Globalisierung ist **nicht über Handel, sondern über die Internationalisierung der Produktion** definiert – zunehmend in globalen Produktions- und Vertriebsketten und -netzwerken.
2. Nicht „Verflechtungen zwischen Volkswirtschaften“ stehen im Zentrum, sondern **„entgrenzte Produktion“** – das verlangt eine **Netzwerkperspektive**.
3. Globale Warenketten und Netzwerke sind **Ausdruck**, **Triebkraft** und **analytischer Zugang** zur Globalisierung.

Kettenansätze beschreiben Produktion, Distribution und Konsum als **Verbindungen von Aktivitäten**, verknüpft durch materielle und immaterielle Ströme. Sie bilden **relationale Strukturen** mit **ungleichen Machtbeziehungen** zwischen Firmen, Staaten und Gruppen (Beispiele: Kaffee, Jeans, Banane, Frühstück).

Drei Konzepte:
- **GCC** – global commodity chains / globale Warenketten: Wallerstein, Gereffi; 1980er/90er; eher **analytisch-politisch**
- **GVC** – global value chains / globale Wertschöpfungsketten: Gereffi et al.; Mitte 2000er; **firmen-, anwendungs-, managementorientiert**
- **GPN** – global production networks / globale Produktionsnetzwerke: Dicken, Coe, Yeung u. a. („Manchester School“); frühe 2000er; **Netzwerk statt Kette**

==GCC analytisch-politisch, GVC firmenorientiert (Upgrading), GPN Netzwerk mit Macht, Wert, Einbettung.==`,
    },
    {
      thema: 'GCC', titel: 'Global Commodity Chains',
      text: `Definition (Hopkins/Wallerstein): ein **Netzwerk von Arbeits- und Produktionsprozessen**, an dessen Ende eine fertige Ware steht. Wer diese Netzwerke verfolgt, erkennt die Arbeitsteilung und die Entwicklung des weltwirtschaftlichen Produktionssystems.

Merkmale:
- Weltwirtschaft als grenzüberschreitende **Interaktion zwischen Unternehmen**, nicht zwischen Staaten
- alle materiellen (Arbeit, Rohstoffe) und immateriellen Inputs (Wissen) erfassen und verorten; Produzentenstandorte = **Knoten**
- **politischer Ansatz**: erklärt, **wie und warum der Mehrwert ungleich verteilt** wird – Polarisierung in **Zentren und Peripherien**; lange, **intransparente** Ketten erschweren Kontrolle und politischen Widerstand

**Gereffi: Machtbeziehungen** – **produzentengetriebene** Ketten (der Hersteller steuert Zulieferer und Handel) vs. **käufergetriebene** Ketten (Markenartikel- und Handelsunternehmen steuern die Hersteller). Achtung: „**Käufer**“ sind **nicht die Endverbraucher:innen**, sondern Markenartikler und Handelsbetriebe.

==GCC: Mehrwert wird ungleich verteilt – Käufer = Marken und Handel, nicht Kund:innen.==`,
    },
    {
      thema: 'GVC', titel: 'Global Value Chains', bild: ['governance', 'smile'],
      text: `Der **GVC-Ansatz** (Gereffi et al., ab Mitte der 2000er) ist **firmenzentriert**, betriebswirtschaftlich beeinflusst (Transaktionskosten) und **anwendungsorientiert**. Leitfrage: Unter welchen Bedingungen bringt die Weltmarktintegration von Betrieben – vor allem im Globalen Süden – **positive lokale Entwicklungseffekte**? Schlüsselbegriffe: **Governance** und **Upgrading**.

**Vier analytische Dimensionen (Gereffi):** (1) **Input-Output-Struktur** (Kettenglieder) · (2) **Territorialität** (Verortung) · (3) **Governance-Struktur** (Kontrolle, Macht) · (4) **institutioneller Rahmen** (Politik, Gesetze, Praktiken). Zentral: Wie verteilen sich Aufgaben, Kosten, Risiken und Profite?

**Governance-Typen:** Markt – Modular – Relational – Abhängig (captive) – Hierarchie, mit zunehmender expliziter Koordination und Machtasymmetrie. Der Typ hängt ab von der **Komplexität der Transaktionen**, der **Kodifizierbarkeit des Wissens** und den **Fähigkeiten der Zulieferer**.

**Lead firm:** hat die Macht, Abläufe in mehreren Ländern zu koordinieren und zu kontrollieren, **auch ohne Eigentümer zu sein** (Dicken).

**Upgrading:** Akteure (Staaten, Firmen, Beschäftigte) steigen von **niedrig- zu höherwertigen Aktivitäten** auf. **Smiling curve (Apple):** Hohe Wertschöpfung bei F&E, Design und Marketing (Apple, USA), am wenigsten bei der Fertigung (Hon Hai, Pegatron).

==GVC: Governance und Upgrading – wer steuert, und wie kommt man in der Kette nach oben?==`,
    },
    {
      thema: 'GPN', titel: 'Global Production Networks', bild: 'gpn',
      text: `Die **„Manchester School“** (Coe, Yeung, Hess, Dicken, Henderson) entwickelte Anfang der 2000er den GPN-Ansatz aus der **Kritik an Kettenansätzen**: Eine „Kette“ ist zu **linear und unterkomplex** → **Netzwerk**; und nicht nur Unternehmen zählen, sondern auch der **institutionelle Rahmen und weitere Akteure** (Staaten, Gewerkschaften, Zivilgesellschaft, Konsument:innen, Finanzsystem).

Definition (Coe et al.): Ein GPN ist ein **System, das von einer global bedeutsamen transnationalen Unternehmung koordiniert und kontrolliert wird** und ein großes Netzwerk internationaler Partner, Kunden und Organisationen umfasst. Typisch: unklare Firmengrenzen, **Kooperation und Konkurrenz zugleich**, Ausdehnung auch durch Finanzialisierung.

**Zentrale Analysekategorien:**
- **Macht (power):** korporativ, kollektiv, institutionell
- **Wert (value):** Schöpfung, Anreicherung, Aneignung
- **Einbettung (embeddedness):** territorial, Netzwerk, gesellschaftlich

Vergleich: GCC/GVC sehen Wertschöpfung als **sequentielle Folge** (Kategorien: Input-Output, Territorialität, Governance, institutioneller Rahmen); GPN als **relationalen, multiskaligen Prozess** mit Firmen und Nicht-Firmen.

==GPN: Macht, Wert, Einbettung – nicht Input-Output und Governance (das ist GVC).==`,
    },
    {
      thema: 'Kritik', titel: 'Kritik und Fazit der Ketten- und Netzwerkansätze',
      text: `**„Dark sides“ (Werner 2015):** Vor allem der GVC-Ansatz betont die **Inklusion** in Lieferketten und übersieht:
1. periodische Marktkrisen und ihre Folgen für lokale Arbeitsmärkte
2. den Zusammenhang von **Geschlechterungleichheit** und Ausbeutung
3. neue, **digital vermittelte Kontrolle** von Zulieferern und Arbeiter:innen
4. Fragmentierung, soziale Polarisierung, Enteignung am „südlichen Ende“
5. negative **Umweltfolgen**

**Fazit:** Transnationale Produktionsnetze schaffen eine neue Qualität internationaler Arbeitsteilung. Ketten- und Netzwerkansätze blicken nicht auf **Containerräume**, sondern auf **Ströme und ungleiche Beziehungen**; sie sind **nicht staatszentriert** und überwinden den **methodologischen Nationalismus**. Sie zeigen den Weg eines Produkts und erklären die Weltwirtschaft in ihren räumlichen Ausprägungen – ein wichtiger Beitrag der Wirtschaftsgeographie.

==Ketten und Netzwerke: Ströme statt Containerräume – aber Achtung vor den „dark sides“.==`,
    },
    {
      thema: 'De-Globalisierung', titel: 'Globalisierung oder De-Globalisierung?',
      text: `Auslöser der Debatte: Finanzkrise 2008/09, Brexit 2016, Trump I (2017–21), COVID-19, Ukraine-Krieg, Trump II, neue Rolle Chinas – Ursachen, Symptome oder Verstärker?

**Anzeichen einer De-Globalisierung:**
- Handel wächst **langsamer als die Wirtschaft** (1960–2019: Wirtschaft ×6, Handel ×18; 2011–2019: Wirtschaft +19 %, Handel nur +3,5 %)
- „**Slowbalisation**“ (The Economist 2019) schon vor Corona
- **Handelsstreits**, aufgekündigte Abkommen (Trump I: NAFTA, TTIP, TPP)
- **Near-shoring/Re-shoring** essentieller Produkte seit der Pandemie
- **neuer Protektionismus** (Inflation Reduction Act 2022, Trump II)

**Periodisierung nach Coe:** internationale Arbeitsteilung (1850–1950, imperiale Staaten) → **neue internationale Arbeitsteilung** (1950–1990, TNCs, FDI) → **globale Arbeitsteilung/GPN-Ära** (1990–2010, lead firms, China als Hub) → „**Slowbalisation**“ (seit 2010, „nationalistische“ Staaten, Makro-Regionalisierung).

**„Globalization 2.0“ (Poon 2025):** **friend-shoring** unter Biden, Sicherheitsinteressen und Unabhängigkeit von China; unter Trump II erratisch, Abkehr von regelbasierter Handelspolitik.

**Vorläufige Einschätzung:** Globalisierung ist **ungebrochen** – keine Umkehr, sondern **Verlangsamung** und **Neukonfiguration** von GPN (de-coupling, re-shoring). Sehr fraglich, dass die Wirtschaft dadurch fairer und resilienter wird: „GVCs are here to stay“.

==Nicht das Ende der Globalisierung, sondern Verlangsamung und Umbau.==`,
    },
  ],
  fragen: [
    /* ---------- Thesen ---------- */
    { id: 'e05-01', typ: 'offen', thema: 'Thesen', wichtig: 2, punkte: 3, quelle: 'VL04-05, S. 58',
      frage: 'Nennen Sie die drei Thesen der Vorlesung zur Globalisierung als Produktionsnetzwerk.',
      antwort: `Erstens ist Globalisierung nicht über Handel, sondern über die Internationalisierung der Produktion definiert, die zunehmend in globalen Produktions- und Vertriebsketten und -netzwerken stattfindet. Zweitens geht es weniger um Verflechtungen zwischen Volkswirtschaften als um „entgrenzte Produktion“, was eine Netzwerkperspektive erfordert. Drittens sind globale Warenketten und Netzwerke zugleich Ausdruck, Triebkraft und wertvoller analytischer Zugang zur Globalisierung.`,
      kernpunkte: ['Globalisierung = Internationalisierung der Produktion (nicht Handel), in Ketten und Netzwerken', '„Entgrenzte Produktion“ statt Verflechtung von Volkswirtschaften → Netzwerkperspektive', 'Ketten/Netzwerke sind Ausdruck, Triebkraft und analytischer Zugang'] },
    { id: 'e05-02', typ: 'wf', thema: 'Thesen', wichtig: 2, quelle: 'VL04-05, S. 58',
      aussage: 'Laut der ersten These der Vorlesung ist Globalisierung vor allem über den wachsenden Welthandel definiert.',
      wahr: false, warum: 'Sie ist über die **Internationalisierung der Produktion** definiert, nicht über Handel.' },
    { id: 'e05-03', typ: 'offen', thema: 'Thesen', wichtig: 3, punkte: 3, quelle: 'VL04-05, S. 62–75',
      frage: 'Unterscheiden Sie die Ansätze Global Commodity Chains, Global Value Chains und Global Production Networks (Entstehung, Vertreter, Schwerpunkt).',
      antwort: `Global Commodity Chains (Wallerstein, Gereffi; 1980er/90er) sind ein eher analytisch-politischer Ansatz, der die internationale Arbeitsteilung und die ungleiche Verteilung des Mehrwerts zwischen Zentren und Peripherien untersucht. Global Value Chains (Gereffi et al.; Mitte 2000er) sind firmenzentriert und anwendungsorientiert und fragen mit den Begriffen Governance und Upgrading, wie Firmen im Globalen Süden ihre Position verbessern. Global Production Networks (Manchester School: Coe, Dicken, Yeung u. a.; frühe 2000er) ersetzen die lineare Kette durch Netzwerke, beziehen Nicht-Firmen-Akteure ein und analysieren Macht, Wert und Einbettung.`,

<script>
/* e06 Regionalentwicklung: raumwirtschaftliche Modelle – VL05-06 Teil 3.1, Abschnitte 1–2 (Rosol, 21.05.2026).
   Analyse: quellen/wirtschaftsgeographie/analyse/VL05-06-Regionale-Entwicklung-und-Standort.md (PDF-Seiten 2–18) */
Lerni.einheit('wirtschaftsgeographie', {
  id: 'e06',
  titel: 'Regionalentwicklung: raumwirtschaftliche Modelle',
  quelle: 'VL05-06 Regionale Entwicklung und Standort (Rosol), PDF-Seiten 2–18',
  skript: [
    {
      thema: 'Grundlagen', titel: 'Region und Regionalentwicklung',
      text: `**Region** (Braun/Schulz): Ausschnitt der Erdoberfläche, der über gemeinsame oder verbindende Merkmale definiert und abgegrenzt werden kann. Maßstabsunabhängig (Rhein-Main-Gebiet, Südasien), in der WiGeo meist **subnational**. Statistik zwingt oft zu administrativen Einheiten; besser ist eine **Regionalisierung** passend zur Fragestellung:
- **Homogenitätskriterium:** Raumeinheiten mit **ähnlichen Strukturen** zusammenfassen (bezüglich eines oder mehrerer Indikatoren weitgehend einheitlich).
- **Funktionalitätskriterium:** Raumeinheiten zusammenfassen, die durch **Verflechtungen** verbunden sind (z. B. Pendlerbeziehungen).

**Entwicklung** ist normativ aufgeladen: zielgerichtete Verbesserung der materiellen Lebenssituation bzw. der Leistungsfähigkeit der Akteure einer Region.

Zwei Sichtweisen: **normativ** – Was sollte getan werden, damit sich eine Region „besser“ entwickelt? (politische Frage; „besser“ ist umstritten) · **analytisch** – Warum entwickeln sich Regionen so, wie sie es tun? (theoriegeleitete Erklärung).

Raumwirtschaftliche Theorien liefern **selektive, teils konkurrierende Partialerklärungen**: Manche sagen einen Abbau, andere eine Zunahme von Disparitäten voraus.

==Homogen = ähnliche Strukturen, funktional = Verflechtungen.==`,
    },
    {
      thema: 'IW-Studie', titel: 'Beispiel: IW-Studie 2026',
      text: `Die IW-Studie „Zwischen Krisen und Chancen“ (Mai 2026) bewertet 400 Kreise und Städte mit **14 Indikatoren** (Wirtschaftsstruktur, Arbeitsmarkt, Lebensqualität). Regionaler Erfolg erklärt sich zu **49 % durch Lebensqualität**, zu **35 % durch Wirtschaftsstruktur** und zu **16 % durch den Arbeitsmarkt**: Wirtschaftsstruktur und Wohn- und Lebensqualität wirken zusammen.

Im Dynamikranking liegt **Cottbus** vorn (Strukturwandel-Initiativen, wissensintensive Dienstleistungen, F&E); **Würzburg** gehört zu den großen Gewinnern: Wandel von der Verwaltungs- und Universitätsstadt zum Hub für Technologie, Start-ups und attraktives Wohnen (Hubland, KI-Zentrum CAIDAS, Gründerzentren, Medizin).

**Schlussfolgerungen:**
1. Erfolgreiche Regionen folgen **klaren Logiken** (Würzburg: Wissenschaft + Gründungsdynamik + Stadtentwicklung).
2. Sie **aktivieren und entwickeln bestehende Stärken** weiter.
3. Entscheidend ist das **Zusammenspiel der Maßnahmen in einem funktionierenden Ökosystem** – weder große Förderprogramme noch Lagevorteile oder industrielle Tradition allein garantieren Erfolg.

==Diese Themen tauchen in den Theorien wieder auf: endogene Potenziale, Cluster, weiche Standortfaktoren.==`,
    },
    {
      thema: 'Neoklassik', titel: 'Neoklassische Theorie der Regionalentwicklung', bild: 'konvergenz',
      text: `Zwei große Gruppen: **Modernisierungstheorien** sehen Entwicklung als **Aufholprozess** – höher entwickelte Regionen geben den Pfad vor, die anderen folgen verzögert (Rostow, Neoklassik, Exportbasis, endogene Regionalentwicklung). **Polarisationstheorien** betonen **kumulative Selbstverstärkung** und eine Zunahme der Gegensätze.

**Neoklassik, Modell mit einer Region:** Wachstum durch **Akkumulation von Sachkapital** (Sparen, Investieren); technischer Fortschritt ist **nicht Teil des Modells**. Wegen **abnehmender Grenzerträge** des Kapitals gleichen sich die Einkommen der Regionen an.

**Mehrregionenmodelle:** Unterschiede werden bei funktionierenden Märkten durch **Wanderung mobiler Produktionsfaktoren** oder durch **Warenhandel** ausgeglichen. Annahmen: homo oeconomicus, vollständige Konkurrenz, keine Transport- und Mobilitätskosten, konstante Skalenerträge. Beispiel: Arbeitskräfte wandern von der Niedriglohn- in die Hochlohnregion, Kapital in die Region mit vielen Arbeitskräften und höherer Verzinsung – bis Löhne und Grenzproduktivität gleich sind. Ungleichgewichte gelten nur als **temporäre Marktstörungen**.

**Kritik:** sehr abstrakt, restriktive Annahmen; **kein echter Raumbezug** (Regionen als dimensionslose Punkte); technischer Fortschritt nur extern; **Institutionen als „Störgrößen“**; Empirie zeigt eher dauerhafte Disparitäten. Stärke: klares, mathematisierbares Gedankengebäude.

==Neoklassik: Faktorwanderung und Handel führen zum Ausgleich – Ungleichheit ist vorübergehend.==`,
    },
    {
      thema: 'Exportbasis', titel: 'Exportbasistheorie', bild: 'exportbasis',
      text: `Wachstum kommt hier **von außen** (exogene Wachstumsdeterminanten):
- Die **wirtschaftliche Basis** einer Region bilden Unternehmen, die in andere Regionen **exportieren** (**basic sector**).
- Der **non-basic sector** deckt die innerregionale Nachfrage.
- Die in der Region erzeugten Einkommen sind deutlich höher als der Einkommenszufluss durch Exporte: **Multiplikatoreffekt**. Er ist umso größer, je höher die **Konsumquote** und je niedriger die **Importquote**.

Politik: Lange hatte die Förderung exportorientierter Unternehmen Vorrang (Ansiedlungspolitik, Infrastruktur). **Ab den 1970ern Skepsis:** weniger ansiedlungswillige Großunternehmen; Ansiedlungen waren oft „**verlängerte Werkbänke**“ mit gering qualifizierten, konjunkturanfälligen Jobs; bescheidene Multiplikatoren.

Würdigung: + plausible Darstellung regionaler Einkommenseffekte, Bedeutung überregionaler Nachfrage. − nur **Nachfrageseite**, **statisch** (kein Strukturwandel), Trennung basic/non-basic schwierig. Konsequenz: Hinwendung zur **endogenen** Regionalentwicklung.

==Exporte bringen Geld in die Region – der Multiplikator vervielfacht es.==`,
    },
    {
      thema: 'Endogene Entwicklung', titel: 'Endogene Regionalentwicklung',
      text: `Endogene Ansätze betonen die **internen Wachstumspotenziale** einer Region – vor allem in ländlichen Räumen und als Erneuerungsstrategie für Altindustrieregionen.

Zentrale Elemente:
- **qualitative** Verbesserung von Wirtschaftsstruktur und Lebensbedingungen statt einseitiger Wachstumsorientierung
- Konzentration auf **kleine und mittlere Unternehmen (KMU)**
- Förderung von **Lernprozessen** und Innovationsfähigkeit bestehender Unternehmen
- Stärkung **intraregionaler Wirtschafts- und Stoffkreisläufe**
- Einbindung **regionaler Akteure** aus verschiedenen Lebensbereichen
- ökonomische und ökologische **Nachhaltigkeit**

Würdigung: + Erfolge in Industrie- wie Entwicklungsländern. − **keine konsistente Theorie**, eher eine Sammlung regionalpolitischer Prinzipien; die endogenen Potenziale peripherer Regionen sind oft zu gering; extern kontrollierte Großunternehmen in Altindustrieregionen lassen sich damit schlecht fassen.

==Endogen: auf eigene Stärken setzen – KMU, Lernen, regionale Kreisläufe, Beteiligung.==`,

    {
      thema: 'Polarisation', titel: 'Polarisationstheorien', bild: 'myrdal',
      text: `Seit den **1950ern** als Kritik an der Gleichgewichtsvorstellung: Entwicklung führt nicht zum Ausgleich, sondern kann Unterschiede durch **kumulative Selbstverstärkung** vertiefen. Annahmen: Produktionsfaktoren sind **ungleich verteilt und teils immobil**; Wissen und technischer Fortschritt verbreiten sich per **Diffusion mit Verzögerung**; **keine vollständige Konkurrenz** (Monopole, Oligopole, externe Effekte); **Staat und Gesellschaft** werden einbezogen.

**Wachstumspole (François Perroux, 1955):** Dynamik geht von **motorischen Einheiten** aus – großen, schnell wachsenden, stark verflochtenen Branchen (z. B. Automobil-, Halbleiterindustrie, Petrochemie). Über Vorleistungen und nachgelagerte Leistungen (**forward and backward linkages**) wirken sie positiv, können aber auch Arbeitskräfte entziehen. Übertragen auf den Raum: **regionale Wachstumspole** mit Ausstrahlung ins Hinterland; seit den 1960ern Regionalpolitik (gezielte Großansiedlungen in der Peripherie). Misslungene Projekte ohne Ausstrahlung: „**Kathedralen in der Wüste**“.

**Zirkulär-kumulative Verursachung (Gunnar Myrdal, 1957):** Einmal entstandene Unterschiede verstärken sich durch positive Rückkopplung – **zentripetale Entzugseffekte (backwash effects)**. Gegenläufig wirken **zentrifugale Ausbreitungseffekte (spread effects)**. Nach Myrdal sind die **Entzugseffekte in der Regel stärker**, umso mehr, je größer die Ausgangsunterschiede.

**Albert O. Hirschman (1958):** ähnlich, aber auf Dauer setzen sich die **Sickereffekte** durch – die Entwicklungslücke schließt sich wieder.

==Myrdal: backwash > spread. Hirschman: am Ende sickert es durch.==`,

    {
      thema: 'Verbindende Ansätze', titel: 'Verbindende Ansätze: endogenes Wachstum und Krugman',
      text: `Seit Ende der 1980er versuchen formale Modelle, die Kluft zwischen Neoklassik, Polarisationstheorien und Empirie zu schließen: Sie berücksichtigen Selbstverstärkung, **Transportkosten, Skaleneffekte** und die Entstehung technischen Fortschritts.

**Neue/endogene Wachstumstheorie (Romer 1990, Lucas):** Technischer Fortschritt wird **modellendogen** erklärt; Innovationen sind Motoren; Wachstum ist proportional zum **Humankapital**. Räumliche Ungleichgewichte werden eher **verstärkt**.

**Geographical Economics / „New Economic Geography“ (Paul Krugman):** Warum ballen sich Industrien? Ballung ist besonders ausgeprägt,
1. je **größer die Skaleneffekte** einer Branche,
2. wenn **Transportkosten niedrig, aber größer als null** sind (im Verhältnis zu den Skaleneffekten),
3. wenn die Industrie **nicht an Rohstofffundorte gebunden** ist.

Warum spezialisieren sich Standorte? **Arbeitsmarkt-Pooling · spezialisierte Zulieferer · technologische Spillover** (Wissensaustausch durch persönliche Kontakte).

Würdigung: + Raum zurück in die Wirtschaftswissenschaften; formalisiert Marshall (Agglomeration), Thünen (Transportkosten), Myrdal (Polarisation); Entwicklung als pfadabhängig. − Spillover und Lernprozesse, soziale und kulturelle Einbettung zu schwach; unklar, **wo genau** Ballung entsteht; Geschichte bleibt modellexogen („history matters“).

==Krugman: Skaleneffekte hoch, Transportkosten niedrig (> 0), nicht rohstoffgebunden → Ballung.==`,

    {
      thema: 'Abhängigkeitsansätze', titel: 'Abhängigkeitsansätze der Politischen Ökonomie',
      text: `Ähnlich den Polarisationsansätzen, aber mit eigener Basis: Unterentwicklung entsteht aus **Machtungleichgewichten** und **historisch gewachsenen strukturellen Abhängigkeiten**. Zentrum und Peripherie sind hier **abstrakte politisch-soziale Kategorien**, nicht konkrete Räume.
- **Neoimperialismustheorie:** Wohlstandsunterschiede gehen auf imperialistische Ausbeutungsstrukturen zurück, die **nach der formellen Unabhängigkeit** der Kolonien fortbestehen; untersucht Machtentfaltung und -sicherung im Globalen Norden.
- **Dependenztheorie:** Die kapitalistischen Länder des Nordens sind für die Unterentwicklung im Süden verantwortlich; **Entwicklung und Unterentwicklung sind interdependente Prozesse**; untersucht die Wirkungen der Ausbeutung im Süden (oft Lateinamerika); These des strukturellen Imperialismus.
- **Weltsystemtheorie (Immanuel Wallerstein):** verbindet beide; die Weltwirtschaft besteht aus drei hierarchisch verbundenen Einheiten: **Zentrum, Semiperipherie, Peripherie**.

Hintergrund ist die **Neue Internationale Arbeitsteilung**: keine „3. Welt“, sondern **eine** Weltwirtschaft bzw. ein Weltsystem.

==Neoimperialismus: Blick auf den Norden · Dependenz: Blick auf den Süden · Weltsystem: das Ganze.==`,

      thema: 'Neoklassische Modelle', titel: 'Neoklassische Standortmodelle: Grundannahmen',
      text: `Die Standorttheorie reicht ins **18. Jh.** zurück (vor allem deutsche Wissenschaftler), ist **kein genuin wirtschaftsgeographischer Ansatz**, prägt aber bis heute die Raumwirtschaftslehre. Übernommene Annahmen: **methodologischer Individualismus, vollkommene Märkte, ökonomische Rationalität**. Probleme werden durch **isolierende Abstraktion** in Modelle übersetzt, um **deduktiv** allgemeine Mechanismen zu finden. Raum = zweidimensionaler **euklidischer Raum**, Entfernungen werden in **Transportkosten** übersetzt; Naturraumunterschiede gelten als „Störgrößen“. Ergebnis: nur **Partialerklärungen**.

**Homo oeconomicus (optimizer)** – vier Verhaltensannahmen:
1. **Gewinnmaximierung**
2. **vollständige Information**
3. **vollständige Rationalität**
4. **vollständiger Wettbewerb** (niemand beeinflusst allein den Preis)

Zwei Fragestellungen: **Was ist der optimale Standort für einen Betrieb?** (von Thünen 1826, Weber 1909) · **Wie lässt sich die Verteilung wirtschaftlicher Zentren erklären?** (Christaller 1933).

==Neoklassische Standortmodelle: homo oeconomicus + Transportkosten + isolierende Abstraktion.==`,

      text: `**Johann Heinrich von Thünen**, „Der isolierte Staat“ (**1826**): erster modelltheoretischer Ansatz zur **optimalen landwirtschaftlichen Landnutzung**.

Annahmen: isolierter Modellstaat ohne Außenhandel; überall gleiche Natur, Bewirtschaftung und Transportbedingungen; **ein einziger Marktort (Stadt) im Zentrum**; homo oeconomicus. Schlüsselgröße ist die **Entfernung zum Markt**: Transportkosten steigen gleichmäßig mit der Entfernung und hängen von Gewicht und Verderblichkeit ab.

**Lagerente = Erlös – Produktionskosten – Transportkosten** (pro Flächeneinheit). Mit zunehmender Entfernung zehren die Transportkosten den Reinerlös auf, bis die Lagerente null ist (Grenzanbieter).

**Mehrere Güter:** Die Lagerentenkurven verlaufen je nach Preis, Anbaukosten und Verderblichkeit/Sperrigkeit unterschiedlich steil. Gewählt wird jeweils das Produkt mit der **höchsten Lagerente**; die Lotrechten der Schnittpunkte ergeben die **Thünenschen Ringe** (Differentialprinzip):
- **Gemüse, Milch:** hoher Preis, leicht verderblich → nah am Markt
- **Bau- und Feuerholz:** schwer und sperrig → mittlere Entfernung
- **Getreide:** niedriger Preis, gut lager- und transportierbar → weiter entfernt

Die **Intensität** der Nutzung nimmt mit der Entfernung ab. Heute eingeschränkt durch sinkende Transportkosten, **Kühlketten**, neue Konsummuster, Agrarpolitik, Globalisierung; das Modell erklärt keine Veränderungen. Bedeutung: erste geschlossene wirtschaftsräumliche Theorie, Grundlage für Christaller und Lösch, erklärt historische Landnutzungsmuster.

==Lagerente = Erlös – Produktionskosten – Transportkosten. Höchste Lagerente gewinnt den Ring.==`,

      text: `**Walter Christaller**, „Die zentralen Orte in Süddeutschland“ (Dissertation **1933**): Die optimale Verteilung von Versorgungseinrichtungen ergibt sich aus einer **Hierarchie zentraler Orte**. Bis heute Grundlage der **Raumordnung**.

- **Zentrale Orte** = Orte mit **Bedeutungsüberschuss**: Sie versorgen mehr als die eigene Bevölkerung.
- **Innere (untere) Reichweite** = Mindestumsatz bzw. Mindesteinzugsgebiet für einen rentablen Betrieb.
- **Äußere (obere) Reichweite** = maximale Entfernung, die Kund:innen in Kauf nehmen; darüber übersteigen die Wegekosten den Nutzen.
- **Sechsecke:** Kreisförmige Marktgebiete ließen **Versorgungslücken** oder **zu große Überlappungen** (innere Reichweite unterschritten). Die **Wabenstruktur** deckt den Raum lückenlos ab.

**Hierarchie:** Die innere Reichweite hängt von der **Nachfragefrequenz** ab (täglicher vs. periodischer/episodischer Bedarf). Der **Rang** eines Zentrums ergibt sich aus dem **höchstrangigen** dort angebotenen Gut; höherrangige Zentren bieten **alle niederrangigen Güter** mit an; Zentren gleicher Stufe haben ein **identisches Angebot**. So überlagern sich Waben verschiedener Größe.

**Heute:** Zentrale-Orte-Prinzip der Raumordnung mit **Ober-, Mittel- und Grundzentren** als normatives Leitbild (ausgewogene Raumstruktur, Versorgung in der Fläche). In der Praxis sind einzelne Ober- und Mittelzentren gefährdet. Beispiel: **Würzburg ist laut Landesentwicklungsprogramm Bayern ein Regionalzentrum** (Kategorien: Mittelzentren, Oberzentren, Regionalzentren, Metropolen).

==Christaller: Bedeutungsüberschuss, innere/äußere Reichweite, Sechsecke, Hierarchie.==`,

      thema: 'Weber', titel: 'Weber: Industriestandort', bild: ['weber', 'isodapane'],
      text: `**Alfred Weber**, „Reine Theorie des Standorts“ (**1909**), Begründer der industriellen Standortlehre. Annahme: Der Gewinn hängt nur von **standortabhängigen Kosten** ab und wird durch **Transportkostenersparnis** maximiert. Gegeben sind die Fundorte der Materialien und ein Absatzmarkt; Frachtraten, Preise und Produktionskosten sind konstant.

**Optimaler Standort = tonnenkilometrischer Minimalpunkt** (P): der Punkt mit den wenigsten Tonnenkilometern (Entfernung × Gewicht) zwischen Materialfundorten (M1, M2) und Konsumort (K).
- **Lokalisierte Materialien** sind an Abbauorte gebunden: **Reingewichtsmaterialien** (gehen ganz ins Produkt ein, z. B. Edelmetalle) und **Gewichtsverlustmaterialien** (z. B. Steinkohle, viele Erze).
- **Ubiquitäre Materialien** sind überall frei verfügbar (Luft, Sauerstoff, Wasser).
- Nur Ubiquitäten oder Reingewichtsmaterialien → **P = K**. Normalfall: P liegt **im Dreieck**; je mehr Gewichtsverlustmaterial, desto näher rückt P an die Fundorte.

**Erweiterungen:**
1. **Arbeitskosten:** Ein Standort abseits von P lohnt, wenn die Lohnersparnis die zusätzlichen Transportkosten übersteigt. **Isotimen** = Linien gleicher Transportkosten; **Isodapanen** = Linien gleicher Zusatzkosten gegenüber P; **kritische Isodapane** = Linie, auf der Mehrtransportkosten und Arbeitskostenersparnis sich ausgleichen.
2. **Agglomeration:** „Ein Agglomerationsfaktor ist ein Vorteil, also eine Verbilligung der Produktion oder des Absatzes“, die aus der Ballung an einem Platz entsteht (z. B. gemeinsame Infrastruktur). **Überlappen die kritischen Isodapanen mehrerer Betriebe**, ist der Umzug in den gemeinsamen Agglomerationsraum rational.

==Weber: Minimalpunkt der Tonnenkilometer – verschoben durch billige Arbeit und Agglomeration.==`,

      text: `Was die drei Modelle leisten:
- **Thünen** → optimale **agrarische Landnutzung**

- **Weber** → optimaler Standort für **Industriebetriebe**

**Behavioristische Ansätze** (behavioral geography): differenziertes Bild des Verhaltens mit Motiven, Zwängen, **Informationsdefiziten**. Unternehmen sind **Satisficer statt Optimizer**: Sie suchen in einem **mehrstufigen Suchprozess** eine zufriedenstellende, nicht die optimale Lösung. **Verhaltensmatrix (Allan Pred):** Standortentscheidungen hängen vom **Informationsstand** und von der **Fähigkeit** ab, die Informationen zu nutzen.

**Standortfaktoren** = Vorteile für eine wirtschaftliche Aktivität, die an bestimmte Orte gebunden sind. **Harte Faktoren** (gut messbar, direkt relevant, prägend für die neoklassischen Modelle: Verkehrsanbindung, Steuern, Flächen, Arbeitskosten) vs. **weiche Faktoren** (schwer messbar, eher subjektiv: Image, Wohnwert, Kultur, Umweltqualität). Entscheidungen sind selten monokausal. In der heutigen WiGeo spielen Standortfaktoren nur noch eine untergeordnete Rolle; wichtiger sind Erhalt und Entwicklung bestehender Standorte, Gründungsforschung und **„windows of locational opportunity“ (Scott/Storper 1987)**: Pionierunternehmen nutzen Gelegenheitsfenster, statt Standorte rational zu vergleichen.

- Standortentscheidungen werden durch **gesellschaftliche Rahmenbedingungen und externe Zwänge** bestimmt: Normen und Gesetze (z. B. Arbeitsrechte), ökonomische Abhängigkeiten zwischen Unternehmen, die Stärke von Gewerkschaften.

- Standortbedingungen sind damit **Ergebnisse sozialer Prozesse**, an denen Politik, Wirtschaft und Zivilgesellschaft beteiligt sind.

Innovationen sind keine punktuellen Ereignisse, sondern **längerfristige Prozesse**:
- **Invention** = die Erfindung
- **Innovation** = die wirtschaftliche Umsetzung der Neuerung
- **Diffusion** = die Ausbreitung, also Übernahme durch andere Marktteilnehmer

**Basisinnovationen** bringen grundlegende Veränderungen (neue Produkte, Verfahren, Transport-, Logistik- oder Kommunikationssysteme, Vertriebsformen); **Verbesserungsinnovationen** verändern graduell. Nach dem Inhalt unterscheidet man Produkt-, Prozess-, Markt-, Vertriebs- und organisatorische Innovationen.

==Invention = Erfindung, Innovation = Umsetzung, Diffusion = Ausbreitung.==`,

1. **Entwicklung und Einführung:** hohe Entwicklungskosten, geringer Erlös, Verlust. Wichtig: **qualifizierte Arbeitskräfte, hochwertige Infrastruktur**. Standort: **Agglomerationsraum**.

4. **Schrumpfung:** Gewinne schrumpfen, Verluste.

Dabei wandelt sich die Produktion von humankapital- zu sach- bzw. arbeitsintensiv, von Produkt- zu **Prozessinnovationen**, von kleinen Losgrößen zur Massenproduktion: **intraregionale, interregionale und internationale Dezentralisierung** – ein Erklärungsbeitrag zur Globalisierung (Verlagerung in lohngünstige Länder).

**Kritik:** **starrer Produktbegriff** · vernachlässigt **Anpassungsfähigkeit** und permanente **Verbesserungsinnovationen** · ohne **sozialen und regulatorischen Kontext** · **sehr linear**.

==Produktlebenszyklus: Agglomeration → Umland → Peripherie/Niedriglohnland.==`,

      ] },
    { id: 'e08-04', typ: 'mc', thema: 'Neoklassische Modelle', wichtig: 2, quelle: 'VL05-06, S. 51',
      frage: 'Welche Modelle fragen nach dem **optimalen Standort eines einzelnen Betriebs**? (mehrere möglich)',
      optionen: [
        { t: 'Von Thünen', r: true, warum: 'Welche Landnutzung ist an welchem Ort optimal?' },
        { t: 'Weber', r: true, warum: 'Transportkostenoptimaler Standort eines Industriebetriebs.' },
        { t: 'Christaller', warum: 'Christaller erklärt die Verteilung wirtschaftlicher Zentren im Raum.' },
        { t: 'Myrdal', warum: 'Myrdal ist eine Theorie der Regionalentwicklung (Polarisation), keine Standorttheorie.' },
      ] },

    /* ---------- Thünen ---------- */
    { id: 'e08-05', typ: 'offen', thema: 'Thünen', wichtig: 3, punkte: 3, quelle: 'VL05-06, S. 52', bildLoesung: 'lagerente',
      frage: 'Definieren Sie die Lagerente nach von Thünen (1 P.) und erläutern Sie, wie daraus die Thünenschen Ringe entstehen (2 P.).',
      antwort: `Die Lagerente ist der Reinerlös pro Flächeneinheit, der sich aus der Lage zum Markt ergibt: Erlös minus Produktionskosten minus Transportkosten. Weil die Transportkosten mit der Entfernung steigen, sinkt die Lagerente mit zunehmender Distanz – je nach Preis, Kosten und Verderblichkeit/Sperrigkeit eines Produkts unterschiedlich steil. Der homo oeconomicus wählt an jedem Ort das Produkt mit der höchsten Lagerente; die Schnittpunkte der Lagerentenkurven markieren die Übergänge und ergeben ringförmige Landnutzungszonen um den Markt.`,
      kernpunkte: ['(a) Lagerente = Erlös – Produktionskosten – Transportkosten (pro Fläche), abhängig von der Entfernung zum Markt', '(b) Lagerentenkurven fallen je Produkt unterschiedlich steil (Preis, Kosten, Verderblichkeit/Gewicht)', '(b) An jedem Ort wird das Produkt mit der höchsten Lagerente gewählt; Schnittpunkte = Ringgrenzen'] },
    { id: 'e08-06', typ: 'offen', thema: 'Thünen', wichtig: 2, punkte: 3, quelle: 'VL05-06, S. 53', bildLoesung: 'thuenen',
      frage: 'Nennen Sie drei Beispiele für die Anordnung der Landnutzung in den Thünenschen Ringen und begründen Sie sie.',
      antwort: `Gemüse und Milch werden nah an der Stadt erzeugt, weil sie einen hohen Marktpreis haben und leicht verderblich sind. Bau- und Feuerholz liegt in mittlerer Entfernung, weil es schwer und sperrig ist und deshalb hohe Transportkosten verursacht. Getreide wird weiter entfernt angebaut, weil es einen niedrigen Preis hat und sich leicht lagern und transportieren lässt.`,
      kernpunkte: ['Gemüse/Milch nah am Markt: hoher Preis, hohe Verderblichkeit', 'Bau-/Feuerholz mittlere Entfernung: schwer und sperrig, hohe Transportkosten', 'Getreide weiter entfernt: niedriger Preis, gut lager- und transportierbar'] },
    { id: 'e08-07', typ: 'paare', thema: 'Thünen', wichtig: 2, quelle: 'VL05-06, S. 53', bild: 'thuenen-ringe', bildLoesung: 'thuenen',
      frage: 'Ordne den Thünenschen Ringen 1–4 die Nutzung zu.',
      paare: [
        ['Ring 1', 'Milch und Gemüse (intensive Landwirtschaft)'],
        ['Ring 2', 'Bau- und Feuerholz (Wald)'],
        ['Ring 3', 'Getreide, Kartoffeln (extensive Landwirtschaft)'],
        ['Ring 4', 'Viehzucht'],
      ] },
    { id: 'e08-08', typ: 'luecke', thema: 'Thünen', wichtig: 3, quelle: 'VL05-06, S. 52',
      frage: 'Formel der Lagerente. Fülle die Lücken.',
      text: 'Lagerente = Erlös – [[Produktionskosten]] – [[Transportkosten]]. Entscheidend ist die [[Distanz|Entfernung]] zum Markt.' },
    { id: 'e08-09', typ: 'wf', thema: 'Thünen', wichtig: 2, quelle: 'VL05-06, S. 53',
      aussage: 'Nach von Thünen nimmt die Intensität der Agrarproduktion mit zunehmender Entfernung vom Markt zu.',
      wahr: false, warum: 'Sie **nimmt ab**: Nah am Markt liegt die intensive Landwirtschaft (Milch, Gemüse), weit draußen die extensive (Getreide, Viehzucht).' },
    { id: 'e08-10', typ: 'mc', thema: 'Thünen', quelle: 'VL05-06, S. 53',
      frage: 'Welche Aussagen zur Würdigung des Thünen-Modells treffen zu? (mehrere möglich)',
      optionen: [
        { t: 'Geschlossene Kühlketten verringern die Bedeutung der Verderblichkeit.', r: true, warum: 'Eine der heutigen Einschränkungen des Modells.' },
        { t: 'Es kann historisch bedingte Landnutzungsmuster erklären.', r: true, warum: 'Ebenso Räume mit ausgeprägten Transportkosten oder -hindernissen.' },
        { t: 'Es erklärt Veränderungsprozesse der Landnutzung besonders gut.', warum: 'Im Gegenteil: keine Erklärung von Veränderungsprozessen (statisch).' },
        { t: 'Es berücksichtigt Agrarpolitik als zentrale Einflussgröße.', warum: 'Agrarpolitik ist gerade eine Einschränkung, die das Modell nicht abbildet.' },
      ] },

    /* ---------- Christaller ---------- */
    { id: 'e08-11', typ: 'offen', thema: 'Christaller', wichtig: 2, punkte: 3, quelle: 'VL05-06, S. 54',
      frage: 'Was sind zentrale Orte (1 P.), und was bedeuten innere und äußere Reichweite (2 P.)?',
      antwort: `Zentrale Orte sind Orte mit einem Bedeutungsüberschuss: Sie versorgen nicht nur die eigene Bevölkerung, sondern auch ihr Umland. Die innere (untere) Reichweite ist die Umsatzschwelle bzw. das Mindesteinzugsgebiet, das ein Anbieter für einen rentablen Betrieb braucht. Die äußere (obere) Reichweite ist die maximale Entfernung, die Kund:innen für ein Gut in Kauf nehmen; darüber hinaus übersteigen die Kosten der Raumüberwindung den Nutzen.`,
      kernpunkte: ['(a) Zentrale Orte: Bedeutungsüberschuss, versorgen über die eigene Bevölkerung hinaus', '(b) Innere Reichweite: für rentablen Betrieb nötige Umsatzschwelle/Mindesteinzugsgebiet', '(b) Äußere Reichweite: maximal in Kauf genommene Entfernung der Kund:innen'] },
    { id: 'e08-12', typ: 'offen', thema: 'Christaller', wichtig: 2, punkte: 2, quelle: 'VL05-06, S. 55', bildLoesung: 'christaller',
      frage: 'Warum ergibt sich bei Christaller eine sechseckige Struktur der Marktgebiete?',
      antwort: `Marktgebiete sollen so angeordnet sein, dass weder Versorgungslücken (Unterversorgung) entstehen noch sich die Gebiete so stark überlappen, dass die innere Reichweite einzelner Orte unterschritten wird. Kreisförmige Gebiete erfüllen das nicht; geometrisch löst das nur eine lückenlose Sechseck- bzw. Wabenstruktur.`,
      kernpunkte: ['Keine Versorgungslücken (wie bei nebeneinanderliegenden Kreisen)', 'Keine zu große Überlappung, die die innere Reichweite unterschreitet → Sechsecke/Waben decken lückenlos ab'] },
    { id: 'e08-13', typ: 'offen', thema: 'Christaller', wichtig: 2, punkte: 3, quelle: 'VL05-06, S. 55',
      frage: 'Nennen Sie drei Eigenschaften des hierarchischen Systems zentraler Orte.',
      antwort: `Der Rang eines Zentrums ergibt sich aus dem höchstrangigen Gut, das dort angeboten wird. Höherrangige Zentren bieten zusätzlich alle Güter niedrigeren Ranges an. Zentren derselben Hierarchiestufe haben ein identisches Angebot. Daraus entsteht eine sich überlagernde Wabenstruktur; die Hierarchie folgt der Nachfragefrequenz der Güter.`,
      kernpunkte: ['Rang = höchstrangiges angebotenes Gut', 'Höherrangige Zentren bieten auch alle niederrangigen Güter an', 'Gleiche Stufe = identisches Angebot (überlagerte Waben)'] },
    { id: 'e08-14', typ: 'mc', thema: 'Christaller', wichtig: 3, quelle: 'VL05-06, S. 54–56; Musterklausur WS23/24, 2.6',
      frage: 'Welche Aussagen treffen **nicht** auf das Zentrale-Orte-System in Deutschland zu? (mehrere möglich)',
      optionen: [
        { t: 'Es hat nur geringe Bedeutung für die räumliche Planung.', r: true, warum: 'Falsch: Das Zentrale-Orte-Prinzip ist bis heute Grundlage der Raumordnung.' },
        { t: 'Zentren derselben Hierarchiestufe haben ein unterschiedliches Angebot.', r: true, warum: 'Falsch: Zentren gleicher Stufe haben ein identisches Angebot.' },
        { t: 'Einzelne Ober- und Mittelzentren sind heute in ihrer Funktion gefährdet.', warum: 'Trifft zu: Herausforderung in der Praxis.' },
        { t: 'Würzburg ist laut Landesentwicklungsprogramm Bayern ein Regionalzentrum.', warum: 'Trifft zu (Folie 2026).' },
      ],
      erklaerung: 'Die Musterklausur (andere Prüferin) nennt Würzburg ein „Oberzentrum“. Die Folien 2026 zeigen laut LEP Bayern die Kategorie **Regionalzentrum** – in der App gilt die Folie.' },
    { id: 'e08-15', typ: 'offen', thema: 'Christaller', wichtig: 2, punkte: 2, quelle: 'VL05-06, S. 56',
      frage: 'Welche Bedeutung hat das Zentrale-Orte-Prinzip heute?',
      antwort: `Es ist Grundlage der Raumordnung: Ober-, Mittel- und Grundzentren mit typischer Ausstattung dienen als normatives Leitbild für eine ausgewogene Raumstruktur und eine gute Versorgung in der Fläche. In der Praxis gibt es Herausforderungen, etwa gefährdete Ober- und Mittelzentren; in Bayern kennt der Landesentwicklungsplan zusätzlich Regionalzentren und Metropolen (Würzburg = Regionalzentrum).`,
      kernpunkte: ['Grundlage der Raumordnung: Ober-, Mittel-, Grundzentren als normatives Leitbild (ausgewogene Raumstruktur, Versorgung in der Fläche)', 'Praxis: Herausforderungen/Gefährdung einzelner Zentren; LEP Bayern (Würzburg = Regionalzentrum)'] },
    { id: 'e08-16', typ: 'mc', thema: 'Christaller', wichtig: 2, quelle: 'VL05-06, S. 54',
      frage: 'Wie heißt die maximale Entfernung, die Kund:innen für ein zentrales Gut in Kauf nehmen?',
      optionen: [
        { t: 'Äußere (obere) Reichweite', r: true, warum: 'Darüber übersteigen die Wegekosten den Nutzen.' },
        { t: 'Innere (untere) Reichweite', warum: 'Das ist die Umsatzschwelle für einen rentablen Betrieb.' },
        { t: 'Bedeutungsüberschuss', warum: 'So heißt die Versorgungsleistung über die eigene Bevölkerung hinaus.' },
        { t: 'Kritische Isodapane', warum: 'Begriff aus Webers Industriestandortlehre.' },
      ] },
    { id: 'e08-17', typ: 'wf', thema: 'Christaller', wichtig: 2, quelle: 'VL05-06, S. 55',
      aussage: 'Ein höherrangiger zentraler Ort bietet auch alle Güter der niedrigeren Hierarchiestufen an.',
      wahr: true, warum: 'Genau so ist die Hierarchie aufgebaut; der Rang ergibt sich aus dem höchstrangigen angebotenen Gut.' },

    /* ---------- Weber ---------- */
    { id: 'e08-18', typ: 'offen', thema: 'Weber', wichtig: 2, punkte: 2, quelle: 'VL05-06, S. 57–58', bildLoesung: 'weber',
      frage: 'Erläutern Sie Webers Grundmodell der Industriestandortwahl.',
      antwort: `Weber nimmt an, dass der Gewinn nur von den standortabhängigen Kosten abhängt und allein durch Transportkostenersparnis maximiert wird; Materialfundorte und Absatzmarkt sind gegeben, Frachtraten und Preise konstant. Optimal ist der tonnenkilometrische Minimalpunkt: der Standort, an dem die Summe aus Entfernung mal Gewicht zwischen Materialfundorten, Produktionsort und Konsumort am kleinsten ist – im Normalfall ein Punkt innerhalb des Standortdreiecks.`,
      kernpunkte: ['Gewinn nur von standortabhängigen Kosten abhängig, Maximierung durch Transportkostenersparnis', 'Optimum = tonnenkilometrischer Minimalpunkt (Entfernung × Gewicht) im Dreieck M1–M2–K'] },
    { id: 'e08-19', typ: 'offen', thema: 'Weber', wichtig: 3, punkte: 2, quelle: 'VL05-06, S. 58; Musterklausur WS23/24, 2.2',
      frage: 'Unterscheiden Sie lokalisierte und ubiquitäre Materialien nach Weber und nennen Sie jeweils ein Beispiel.',
      antwort: `Lokalisierte Materialien sind an bestimmte Abbauorte gebunden; dazu gehören Reingewichtsmaterialien wie Edelmetalle und Gewichtsverlustmaterialien wie Steinkohle oder viele Erze. Ubiquitäre Materialien sind nicht standortgebunden, sondern überall frei verfügbar, etwa Luft, Sauerstoff oder Wasser. Werden nur Ubiquitäten oder Reingewichtsmaterialien verwendet, liegt der optimale Produktionsstandort am Konsumort.`,
      kernpunkte: ['Lokalisiert: an Abbauorte gebunden, z. B. Edelmetalle (Reingewicht) oder Steinkohle/Erze (Gewichtsverlust)', 'Ubiquitär: überall frei verfügbar, z. B. Luft, Sauerstoff, Wasser'] },
    { id: 'e08-20', typ: 'mc', thema: 'Weber', wichtig: 3, quelle: 'VL05-06, S. 58; Musterklausur WS23/24, 2.2',
      frage: 'Was trifft auf ubiquitäre Materialien zu? (mehrere möglich)',
      optionen: [
        { t: 'Sie sind nahezu überall verfügbar, z. B. Luft oder Wasser.', r: true, warum: 'Genau das bedeutet ubiquitär.' },
        { t: 'Werden nur sie verwendet, liegt der optimale Standort am Konsumort.', r: true, warum: 'Variante A: P = K.' },
        { t: 'Sie kommen nur an bestimmten Fundorten vor.', warum: 'Das gilt für lokalisierte Materialien.' },
        { t: 'Edelmetalle sind ein typisches Beispiel.', warum: 'Edelmetalle sind lokalisierte Reingewichtsmaterialien.' },
      ] },
    { id: 'e08-21', typ: 'mc', thema: 'Weber', wichtig: 2, quelle: 'VL05-06, S. 58',
      frage: 'Ein Betrieb verarbeitet vor allem Gewichtsverlustmaterialien (z. B. Erz). Wohin verschiebt sich sein tonnenkilometrischer Minimalpunkt?',
      optionen: [
        { t: 'In Richtung der Materialfundorte', r: true, warum: 'Das Fertigprodukt ist leichter als die Rohstoffe – es ist günstiger, das Produkt zu transportieren.' },
        { t: 'In Richtung des Konsumorts', warum: 'Das gilt eher, wenn Ubiquitäten oder Reingewichtsmaterialien überwiegen.' },
        { t: 'Genau auf den Konsumort', warum: 'P = K gilt nur bei Ubiquitäten oder Reingewichtsmaterialien.' },
        { t: 'Er bleibt unabhängig vom Material in der Dreiecksmitte.', warum: 'Die Lage hängt gerade vom Gewichtsverlust ab.' },
      ] },
    { id: 'e08-22', typ: 'offen', thema: 'Weber', wichtig: 2, punkte: 2, quelle: 'VL05-06, S. 58',
      frage: 'Erläutern Sie die kritische Isodapane in Webers erweitertem Modell.',
      antwort: `Isodapanen sind Linien gleicher zusätzlicher Transportkosten, die entstehen, wenn ein Betrieb vom tonnenkilometrischen Minimalpunkt abweicht. Die kritische Isodapane ist die Linie, auf der dieser Transportkostenmehraufwand genau durch die Arbeitskostenersparnis an einem billigeren Standort ausgeglichen wird. Liegt ein Standort mit niedrigen Arbeitskosten innerhalb der kritischen Isodapane, lohnt sich die Verlagerung.`,
      kernpunkte: ['Isodapanen: Linien gleicher Zusatzkosten bei Abweichung vom Minimalpunkt', 'Kritische Isodapane: Mehrtransportkosten = Arbeitskostenersparnis; innerhalb lohnt die Verlagerung'] },
    { id: 'e08-23', typ: 'offen', thema: 'Weber', wichtig: 2, punkte: 2, quelle: 'VL05-06, S. 59', bildLoesung: 'isodapane',
      frage: 'Wie erklärt Weber Agglomeration?',
      antwort: `Nach Weber entfernt sich der optimale Standort vom Minimalpunkt, wenn durch die Nähe zu anderen Betrieben Kosten gespart werden, etwa durch gemeinsam nutzbare Infrastruktur – ein Agglomerationsfaktor ist eine Verbilligung von Produktion oder Absatz durch Ballung an einem Platz. Überlappen sich die kritischen Isodapanen mehrerer Unternehmen, ist die Verlagerung in diesen gemeinsamen Agglomerationsraum wirtschaftlich rational.`,
      kernpunkte: ['Agglomerationsvorteil = Kostenersparnis durch Ballung an einem Platz (z. B. gemeinsame Infrastruktur)', 'Überlappen die kritischen Isodapanen mehrerer Betriebe, ist der gemeinsame Agglomerationsraum rational'] },
    { id: 'e08-24', typ: 'mc', thema: 'Weber', wichtig: 2, quelle: 'VL05-06, S. 60', bild: 'isodapane',
      frage: 'Die kritischen Isodapanen der Firmen A, B und C überlappen sich; die von D überlappt mit keiner anderen. Welche Standorte wählen die Firmen?',
      optionen: [
        { t: 'A, B und C wählen den gemeinsamen Agglomerationsraum, D bleibt am Minimalpunkt.', r: true, warum: 'So auch die Lösung auf der Folie: D hat keine zur Agglomeration bereite Partnerfirma.' },
        { t: 'Alle vier bleiben an ihrem tonnenkilometrischen Minimalpunkt.', warum: 'Für A–C lohnt die Agglomeration, weil ihre Ersparnis die Mehrtransportkosten übersteigt.' },
        { t: 'Alle vier ziehen in den Agglomerationsraum.', warum: 'D liegt außerhalb – für D würden die Zusatzkosten die Ersparnis übersteigen.' },
        { t: 'D wählt den Agglomerationsraum, A–C bleiben am Minimalpunkt.', warum: 'Genau umgekehrt.' },
      ] },
    { id: 'e08-25', typ: 'luecke', thema: 'Weber', quelle: 'VL05-06, S. 58',
      text: '[[Isotimen]] sind Linien gleicher Transportkosten. [[Isodapanen]] sind Linien gleicher zusätzlicher Kosten, die durch eine Abweichung vom tonnenkilometrischen [[Minimalpunkt]] entstehen.' },
    { id: 'e08-26', typ: 'wf', thema: 'Weber', wichtig: 2, quelle: 'VL05-06, S. 58–59',
      aussage: 'Weber berücksichtigt auch in seinem erweiterten Modell ausschließlich Transportkosten.',
      wahr: false, warum: 'Er erweitert das Grundmodell um **variable Arbeitskosten** (kritische Isodapane) und **Agglomerationseffekte**.' },

    /* ---------- Würdigung ---------- */
    { id: 'e08-27', typ: 'offen', thema: 'Würdigung', wichtig: 2, punkte: 3, quelle: 'VL05-06, S. 50 und 61',
      frage: 'Nennen Sie drei Kritikpunkte an den neoklassischen Standortmodellen.',
      antwort: `Sinkende Transportkosten, neue Technologien und Strukturwandel haben die beschriebenen Raummuster teilweise aufgelöst; heute spielen Transportkosten in den meisten Branchen nur eine geringe Rolle. Die rigiden Annahmen des homo oeconomicus bilden die Vielfalt menschlichen Verhaltens nur unzureichend ab. Und die Modelle sind statisch, erklären also keinen Wandel.`,
      kernpunkte: ['Sinkende Transportkosten/neue Technologien lösen die Raummuster auf (Transportkosten heute meist unbedeutend)', 'Starre homo-oeconomicus-Annahmen bilden reales Verhalten schlecht ab', 'Statischer Charakter, keine Erklärung von Wandel'] },
    { id: 'e08-28', typ: 'paare', thema: 'Würdigung', wichtig: 2, quelle: 'VL05-06, S. 61',
      frage: 'Welches Modell erklärt was?',
      paare: [
        ['Von Thünen', 'Optimale agrarische Landnutzung'],
        ['Christaller', 'Optimale Versorgung mit Dienstleistungen und öffentlichen Einrichtungen'],
        ['Weber', 'Optimaler Standort für Industriebetriebe'],
      ] },

    /* ---------- Verhalten und Standortfaktoren ---------- */
    { id: 'e08-29', typ: 'offen', thema: 'Verhalten und Standortfaktoren', wichtig: 2, punkte: 2, quelle: 'VL05-06, S. 62–63',
      frage: 'Erläutern Sie, was der behavioristische Ansatz mit „Satisficer statt Optimizer“ meint.',
      antwort: `Anders als der optimierende homo oeconomicus der Neoklassik handeln Unternehmen mit unvollständiger Information, begrenzter Verarbeitungskapazität, Motiven und Zwängen. Sie suchen deshalb in einem meist mehrstufigen Suchprozess nicht den optimalen, sondern einen zufriedenstellenden Standort; nach Preds Verhaltensmatrix hängt die Entscheidung von Informationsstand und der Fähigkeit ab, diese Information zu nutzen.`,
      kernpunkte: ['Unvollständige Information, begrenzte Verarbeitung, Motive/Zwänge statt vollständiger Rationalität', 'Zufriedenstellende statt optimale Lösung im mehrstufigen Suchprozess (Pred: Informationsstand × Nutzungsfähigkeit)'] },
    { id: 'e08-30', typ: 'offen', thema: 'Verhalten und Standortfaktoren', wichtig: 2, punkte: 2, quelle: 'VL05-06, S. 64', bildLoesung: 'standortfaktoren',
      frage: 'Was sind Standortfaktoren (1 P.), und wie unterscheiden sich harte und weiche Standortfaktoren (1 P.)?',
      antwort: `Standortfaktoren sind Vorteile für eine wirtschaftliche Aktivität, die an bestimmte Orte gebunden sind. Harte Standortfaktoren sind gut messbar und unmittelbar für die Geschäftstätigkeit relevant – etwa Verkehrsanbindung, Steuern, Flächen oder Arbeitskosten – und prägen die neoklassischen Modelle. Weiche Standortfaktoren wie Image, Wohnwert oder Kulturangebot sind schwer messbar und beruhen eher auf subjektiver Einschätzung, können aber entscheidend sein.`,
      kernpunkte: ['(a) Standortfaktoren: ortsgebundene Vorteile für eine wirtschaftliche Aktivität', '(b) Hart = gut messbar, direkt relevant (Verkehr, Steuern, Arbeitskosten); weich = schwer messbar, subjektiv (Image, Wohnwert, Kultur)'] },
    { id: 'e08-31', typ: 'karte', thema: 'Verhalten und Standortfaktoren', quelle: 'VL05-06, S. 64',
      vorne: '„Windows of locational opportunity“ (Scott/Storper 1987)',
      hinten: `Pionierunternehmen entscheiden weniger auf Grundlage rationaler Standortvergleiche, sondern nutzen **sich bietende Gelegenheitsfenster** für ihre Standortwahl.` },
    { id: 'e08-32', typ: 'mc', thema: 'Strukturelle Ansätze', quelle: 'VL05-06, S. 62 und 65–66',
      frage: 'Welcher Ansatz betont, dass Standortentscheidungen von gesellschaftlichen Makrostrukturen abhängen und Standortbedingungen Ergebnis sozialer Prozesse sind?',
      optionen: [
        { t: 'Strukturelle Ansätze', r: true, warum: 'Z. B. Gesetze, Gewerkschaften, Abhängigkeiten; Unternehmen gestalten Bedingungen aktiv mit.' },
        { t: 'Behavioristische Ansätze', warum: 'Sie betonen individuelle Entscheidungen, Information und Wahlfreiheit.' },
        { t: 'Dynamisch-zyklische Ansätze', warum: 'Sie erklären Standortwandel durch Innovationen und Zyklen.' },
        { t: 'Neoklassische Standortmodelle', warum: 'Sie gehen vom optimierenden Einzelbetrieb aus.' },
      ] },
    { id: 'e08-33', typ: 'offen', thema: 'Strukturelle Ansätze', punkte: 2, quelle: 'VL05-06, S. 65–66',
      frage: 'Erläutern Sie die Sicht struktureller Ansätze auf Standortentscheidungen.',
      antwort: `Strukturelle Ansätze sehen Standortentscheidungen durch gesellschaftliche Rahmenbedingungen und externe Zwänge bestimmt, etwa durch Gesetze und Arbeitsrechte, ökonomische Abhängigkeiten zwischen Unternehmen oder die Stärke von Gewerkschaften. Zugleich reagieren Unternehmen nicht nur auf Standortbedingungen, sondern verändern sie aktiv, z. B. durch Investitionen in Bildung oder Infrastruktur – Standortbedingungen sind damit Ergebnis sozialer Prozesse.`,
      kernpunkte: ['Entscheidungen durch gesellschaftliche Rahmenbedingungen/Zwänge bestimmt (Gesetze, Abhängigkeiten, Gewerkschaften)', 'Unternehmen gestalten Standortbedingungen aktiv mit – diese sind Ergebnis sozialer Prozesse'] },

    /* ---------- Innovation ---------- */
    { id: 'e08-34', typ: 'offen', thema: 'Innovation', wichtig: 2, punkte: 3, quelle: 'VL05-06, S. 67',

      thema: 'Wachstumsgrenzen', titel: 'Keine Entkopplung, planetare Grenzen', bild: 'planetgrenzen',
      text: `**Kein Entkopplungseffekt:** Nach globalen Krisen (z. B. Finanzkrise 2008/09) steigen die CO₂-Emissionen rasch wieder; die CO₂-Konzentration in der Atmosphäre steigt jedes Jahr. Die **Emissionsintensität** der Wirtschaft sinkt zwar, aber **nicht genug, um das Wirtschaftswachstum auszugleichen** – Effizienzgewinne werden aufgezehrt (Rebound).

**Planetare Grenzen** (Konzept seit **2009**, Rockström et al.; wird aktualisiert): Grenzen der Belastbarkeit des Erdsystems. Überschritten waren 2009 **3 von 7** bewerteten Grenzen, 2015 **4 von 7**, 2023 **6 von 9**; **Update 2025: 7 von 9** (Ozeanversauerung jetzt im Gefahrenbereich).

**Earth Overshoot Day:** Der ökologische Fußabdruck übersteigt die Biokapazität der Erde. Seit **1973** verbraucht die Menschheit mehr, als in einem Jahr nachwächst; 2026 war der Tag am 30. Juli, für Deutschland schon am 10. Mai.

„Aktuell ist entweder der Umweltverbrauch zu hoch oder der Wohlstand zu niedrig“ – **nachhaltigen Wohlstand gibt es bisher nirgends**.

1. ungleicher **Zugang** zu Umweltressourcen
2. ungleiche **Betroffenheit** von ökologischen Risiken
3. ungleiches Ausmaß der **Verantwortung** für Verschmutzung und Emissionen

**Historische Verantwortung (Fanning/Hickel 2023):** Verteilt man das mit 1,5 °C vereinbare CO₂-Budget seit 1960 gleich auf alle Menschen, haben die **39 Länder des Globalen Nordens** ihren fairen Anteil im Schnitt **1986** aufgebraucht, die **129 Länder des Südens** erst **2048**. **91 % der Überschussemissionen** gehen auf den Norden zurück. Die am stärksten gefährdeten Länder haben am wenigsten beigetragen.

**Klimaungleichheit nach Einkommen (Chancel et al. 2023):** 1990 erklärten Unterschiede **zwischen** Ländern rund 62 % der Ungleichheit individueller Emissionen; 2019 beruhen **64 % auf Unterschieden innerhalb** von Ländern. Die **obersten 10 % verursachen 48 %** der Emissionen. Entscheidend ist bei Superreichen nicht nur Konsum, sondern der **CO₂-Gehalt ihrer Investitionen** (Verfügung über Produktion). Folgerung: Superreiche sollten stärker an den Kosten der Klimakrise beteiligt werden.

**Postwachstum** dagegen ist ein Wirtschaftssystem, das menschliche Bedürfnisse **nicht auf Grundlage von Wirtschaftswachstum** befriedigt und sich von einer rein **monetären Bewertung von Wohlstand** abwendet.

Diskurse der Green Economy (Gibbs/O’Neill), von oft bis selten in der Politik:
- **Pro-Wachstum/fast business as usual:** Grün als Investitionschance, Green Keynesianism, Green New Deal, green jobs
- **Selektives Wachstum/„greening“:** Ressourceneffizienz, Low-Carbon-Growth, Entkopplung, ökologische Modernisierung, Cleantech-Cluster
- **Grenzen des Wachstums/Transformation:** steady-state economy, Wohlstand ohne Wachstum, **Degrowth**, alternative Ernährungsnetzwerke

==Green Economy: grün wachsen. Postwachstum: gut leben, ohne wachsen zu müssen.==`,

Definition (degrowth.info): „Unter Degrowth oder Postwachstum verstehen wir eine Wirtschaftsweise und Gesellschaftsform, die das **Wohlergehen aller** zum Ziel hat und die **ökologischen Lebensgrundlagen** erhält.“ Dazu braucht es **radikale Umverteilung**, eine **Verkleinerung der materiellen Wirtschaft** und einen Wertewandel hin zu **Care, Solidarität und Autonomie** – ein gutes Leben für alle innerhalb planetarer Grenzen.

**Postwachstum ist nicht gleich negatives Wachstum** (nicht einfach Rezession).

**Prinzipien („Gutes Leben für Alle“):**
- weniger Produktion und Konsum im **Globalen Norden**; Befreiung vom westlichen Entwicklungsparadigma, selbstbestimmte Gestaltung im Süden
- Erhalt der natürlichen Lebensgrundlagen
- mehr **demokratische Entscheidungsformen**
- **Suffizienz statt Effizienz**

1. **Suffizienz:** „Genug statt mehr“ – weniger und anders konsumieren
2. **Subsistenz:** Bedürfnisse durch eigene Fähigkeiten und **Eigenarbeit** befriedigen, möglich durch **kürzere Erwerbsarbeitszeiten**
3. **Regionalökonomie:** kürzere Wertschöpfungsketten – anders produzieren
4. **Umbau der Industrie:** **reparierbare, langlebige** Produkte
5. **Institutionelle Maßnahmen:** Boden-, Geld- und Finanzmarktreformen, neue Unternehmensformen

**Arbeitszeitmodell:** Statt **40 Stunden** im monetären Bereich arbeiten Menschen **20 Stunden** monetär (regionale Ökonomie, Arbeitsteilung) und **20 Stunden** im entkommerzialisierten Bereich (Suffizienz, Subsistenz).

- steigende Energie- und Transportkosten, Dematerialisierung, Finanzwirtschaft

**Ausblick:** Das bisherige Wirtschaftssystem beruht auf „cheap oil“; eine **Dekarbonisierung** verändert Produktion, Konsum, Lieferketten und Raumstrukturen. Chancel et al.: Schon **1,5 % Vermögenssteuer auf Vermögen über 100 Mio. US-$** könnten die Klimaanpassung in Entwicklungsländern komplett finanzieren.

**Standortrelevanz** (sinngemäß): das Ausmaß, in dem die Wahl des Standorts – bzw. die Standortbedingungen dort – über Kosten und Erfolg eines Betriebs oder einer Branche entscheidet.
- **Hohe Standortrelevanz:** Die Tätigkeit ist an bestimmte Orte gebunden oder hängt stark von örtlichen Bedingungen ab. Beispiele: **Rohstoffabbau** (nur am Fundort möglich), transportkostenintensive **Schwerindustrie**, **Einzelhandel und Gastronomie** (Laufkundschaft, Erreichbarkeit).
- **Niedrige Standortrelevanz:** Die Tätigkeit kann nahezu überall ausgeübt werden („footloose“). Beispiele: **Softwareentwicklung**, digitale Dienstleistungen, Beratung per Internet.

Anschluss an die Folien: Transportkosten spielen heute in den meisten Branchen nur eine geringe Rolle (VL05-06, S. 61); harte und weiche Standortfaktoren (S. 64); Webers lokalisierte vs. ubiquitäre Materialien (S. 58).

**Terms of Trade (ToT)** = Austauschverhältnis im Außenhandel: **Index der Exportpreise ÷ Index der Importpreise** (× 100; Basisjahr = 100).
- **ToT unter 100 (bzw. unter 1):** Die Exportpreise sind im Verhältnis zu den Importpreisen gesunken. Das Land muss **mehr exportieren, um dieselbe Menge zu importieren** – seine Tauschposition hat sich **verschlechtert**.
- **ToT über 100:** Für dieselbe Exportmenge bekommt das Land mehr Importe – Verbesserung.

Bezug zur Dependenztheorie: Rohstoffexportierende Länder des Südens verlieren gegenüber Industriegüterexporteuren des Nordens, weil ihre Exportpreise relativ fallen (Prebisch-Singer-These) – daraus folgte die Forderung nach Importsubstituierender Industrialisierung.

Zusammenhang mit dem **race to the bottom:** Im Standortwettbewerb senken Länder soziale und ökologische Standards, und Unternehmen nutzen diese Unterschiede in globalen Produktionsnetzen aus. Das Lieferkettengesetz setzt **verbindliche Mindeststandards bei den Auftraggebern** – niedrige Standards bei Zulieferern sind dann kein reiner Kostenvorteil mehr. Es soll dem Unterbietungswettlauf also **entgegenwirken**. (Details wie Schwellenwerte und aktuelle Änderungen sind hier nicht Lernstoff.)

Die **Theorie der langen Wellen** (Kondratieff; Basisinnovationen tragen je einen rund 50-jährigen Aufschwung) wird kritisiert:
- **empirisch schwer nachweisbar:** nur wenige Zyklen, unregelmäßige Länge, Datierung der Wendepunkte umstritten
- **monokausal/technikdeterministisch:** Basisinnovationen allein erklären den Konjunkturverlauf; soziale, politische und institutionelle Faktoren fehlen
- **deterministisch:** Die Abfolge wirkt zwangsläufig, kaum Prognosekraft
- **Fokus auf Industrieländer** (Europa, Nordamerika)

Zusammen mit dem Produktlebenszyklus (starrer Produktbegriff, sehr linear, ohne sozialen und regulatorischen Kontext) teilen beide Ansätze die Schwäche, **Entwicklung als lineare, quasi-naturgesetzliche Abfolge** darzustellen.

- **Container-Raum:** Raum als „Behälter“ natürlicher und menschlicher Faktoren (absolutes Raumverständnis; Länderkunde)
- **Raum als System von Lagebeziehungen:** Standorte, Distanzen, Ströme (Raumwirtschaftslehre)

- **Raum als Konstrukt:** durch Handeln und Kommunikation sozial hergestellt (relationale WiGeo)

**Relationales Verständnis von Nähe und Distanz:** Nähe ist nicht nur geographisch-metrisch, sondern auch sozial, organisatorisch, kognitiv oder institutionell (Boschma, siehe Einheit Institutionen und Cluster).

Die **Polarization-Reversal-Hypothese** (Harry W. Richardson, 1980) beschreibt die räumliche Entwicklung in Ländern auf dem Weg der Industrialisierung:
1. **Polarisierung:** Zunächst konzentrieren sich Bevölkerung und Wirtschaft immer stärker im Zentrum (meist der Hauptstadtregion); die regionalen Unterschiede wachsen.
2. **Wendepunkt und Umkehr:** Ab einem bestimmten Entwicklungsstand kehrt sich der Trend um. **Agglomerationsnachteile** im Zentrum (hohe Kosten, Überlastung) und **Ausbreitungseffekte** führen zu **Dezentralisierung**: Es wachsen **Subzentren** und später auch periphere Regionen; die Disparitäten nehmen ab.

<script>
/* LERNI – Lernstand im Browser (localStorage): Antworten, Logbuch, Einstellungen, Sicherung.

   Der Lernstand hängt an den Frage-IDs („kurs:frage“), nicht an der App-Version. Neue App-Versionen
   übernehmen ihn deshalb automatisch. Ändert sich das Format, bekommt SCHEMA +1 und MIGRATIONEN
   einen Übergang – alte Stände nie verwerfen.

   Aufbau (Kurzform, damit auch Tausende Antworten klein bleiben):
   q[qid]   = { h: [[zeitSek, punkte0bis100, unsicher0/1], … letzte 30], n, r: richtig, f: falsch,
                box: Kasten 0–6, due: fällig am Tag (U.dayNum), t0: zuerst gesehen (Sek.), fav, notiz, a: letzte Antwort (offen) }
   log      = [[zeitSek, qid, punkte, unsicher, ms, modus], …]   (Logbuch, gekürzt ab LOG_MAX)
   tage[JJJJ-MM-TT] = [antworten, richtig, ms]
   sitzungen = [{ t, modus, titel, kurs, n, r, ms }]
   kurse[id] = { klausur: 'JJJJ-MM-TT' }        (eigener Klausurtermin, überschreibt den aus dem Inhalt) */
'use strict';

const SAVE_KEY = 'lerni.save';
const BACKUP_KEY = 'lerni.vorImport';
const SCHEMA = 1;
const LOG_MAX = 20000, H_MAX = 30;

/* Übergänge: MIGRATIONEN[n] macht aus Schema n das Schema n+1 */
const MIGRATIONEN = {
  // 1: (d) => { … },
};

const Store = {
  data: null,
  fehler: null,                                   // letzter Speicherfehler (für Einstellungen)

  defaults() {
    return {
      schema: SCHEMA, erstellt: Date.now(), geaendert: 0,
      set: { ziel: 20, neuProTag: 10, laenge: 15, offen: 'schreiben', theme: 'auto', kurs: null, tipps: true },
      kurse: {}, q: {}, log: [], tage: {}, sitzungen: [],
      sich: { zuletzt: 0, seit: 0 },
    };
  },

  load() {
    let d = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    this.data = this.pruefeUndErgaenze(d);
    return this.data;
  },
  /* Alten oder fremden Stand ins aktuelle Format bringen, fehlende Felder ergänzen */
  pruefeUndErgaenze(d) {
    const def = this.defaults();
    if (!d || typeof d !== 'object') return def;
    d.schema = d.schema || 1;
    while (d.schema < SCHEMA) { const m = MIGRATIONEN[d.schema]; if (m) m(d); d.schema++; }
    for (const k in def) if (d[k] == null || typeof d[k] !== typeof def[k] || Array.isArray(d[k]) !== Array.isArray(def[k])) d[k] = def[k];
    for (const k in def.set) if (d.set[k] == null) d.set[k] = def.set[k];
    for (const k in def.sich) if (d.sich[k] == null) d.sich[k] = def.sich[k];
    return d;
  },

  save() {
    const d = this.data; d.geaendert = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); this.fehler = null; return true; } catch (e) {
      // Speicher voll: Logbuch kürzen (Zusammenfassung je Frage bleibt) und erneut versuchen
      if (d.log.length > 2000) { d.log = d.log.slice(-Math.floor(d.log.length / 2)); try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); this.fehler = null; return true; } catch (e2) { /* unten */ } }
      this.fehler = String(e && e.message || e); return false;
    }
  },

  rec(qid) { return this.data.q[qid]; },
  recOderNeu(qid) { return this.data.q[qid] || (this.data.q[qid] = { h: [], n: 0, r: 0, f: 0, box: 0, due: 0, t0: 0 }); },

  /* Eine Antwort festhalten. s = 0…1, unsicher = bool, ms = Bearbeitungszeit, modus = Kürzel der Sitzung */
  antwort(f, s, unsicher, ms, modus, antwortText) {
    const d = this.data, now = Math.floor(Date.now() / 1000), p = Math.round(U.clamp(s, 0, 1) * 100), u = unsicher ? 1 : 0;
    const r = this.recOderNeu(f.qid);
    r.h.push([now, p, u]); if (r.h.length > H_MAX) r.h.splice(0, r.h.length - H_MAX);
    r.n++; if (s >= RICHTIG) r.r++; else if (s < TEILWEISE) r.f++;
    if (!r.t0) r.t0 = now;
    if (antwortText != null && String(antwortText).trim()) r.a = String(antwortText).slice(0, 4000);
    Lernlogik.planen(r, s, unsicher, Lernlogik.kappe(f.kurs));
    d.log.push([now, f.qid, p, u, Math.round(ms || 0), modus || 'l']);
    if (d.log.length > LOG_MAX) d.log.splice(0, d.log.length - Math.floor(LOG_MAX * 0.75));
    const key = U.dayKey(), t = d.tage[key] || (d.tage[key] = [0, 0, 0]);
    t[0]++; if (s >= RICHTIG) t[1]++; t[2] += Math.round(ms || 0);
    d.sich.seit++;
    this.save();
    return r;
  },
  sitzungEnde(info) {
    const d = this.data; d.sitzungen.push(info);
    if (d.sitzungen.length > 400) d.sitzungen.splice(0, d.sitzungen.length - 300);
    this.save();
  },

  klausurTermin(kursId) {
    const eigen = (this.data.kurse[kursId] || {}).klausur, k = Lerni.kursById[kursId];
    return eigen != null ? eigen : (k && k.klausur) || '';
  },
  setKlausur(kursId, key) { (this.data.kurse[kursId] || (this.data.kurse[kursId] = {})).klausur = key || ''; this.save(); },

  /* ---------- Sicherung ---------- */
  exportText() { return JSON.stringify({ app: 'lerni', schema: SCHEMA, exportiert: new Date().toISOString(), daten: this.data }); },
  exportName() { return 'lerni-sicherung-' + U.dayKey() + '.json'; },
  merkeExport() { this.data.sich = { zuletzt: Date.now(), seit: 0 }; this.save(); },
  /* Sicherung einlesen. Wirft einen Fehler mit lesbarer Meldung. Der alte Stand bleibt als BACKUP_KEY erhalten. */
  importText(text) {
    let o; try { o = JSON.parse(text); } catch (e) { throw new Error('Die Datei ist keine Lerni-Sicherung (kein gültiges JSON).'); }
    const d = o && o.app === 'lerni' ? o.daten : (o && o.q && o.set ? o : null);
    if (!d || typeof d !== 'object' || typeof d.q !== 'object') throw new Error('Die Datei ist keine Lerni-Sicherung.');
    if (Math.max(d.schema || 1, o.schema || 1) > SCHEMA) throw new Error('Die Sicherung stammt aus einer neueren App-Version. Erst die App aktualisieren.');
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(this.data)); } catch (e) { /* kein Platz für die Kopie – trotzdem weiter */ }
    this.data = this.pruefeUndErgaenze(d);
    this.data.sich = { zuletzt: Date.now(), seit: 0 };
    this.save();
    return { fragen: Object.keys(this.data.q).length, antworten: this.data.log.length };
  },
  hatVorImport() { try { return !!localStorage.getItem(BACKUP_KEY); } catch (e) { return false; } },
  vorImportZurueck() {
    const raw = localStorage.getItem(BACKUP_KEY); if (!raw) return false;
    this.data = this.pruefeUndErgaenze(JSON.parse(raw)); localStorage.removeItem(BACKUP_KEY); this.save(); return true;
  },
  zuruecksetzen() {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(this.data)); } catch (e) { /* egal */ }
    const set = this.data.set; this.data = this.defaults(); this.data.set = set; this.save();
  },
  groesse() { try { return (localStorage.getItem(SAVE_KEY) || '').length * 2; } catch (e) { return 0; } },
  /* Browser bitten, den Speicher nicht bei Platzmangel zu räumen */
  async dauerhaft() {
    try { if (navigator.storage && navigator.storage.persist) return (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) { /* nicht unterstützt */ }
    return null;
  },
};
