<script>
/* LERNI – Lernlogik: Wiederholungsplan, Kennzahlen je Frage, Listen („kritischste 10“ usw.), Sitzungsplan.

   Wiederholungsplan: Karteikasten mit 7 Fächern. Richtig und sicher → ein Fach weiter, richtig aber
   unsicher → Fach bleibt, teilweise → ein Fach zurück, falsch → Fach 0 (heute nochmal).
   Abstände KASTEN_TAGE; vor der Klausur höchstens die halbe Restzeit, damit alles vorher noch einmal drankommt.

   Bewertung einer Antwort: s = 0…1. Ab RICHTIG gilt sie als gewusst, unter TEILWEISE als falsch. */
'use strict';

const KASTEN_TAGE = [0, 1, 2, 4, 8, 16, 32];
const RICHTIG = 0.8, TEILWEISE = 0.4;

const LISTEN = [
  { id: 'faellig', name: 'Heute fällig', desc: 'Nach Plan zur Wiederholung dran' },
  { id: 'kritisch', name: 'Die 10 kritischsten', desc: 'Oft falsch, wackelig oder unsicher – nach Dringlichkeit' },
  { id: 'falsch', name: 'Zuletzt falsch', desc: 'Beim letzten Mal nicht oder nur teilweise gewusst' },
  { id: 'wackelig', name: 'Wackelkandidaten', desc: 'Mal richtig, mal falsch – oder oft unsicher' },
  { id: 'oftfalsch', name: 'Oft falsch', desc: 'Mindestens zweimal falsch, Fehlerquote über 40 %' },
  { id: 'glueck', name: 'Glückstreffer', desc: 'Zuletzt richtig, aber unsicher markiert' },
  { id: 'neu', name: 'Neue Fragen', desc: 'Noch nie beantwortet – in Lernpfad-Reihenfolge' },
  { id: 'gemerkt', name: 'Gemerkt', desc: 'Mit Stern markiert' },
  { id: 'sitzt', name: 'Sitzt', desc: 'Mehrfach sicher gewusst' },
];
const LISTE_BY_ID = Object.fromEntries(LISTEN.map((l) => [l.id, l]));

const STATUS = {
  neu: { name: 'Neu', farbe: 'var(--st-neu)' },
  falsch: { name: 'Falsch', farbe: 'var(--bad)' },
  wackelig: { name: 'Wackelig', farbe: 'var(--mid)' },
  lernend: { name: 'Lernend', farbe: 'var(--pri)' },
  sitzt: { name: 'Sitzt', farbe: 'var(--ok)' },
};

const Lernlogik = {
  ergebnis: (s) => s >= RICHTIG ? 'richtig' : s >= TEILWEISE ? 'teilweise' : 'falsch',

  /* Größter Abstand bis zur nächsten Wiederholung: halbe Restzeit bis zur Klausur (mind. 1 Tag) */
  kappe(kursId) {
    const k = U.keyToNum(Store.klausurTermin(kursId)); if (k == null) return null;
    const rest = k - U.dayNum(); return rest > 0 ? Math.max(1, Math.floor(rest / 2)) : null;
  },
  planen(r, s, unsicher, kappe) {
    let box = r.box || 0;
    if (s >= RICHTIG) box = unsicher ? Math.max(1, box) : box + 1;
    else if (s >= TEILWEISE) box = Math.max(1, box - 1);
    else box = 0;
    r.box = Math.min(box, KASTEN_TAGE.length - 1);
    let tage = KASTEN_TAGE[r.box]; if (kappe != null) tage = Math.min(tage, kappe);
    r.due = U.dayNum() + tage;
  },

  /* Kennzahlen einer Frage. crit = Dringlichkeit 0…~1,5 (für „kritischste“) */
  info(f) {
    const r = Store.rec(f.qid);
    if (!r || !r.n) return { neu: true, n: 0, status: 'neu', crit: 0, fav: !!(r && r.fav) };
    const h = r.h, last = h[h.length - 1], s = last[1] / 100, heute = U.dayNum();
    const recent = h.slice(-8);
    let w = 0, e = 0;
    recent.forEach((x, i) => { const wi = Math.pow(0.7, recent.length - 1 - i); w += wi; e += wi * (1 - x[1] / 100); });
    const err = e / w;
    const six = h.slice(-6);
    let wechsel = 0; for (let i = 1; i < six.length; i++) if ((six[i][1] >= 80) !== (six[i - 1][1] >= 80)) wechsel++;
    const flip = six.length > 1 ? wechsel / (six.length - 1) : 0;
    const unsure = six.filter((x) => x[2]).length / six.length;
    const ueber = Math.max(0, heute - r.due);
    const crit = (0.45 * err + 0.2 * flip + 0.15 * unsure + 0.1 * (s < RICHTIG ? 1 : 0) + 0.1 * Math.min(1, ueber / 7)) * (1 + 0.25 * (f.wichtig - 1));
    const wackelig = (six.length >= 3 && flip >= 0.4) || (r.n >= 2 && unsure >= 0.5);
    let status;
    if (s < TEILWEISE) status = 'falsch';
    else if (wackelig) status = 'wackelig';
    else if (r.box >= 3 && s >= RICHTIG && !last[2] && err < 0.25) status = 'sitzt';
    else status = 'lernend';
    return {
      neu: false, n: r.n, s, err, flip, unsure, crit, wackelig, status, box: r.box, due: r.due, faellig: r.due <= heute,
      lastUnsure: !!last[2], lastT: last[0], fav: !!r.fav, falschN: r.f, richtigN: r.r, quote: r.r / r.n,
    };
  },

  /* Fragen eines Kurses (optional nur eine Einheit) */
  fragenVon(kursId, einheitId) {
    const k = Lerni.kursById[kursId]; if (!k) return [];
    return einheitId ? k.alleFragen.filter((f) => f.einheit === einheitId) : k.alleFragen;
  },
  liste(id, fragen) {
    const mit = fragen.map((f) => ({ f, i: this.info(f) }));
    const nachCrit = (a, b) => b.i.crit - a.i.crit;
    let sel;
    switch (id) {
      case 'faellig': sel = mit.filter((x) => !x.i.neu && x.i.faellig).sort(nachCrit); break;
      case 'kritisch': sel = mit.filter((x) => !x.i.neu && x.i.crit > 0.08).sort(nachCrit).slice(0, 10); break;
      case 'falsch': sel = mit.filter((x) => !x.i.neu && x.i.s < RICHTIG).sort((a, b) => b.i.lastT - a.i.lastT); break;
      case 'wackelig': sel = mit.filter((x) => !x.i.neu && x.i.wackelig).sort(nachCrit); break;
      case 'oftfalsch': sel = mit.filter((x) => !x.i.neu && x.i.falschN >= 2 && x.i.falschN / x.i.n >= 0.4).sort(nachCrit); break;
      case 'glueck': sel = mit.filter((x) => !x.i.neu && x.i.s >= RICHTIG && x.i.lastUnsure).sort(nachCrit); break;
      case 'neu': return this.lernpfad(fragen.filter((f) => this.info(f).neu));
      case 'gemerkt': sel = mit.filter((x) => x.i.fav); break;
      case 'sitzt': sel = mit.filter((x) => x.i.status === 'sitzt'); break;
      default: sel = mit;
    }
    return sel.map((x) => x.f);
  },
  zaehlen(fragen) {
    const c = { alle: fragen.length };
    const st = { neu: 0, falsch: 0, wackelig: 0, lernend: 0, sitzt: 0 };
    for (const l of LISTEN) c[l.id] = this.liste(l.id, fragen).length;
    for (const f of fragen) st[this.info(f).status]++;
    c.status = st; return c;
  },

  /* Neue Fragen in Lernpfad-Reihenfolge: erst Erkennen, dann Erinnern, dann Erklären je Thema.
     Offene Fragen (Stufe 3) eines Themas erst, wenn mind. die Hälfte der leichteren Fragen dazu gesehen ist. */
  lernpfad(neue) {
    const gesehen = {}, gesamt = {};
    for (const f of neue.length ? Lerni.kursById[neue[0].kurs].alleFragen : []) {
      if (f.stufe >= 3) continue;
      const key = f.einheit + '|' + f.thema; gesamt[key] = (gesamt[key] || 0) + 1;
      if (!this.info(f).neu) gesehen[key] = (gesehen[key] || 0) + 1;
    }
    const bereit = (f) => { if (f.stufe < 3) return true; const key = f.einheit + '|' + f.thema; return !gesamt[key] || (gesehen[key] || 0) / gesamt[key] >= 0.5; };
    const gruppe = (f) => Math.floor(f.ord / 1000);                   // Einheit + Thema
    const sortiert = neue.slice().sort((a, b) => gruppe(a) - gruppe(b) || a.stufe - b.stufe || a.ord - b.ord);
    return sortiert.filter(bereit).concat(sortiert.filter((f) => !bereit(f)));
  },
  neuHeute(kursId) {
    const start = Math.floor(new Date().setHours(0, 0, 0, 0) / 1000);
    return this.fragenVon(kursId).filter((f) => { const r = Store.rec(f.qid); return r && r.t0 >= start; }).length;
  },

  /* Sitzung zusammenstellen.
     modus: 'heute' (fällige + neue), 'liste' (opt.liste), 'einheit' (opt.einheit), 'offen', 'mix', 'thema' (opt.einheit, opt.thema), 'fragen' (opt.qids) */
  plan(kursId, modus, opt = {}) {
    const L = opt.laenge || Store.data.set.laenge;
    const alle = this.fragenVon(kursId, opt.einheit);
    let out;
    switch (modus) {
      case 'heute': {
        const due = this.liste('faellig', alle);
        const frei = Math.max(0, Store.data.set.neuProTag - this.neuHeute(kursId));
        const neu = this.liste('neu', alle).slice(0, frei);
        const nDue = Math.min(due.length, Math.max(L - neu.length, Math.ceil(L * 0.7)));
        out = this.verzahnen(due.slice(0, nDue), neu.slice(0, L - nDue));
        break;
      }
      case 'einheit': {
        const due = this.liste('faellig', alle), neu = this.liste('neu', alle);
        const rest = alle.filter((f) => due.indexOf(f) < 0 && neu.indexOf(f) < 0).sort((a, b) => this.info(b).crit - this.info(a).crit);
        const nDue = Math.min(due.length, Math.ceil(L * 0.6));
        out = this.verzahnen(due.slice(0, nDue), neu.slice(0, L - nDue));
        if (out.length < L) out = out.concat(rest.slice(0, L - out.length));
        break;
      }
      case 'thema': out = this.lernpfad(alle.filter((f) => f.thema === opt.thema)); break;
      case 'liste': {
        const l = this.liste(opt.liste, alle);
        out = opt.liste === 'neu' || opt.liste === 'kritisch' ? l.slice(0, L) : U.shuffle(l).slice(0, L);
        break;
      }
      case 'offen': {
        const off = alle.filter((f) => f.typ === 'offen');
        const gesehen = off.filter((f) => !this.info(f).neu).sort((a, b) => this.info(b).crit - this.info(a).crit);
        const neu = off.filter((f) => this.info(f).neu);
        out = this.verzahnen(gesehen.slice(0, Math.ceil(L / 2)), neu).slice(0, L);
        if (out.length < L) out = out.concat(gesehen.slice(Math.ceil(L / 2))).slice(0, L);
        break;
      }
      case 'mix': out = U.shuffle(alle).slice(0, L); break;
      case 'fragen': out = (opt.qids || []).map((q) => Lerni.fragen[q]).filter(Boolean); break;
      default: out = [];
    }
    return modus === 'thema' || modus === 'fragen' ? out : this.mischen(out);
  },
  /* Neue Fragen gleichmäßig zwischen die Wiederholungen streuen */
  verzahnen(alt, neu) {
    if (!alt.length) return neu.slice(); if (!neu.length) return alt.slice();
    const out = [], step = (alt.length + neu.length) / neu.length;
    let ai = 0, ni = 0;
    for (let i = 0; i < alt.length + neu.length; i++) {
      if (ni < neu.length && (i + 1) >= (ni + 1) * step - step / 2) out.push(neu[ni++]); else if (ai < alt.length) out.push(alt[ai++]); else out.push(neu[ni++]);
    }
    return out;
  },
  /* Nicht zweimal hintereinander dasselbe Thema (Verschachteln hilft beim Behalten) */
  mischen(list) {
    const rest = list.slice(), out = [];
    while (rest.length) {
      const prev = out[out.length - 1];
      let i = prev ? rest.findIndex((f) => f.thema !== prev.thema || f.einheit !== prev.einheit) : 0;
      if (i < 0) i = 0;
      out.push(rest.splice(i, 1)[0]);
    }
    return out;
  },

  /* ---------- Tages- und Gesamtwerte ---------- */
  heute() { const t = Store.data.tage[U.dayKey()] || [0, 0, 0]; return { n: t[0], r: t[1], ms: t[2] }; },
  serie() {
    const T = Store.data.tage; let n = 0, d = U.dayNum();
    if (!T[U.numToKey(d)]) d--;                   // heute noch nicht gelernt: Serie bis gestern zählt
    while (T[U.numToKey(d)] && T[U.numToKey(d)][0] > 0) { n++; d--; }
    return n;
  },
  tageBisKlausur(kursId) { const k = U.keyToNum(Store.klausurTermin(kursId)); return k == null ? null : k - U.dayNum(); },
  /* Trefferquote je Fragetyp und Zeitraum aus dem Logbuch */
  quoten(kursId, seitTagen) {
    const ab = seitTagen ? Date.now() / 1000 - seitTagen * 86400 : 0, proTyp = {}, ges = { n: 0, r: 0 };
    for (const [t, qid, p] of Store.data.log) {
      if (t < ab) continue; const f = Lerni.fragen[qid]; if (!f || (kursId && f.kurs !== kursId)) continue;
      const x = proTyp[f.typ] || (proTyp[f.typ] = { n: 0, r: 0 }); x.n++; ges.n++;
      if (p >= RICHTIG * 100) { x.r++; ges.r++; }
    }
    return { proTyp, ges };
  },
};

</script>
<script>
/* LERNI – Fragetypen: Bewertung (rein, testbar) und Anzeige.

   Jeder Typ in TYP_UI liefert render(f, ctx) → {
     el,                       Eingabebereich
     bereit(): bool,           darf „Prüfen“ gedrückt werden?
     pruefen(): { s, … },      bewerten und Rückmeldung im Eingabebereich zeigen
     selbst: true              (karte, offen) Bewertung durch den Lernenden, ctx.fertig(s, unsicher) meldet sie
   }
   ctx: { rnd, aenderung() (Knopf-Zustand neu prüfen), fertig(s, unsicher, text), kurs } */
'use strict';

const Bewerter = {
  luecke(f, eingaben, doch = []) {
    const L = Lerni.luecken(f.text).luecken;
    const einzel = L.map((l, i) => !!doch[i] || U.passt(eingaben[i], l.a));
    return { s: einzel.filter(Boolean).length / L.length, einzel };
  },
  /* gewaehlt: Indizes in f.optionen. Mehrfachauswahl: (richtige Treffer − falsche) / Anzahl richtige */
  mc(f, gewaehlt) {
    const richtig = f.optionen.map((o, i) => o.r ? i : -1).filter((i) => i >= 0);
    if (richtig.length === 1) return { s: gewaehlt.length === 1 && gewaehlt[0] === richtig[0] ? 1 : 0 };
    const treffer = gewaehlt.filter((i) => f.optionen[i].r).length, falsch = gewaehlt.length - treffer;
    return { s: U.clamp((treffer - falsch) / richtig.length, 0, 1) };
  },
  wf: (f, antwort) => ({ s: antwort === f.wahr ? 1 : 0 }),
  /* reihenfolge: Indizes in f.schritte in der gewählten Reihenfolge. Anteil der Schritte am richtigen Platz */
  reihe(f, reihenfolge) {
    const platz = reihenfolge.map((idx, pos) => idx === pos);
    return { s: platz.filter(Boolean).length / f.schritte.length, platz };
  },
  /* zuordnung[i] = Index des rechten Partners für links i */
  paare(f, zuordnung) {
    const ok = f.paare.map((p, i) => zuordnung[i] === i);
    return { s: ok.filter(Boolean).length / f.paare.length, ok };
  },
  zahl(f, text) {
    const v = U.zahl(text);
    return { s: isFinite(v) && Math.abs(v - f.loesung) <= Lerni.toleranz(f) ? 1 : 0, wert: v };
  },
  offen: (f, abgehakt) => ({ s: f.kernpunkte.length ? abgehakt / f.kernpunkte.length : 0 }),
};

/* Eigene Skizze(n) als HTML: bild ist ein Name oder eine Liste von Namen aus Lerni.grafik(kurs, name, …) */
function grafikHtml(kursId, bild) {
  return Lerni.bilder(bild).map((b) => {
    const g = Lerni.grafikVon(kursId, b); if (!g) return '';
    return '<figure class="grafik" data-grafik="' + U.esc(b) + '"><div class="gsvg">' + g.svg + '</div>' +
      (g.titel || g.text ? '<figcaption>' + (g.titel ? '<b>' + U.inline(U.esc(g.titel)) + '</b>' : '') + (g.text ? ' ' + U.inline(U.esc(g.text)) : '') + '</figcaption>' : '') + '</figure>';
  }).join('');
}

/* Lösung als HTML (für Rückmeldung, Frage-Details, Klausur-Auswertung) */
function loesungHtml(f) {
  return loesungOhneBild(f) + grafikHtml(f.kurs, f.bildLoesung);
}
function loesungOhneBild(f) {
  const E = (t) => t ? '<div class="erkl">' + U.md(t) + '</div>' : '';
  switch (f.typ) {
    case 'offen': return '<div class="muster">' + U.md(f.antwort) + '</div><div class="kp-t">Kernpunkte</div><ul class="kp-l">' + f.kernpunkte.map((k) => '<li>' + U.inline(U.esc(k)) + '</li>').join('') + '</ul>' + E(f.erklaerung);
    case 'karte': return U.md(f.hinten) + E(f.erklaerung);
    case 'luecke': {
      const { teile } = Lerni.luecken(f.text);

    }
    case 'mc': return '<ul class="kp-l">' + f.optionen.filter((o) => o.r).map((o) => '<li>' + U.inline(U.esc(o.t)) + (o.warum ? ' <span class="muted">– ' + U.inline(U.esc(o.warum)) + '</span>' : '') + '</li>').join('') + '</ul>' + E(f.erklaerung);
    case 'wf': return '<p><b>' + (f.wahr ? 'Wahr' : 'Falsch') + '.</b> ' + U.inline(U.esc(f.warum || '')) + '</p>' + E(f.erklaerung);
    case 'reihe': return '<ol class="kp-l">' + f.schritte.map((s) => '<li>' + U.inline(U.esc(s)) + '</li>').join('') + '</ol>' + E(f.erklaerung);
    case 'paare': return '<ul class="kp-l">' + f.paare.map((p) => '<li>' + U.inline(U.esc(p[0])) + ' → <b>' + U.inline(U.esc(p[1])) + '</b></li>').join('') + '</ul>' + E(f.erklaerung);
    case 'zahl': return '<p><b>' + U.fmtNum(f.loesung) + (f.einheit ? ' ' + U.esc(f.einheit) : '') + '</b></p>' + (f.rechenweg ? '<div class="erkl">' + U.md(f.rechenweg) + '</div>' : '') + E(f.erklaerung);
  }
  return '';
}
/* Fragetext (ohne Antwortbereich), mit Skizze, falls die Frage eine hat (bild) */
function frageHtml(f) {

    case 'karte': t = U.md(f.vorne); break;
    case 'wf': t = U.md(f.aussage); break;

/* Text für „Mit Claude prüfen“ */

}

      return { el: box, selbst: true, bereit: () => false, fokus: () => { if (schreiben && !('ontouchstart' in window)) ta.focus(); }, text: () => ta.value };

<script>
/* LERNI – Lernsitzung: Reihenfolge, Wiedervorlage falscher Fragen, Ergebnis. Ohne DOM (testbar). */
'use strict';

const MODUS_KURZ = { heute: 'l', liste: 'w', einheit: 'e', thema: 't', offen: 'o', mix: 'm', fragen: 'w', klausur: 'k' };

class Sitzung {
  /* fragen: Liste von Fragen; info: { modus, titel, kurs } */
  constructor(fragen, info) {
    this.queue = fragen.slice(); this.i = 0; this.info = info;
    this.ergebnisse = [];                          // { f, s, u, wdh }
    this.nochmal = new Set(); this.t0 = Date.now(); this.tFrage = Date.now();
    this.beendet = false;
  }
  get aktuell() { return this.queue[this.i]; }
  get anzahl() { return this.queue.length; }
  get erste() { return this.ergebnisse.filter((e) => !e.wdh); }
  start() { this.tFrage = Date.now(); }

  /* Antwort festhalten. Falsche (und teilweise) Fragen kommen einmal wieder – ein paar Fragen später. */
  erfassen(s, unsicher, text) {
    const f = this.aktuell, ms = Math.min(Date.now() - this.tFrage, 15 * 60000);
    const wdh = this.ergebnisse.some((e) => e.f === f);
    Store.antwort(f, s, unsicher, ms, MODUS_KURZ[this.info.modus] || 'l', text);
    this.ergebnisse.push({ f, s, u: !!unsicher, wdh });
    if (s < RICHTIG && !this.nochmal.has(f.qid)) {
      this.nochmal.add(f.qid);
      this.queue.splice(Math.min(this.i + 4, this.queue.length), 0, f);
    }
  }
  weiter() { this.i++; this.tFrage = Date.now(); return this.i < this.queue.length; }
  abschliessen() {
    if (this.beendet) return; this.beendet = true;
    const e = this.erste;
    if (!e.length) return;
    Store.sitzungEnde({ t: Math.floor(this.t0 / 1000), modus: this.info.modus, titel: this.info.titel, kurs: this.info.kurs, n: e.length, r: e.filter((x) => x.s >= RICHTIG).length, ms: Date.now() - this.t0 });
  }
  zusammenfassung() {
    const e = this.erste, z = { n: e.length, richtig: 0, teilweise: 0, falsch: 0, unsicher: 0, punkte: 0, ms: Date.now() - this.t0 };
    for (const x of e) { z[Lernlogik.ergebnis(x.s)]++; if (x.u) z.unsicher++; z.punkte += x.s; }
    z.quote = e.length ? z.punkte / e.length : 0;
    z.nochmalFalsch = e.filter((x) => x.s < RICHTIG).map((x) => x.f.qid);
    return z;
  }
}
//# sourceURL=js/sitzung.js
</script>

/* LERNI – Oberfläche: Seitenwechsel mit Zurück-Stapel, Reiterleiste, Hinweise, Dialoge, kleine Bausteine.
   Die Seiten selbst stehen in screens.js, lernen.js und klausur.js (als Mixins in App). */
'use strict';

const ICON = {

const App = {
  stapel: [],                                     // [{ fn, args, scroll }]
  reiter: 'lernen',

  init() {
    document.body.innerHTML = '';
    this.view = el('main', { id: 'view' });
    this.tabs = el('nav', { id: 'tabs', 'aria-label': 'Bereiche' }, [
      ['lernen', 'Lernen'], ['logbuch', 'Logbuch'], ['einst', 'Einstellungen'],
    ].map(([id, t]) => el('button', { 'data-tab': id, html: ICON[id] + '<span>' + t + '</span>', onclick: () => this.tab(id) })));
    this.toastEl = el('div', { id: 'toast', role: 'status', 'aria-live': 'polite' });
    this.bannerEl = el('div', { id: 'banner', class: 'hidden' });
    document.body.append(this.bannerEl, this.view, this.tabs, this.toastEl);
    this.theme();
    // Skizzen antippen → groß ansehen (Querformat, Zwei-Finger-Zoom)
    this.view.addEventListener('click', (e) => { const g = e.target.closest && e.target.closest('figure.grafik'); if (g) this.lupe(g); });
  },
  lupe(fig) {
    const zu = () => { d.remove(); document.removeEventListener('keydown', esc); };
    const esc = (e) => { if (e.key === 'Escape') zu(); };
    const d = el('div', { class: 'glupe', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Grafik groß', onclick: (e) => { if (!e.target.closest('.ib')) zu(); } }, [
      el('button', { class: 'ib', 'aria-label': 'Schließen', html: ICON.zu, onclick: zu }),
      fig.cloneNode(true),
      el('div', { class: 'ghint', text: 'Tipp: iPhone quer halten oder mit zwei Fingern zoomen. Antippen schließt.' }),
    ]);
    document.addEventListener('keydown', esc);
    document.body.appendChild(d);
  },
  theme() {
    const t = Store.data.set.theme, root = document.documentElement;
    if (t === 'hell') root.dataset.theme = 'light'; else if (t === 'dunkel') root.dataset.theme = 'dark'; else delete root.dataset.theme;
    const dunkel = t === 'dunkel' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dunkel ? '#10131f' : '#f5f6fa');
  },

  /* ---------- Navigation ---------- */
  kurs() { const s = Store.data.set, K = Lerni.sichtbareKurse(); let k = Lerni.kursById[s.kurs]; if (!k || k.versteckt) k = K[0] || Lerni.kurse[0]; return k; },
  tab(id) {
    this.reiter = id; this.stapel = [];
    this.oeffne({ lernen: this.home, logbuch: this.logbuch, einst: this.einstellungen }[id]);
  },
  oeffne(fn, ...args) {
    const cur = this.stapel[this.stapel.length - 1]; if (cur) cur.scroll = this.view.scrollTop;
    this.stapel.push({ fn, args }); this.zeichne(0);
  },
  /* Aktuelle Seite ersetzen (z. B. Sitzung → Ergebnis), ohne Zurück-Eintrag */
  ersetze(fn, ...args) { this.stapel.pop(); this.stapel.push({ fn, args }); this.zeichne(0); },
  zurueck() { if (this.stapel.length > 1) this.stapel.pop(); const cur = this.stapel[this.stapel.length - 1]; this.zeichne(cur.scroll || 0); },
  neu() { const cur = this.stapel[this.stapel.length - 1]; if (cur) this.zeichne(this.view.scrollTop); },
  zeichne(scroll) {
    const cur = this.stapel[this.stapel.length - 1]; if (!cur) return;
    this._aufraeumen && this._aufraeumen(); this._aufraeumen = null;
    const s = cur.fn.apply(this, cur.args);
    this.view.innerHTML = ''; this.view.appendChild(s);
    document.body.classList.toggle('ohne-tabs', !!s.dataset.ohneTabs);
    this.tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.tab === this.reiter));
    this.view.scrollTop = scroll || 0;
  },

  /* Seitengerüst: Kopf (Zurück, Titel, Aktionen) + Inhalt */
  seite({ titel, ueber, zurueck, schliessen, aktionen, inhalt, ohneTabs, klasse }) {
    const kopf = el('header', { class: 'kopf' }, [
      zurueck ? el('button', { class: 'ib', 'aria-label': 'Zurück', html: ICON.zurueck, onclick: () => (typeof zurueck === 'function' ? zurueck() : this.zurueck()) }) : null,
      schliessen ? el('button', { class: 'ib', 'aria-label': 'Schließen', html: ICON.zu, onclick: schliessen }) : null,
      el('div', { class: 'kt' }, [ueber ? el('div', { class: 'ueber', text: ueber }) : null, el('h1', { text: titel || '' })]),
      el('div', { class: 'ka' }, aktionen || []),
    ]);
    const s = el('section', { class: 'seite ' + (klasse || '') }, [kopf, el('div', { class: 'inhalt' }, inhalt)]);
    if (ohneTabs) s.dataset.ohneTabs = '1';

  },

  /* ---------- Rückmeldungen ---------- */
  toast(t, ms = 2400) {
    const e = this.toastEl; e.textContent = t; e.classList.add('show');
    clearTimeout(this._tt); this._tt = setTimeout(() => e.classList.remove('show'), ms);

  banner(text, knopf, aktion) {

  },
  /* Dialog mit Knöpfen → Promise mit dem Wert des gedrückten Knopfs (Abbrechen = null) */
  dialog({ titel, text, knoepfe }) {
    return new Promise((ok) => {
      const zu = (v) => { d.remove(); ok(v); };
      const d = el('div', { class: 'dlg', onclick: (e) => { if (e.target === d) zu(null); } }, [el('div', { class: 'dlgbox', role: 'dialog', 'aria-modal': 'true' }, [
        titel ? el('h2', { text: titel }) : null, text ? el('p', { html: text }) : null,
        el('div', { class: 'dlgk' }, (knoepfe || [{ text: 'OK', wert: true, klasse: 'primary' }]).map((k) => el('button', { class: 'btn ' + (k.klasse || ''), text: k.text, onclick: () => zu(k.wert) }))),
      ])]);
      document.body.appendChild(d);
    });
  },
  bestaetigen(titel, text, ja = 'Ja', gefahr) {
    return this.dialog({ titel, text, knoepfe: [{ text: 'Abbrechen', wert: false }, { text: ja, wert: true, klasse: gefahr ? 'danger' : 'primary' }] });
  },

  /* ---------- Bausteine ---------- */
  ring(anteil, gross, klein, farbe) {
    const r = 34, u = 2 * Math.PI * r, a = U.clamp(anteil, 0, 1);
    return el('div', { class: 'ring', html:
      `<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="${r}" class="rg"/>` + (a > 0 ? `<circle cx="40" cy="40" r="${r}" class="rv" style="stroke:${farbe || 'var(--pri)'}" stroke-dasharray="${(a * u).toFixed(1)} ${u.toFixed(1)}" transform="rotate(-90 40 40)"/>` : '') + '</svg>' +
      `<div class="rt"><b>${U.esc(gross)}</b>${klein ? '<small>' + U.esc(klein) + '</small>' : ''}</div>` });
  },
  statusBalken(st, gesamt) {
    const teile = ['sitzt', 'lernend', 'wackelig', 'falsch', 'neu'].filter((k) => st[k]);
    return el('div', { class: 'sbar', role: 'img', 'aria-label': teile.map((k) => st[k] + ' ' + STATUS[k].name).join(', ') },
      teile.map((k) => el('i', { style: `width:${(st[k] / gesamt * 100).toFixed(2)}%;background:${STATUS[k].farbe}` })));
  },
  legende() {
    return el('div', { class: 'legende' }, ['sitzt', 'lernend', 'wackelig', 'falsch', 'neu'].map((k) => el('span', {}, [el('i', { style: 'background:' + STATUS[k].farbe }), STATUS[k].name])));
  },
  /* Verlauf einer Frage als Punkte: grün richtig, gelb teilweise, rot falsch; Ring = unsicher */
  punkte(h, n = 8) {
    return el('span', { class: 'dots' }, (h || []).slice(-n).map((x) => el('i', { class: Lernlogik.ergebnis(x[1] / 100) + (x[2] ? ' u' : ''), title: U.fmtDay(U.dayNum(x[0] * 1000)) + ' ' + x[1] + ' %' })));
  },
  chip(text, aktiv, onclick, anzahl) {
    return el('button', { class: 'chip' + (aktiv ? ' on' : ''), onclick }, [text, anzahl != null ? el('b', { text: String(anzahl) }) : null]);
  },
  wahl(werte, aktuell, setzen) {
    return el('div', { class: 'seg', role: 'group' }, werte.map(([v, t]) => el('button', { class: v === aktuell ? 'on' : '', text: t, 'aria-pressed': String(v === aktuell), onclick: () => setzen(v) })));
  },
};

<script>
/* LERNI – Seiten: Start, Einheit mit Kurzskript, Logbuch, Frage-Details, Einstellungen mit Sicherung */
'use strict';

const UIScreens = {
  /* ================= Start ================= */
  home() {
    const k = this.kurs(), set = Store.data.set;
    if (!k) return this.seite({ titel: 'Lerni', inhalt: [el('p', { class: 'leer', text: 'Noch keine Inhalte geladen.' })] });
    const fr = k.alleFragen, z = Lernlogik.zaehlen(fr), heute = Lernlogik.heute(), serie = Lernlogik.serie();
    const plan = Lernlogik.plan(k.id, 'heute');
    const neuFrei = Math.max(0, set.neuProTag - Lernlogik.neuHeute(k.id));
    const inhalt = [];

    // Hinweise: in Safari statt Home-Bildschirm-App, Sicherung fällig
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios && !navigator.standalone && !window.matchMedia('(display-mode: standalone)').matches) {
      inhalt.push(el('div', { class: 'card hinweis' }, [el('b', { text: 'Tipp: Als App auf den Home-Bildschirm' }),
        el('p', { html: 'Tippe unten auf <b>Teilen</b> → <b>Zum Home-Bildschirm</b> und lerne ab dann nur über das Symbol. Dort bleibt dein Lernstand dauerhaft gespeichert (Safari-Tabs und Home-Bildschirm-App haben getrennte Speicher).' })]));
    }
    const S = Store.data.sich, tageSeit = S.zuletzt ? (Date.now() - S.zuletzt) / 864e5 : 999;
    if (S.seit >= 150 || (S.seit >= 30 && tageSeit > 14)) {
      inhalt.push(el('div', { class: 'card hinweis' }, [el('b', { text: 'Zeit für eine Sicherung' }),
        el('p', { text: U.plural(S.seit, 'Antwort', 'Antworten') + ' seit der letzten Sicherung. Eine Datei in iCloud Drive schützt deinen Lernstand, falls das App-Symbol mal gelöscht wird.' }),
        el('button', { class: 'btn small primary', text: 'Jetzt sichern', onclick: () => this.sichern() })]));
    }

    const kOffen = this.klausurOffen();
    if (kOffen) inhalt.push(el('div', { class: 'card hinweis' }, [el('b', { text: 'Deine Klausur-Simulation läuft noch' }),
      el('button', { class: 'btn small primary', text: kOffen.abgegeben ? 'Auswertung fortsetzen' : 'Fortsetzen', onclick: () => this.oeffne(kOffen.abgegeben ? this.klausurAuswertung : this.klausurLauf, kOffen) })]));

    // Klausur-Countdown
    const tage = Lernlogik.tageBisKlausur(k.id), termin = Store.klausurTermin(k.id);
    const datum = el('input', { type: 'date', class: 'datum', value: termin, 'aria-label': 'Klausurtermin', onchange: (e) => { Store.setKlausur(k.id, e.target.value); this.neu(); } });
    if (tage == null || tage < 0) {
      inhalt.push(el('div', { class: 'card klausur leer' }, [el('div', {}, [el('b', { text: tage < 0 ? 'Klausur vorbei' : 'Wann ist die Klausur?' }), el('small', { text: 'Mit Termin plant Lerni die Wiederholungen so, dass vorher alles noch einmal drankommt.' })]), datum]));
    } else {
      const ungesehen = z.status.neu, proTag = tage > 0 ? Math.ceil(ungesehen / tage) : ungesehen;
      inhalt.push(el('div', { class: 'card klausur' }, [
        el('div', { class: 'kz' }, [el('b', { text: tage === 0 ? 'Heute!' : String(tage) }), el('small', { text: tage === 0 ? 'Klausur' : tage === 1 ? 'Tag bis zur Klausur' : 'Tage bis zur Klausur' })]),
        el('div', { class: 'kinfo' }, [
          el('span', { text: ungesehen ? U.plural(ungesehen, 'Frage', 'Fragen') + ' noch neu – etwa ' + proTag + ' am Tag' : 'Alle Fragen schon mindestens einmal gesehen.' }),
          datum,
        ]),
      ]));
    }

    // Heute
    const ziel = set.ziel, faellig = z.faellig;
    inhalt.push(el('div', { class: 'card heute' }, [
      el('div', { class: 'hz' }, [
        this.ring(heute.n / ziel, heute.n + '/' + ziel, 'heute', heute.n >= ziel ? 'var(--ok)' : 'var(--pri)'),
        el('div', { class: 'hinfo' }, [
          el('div', { class: 'serie', html: ICON.flamme + '<b>' + serie + '</b> ' + (serie === 1 ? 'Tag' : 'Tage') + ' in Folge' }),
          el('div', { class: 'muted', text: faellig + ' fällig · ' + Math.min(neuFrei, z.neu) + ' neu' }),
          heute.n ? el('div', { class: 'muted', text: 'Heute ' + U.fmtPct(heute.r / heute.n) + ' richtig' }) : null,
        ]),
      ]),
      plan.length ? el('button', { class: 'btn primary wide gross', id: 'startHeute', text: 'Lernen · ' + U.plural(plan.length, 'Frage', 'Fragen'), onclick: () => this.starte('heute', {}, 'Heute lernen') })
        : el('div', { class: 'fertig' }, [el('b', { text: 'Für heute ist alles erledigt.' }), el('span', { class: 'muted', text: ' Freiwillig weiter? Unten gezielt üben.' })]),
    ]));

    // Gezielt üben
    const kachel = (id, name, n, desc, fn) => el('button', { class: 'kachel' + (n ? '' : ' leer'), id: 'k_' + id, onclick: () => (n ? fn() : this.toast('Gerade keine Fragen in „' + name + '“')) }, [
      el('span', { class: 'kn', text: name }), el('b', { text: String(n) }), el('small', { text: desc }),
    ]);
    const nOffen = fr.filter((f) => f.typ === 'offen').length;
    inhalt.push(el('h2', { class: 'abschnitt', text: 'Gezielt üben' }));
    inhalt.push(el('div', { class: 'kacheln' }, [
      ...['kritisch', 'falsch', 'wackelig', 'oftfalsch', 'glueck', 'neu', 'gemerkt', 'sitzt'].map((id) => kachel(id, LISTE_BY_ID[id].name, z[id], LISTE_BY_ID[id].desc, () => this.starte('liste', { liste: id }, LISTE_BY_ID[id].name))),
      kachel('offen', 'Nur offene Fragen', nOffen, 'Wie in der Klausur: erklären, dann Kernpunkte abhaken', () => this.starte('offen', {}, 'Offene Fragen')),
      kachel('mix', 'Alles gemischt', fr.length, 'Zufällige Fragen aus allen Einheiten', () => this.starte('mix', {}, 'Gemischt')),
      kachel('klausur', 'Klausur-Simulation', nOffen, fr.some((f) => f.typ === 'mc') ? 'Vollklausur: 30 Punkte in 45 min, ohne Hilfe' : 'Mit Zeit, ohne Hilfe – Auswertung am Ende', () => this.oeffne(this.klausurStart)),
    ]));

    // Einheiten
    inhalt.push(el('h2', { class: 'abschnitt', text: 'Einheiten' }));
    inhalt.push(el('div', { class: 'liste' }, k.einheitenListe.map((e, i) => {
      const ef = fr.filter((f) => f.einheit === e.id), st = { neu: 0, falsch: 0, wackelig: 0, lernend: 0, sitzt: 0 };
      let due = 0; for (const f of ef) { const inf = Lernlogik.info(f); st[inf.status]++; if (inf.faellig) due++; }
      return el('button', { class: 'zeile einheit', onclick: () => this.oeffne(this.einheit, e.id) }, [
        el('span', { class: 'nr', text: String(i + 1) }),
        el('span', { class: 'zb' }, [el('span', { class: 'zt', text: e.titel }), el('span', { class: 'zm', text: st.sitzt + '/' + ef.length + ' sitzen' + (due ? ' · ' + due + ' fällig' : '') }), ef.length ? this.statusBalken(st, ef.length) : null]),
        el('span', { class: 'pf', html: ICON.pfeil }),
      ]);
    })));
    if (fr.length) inhalt.push(this.legende());

    const K = Lerni.sichtbareKurse();
    const kursKnopf = K.length > 1 ? el('button', { class: 'kurswahl', text: k.kurz || k.name, onclick: () => this.oeffne(this.kursWahl) }) : null;
    return this.seite({ titel: K.length > 1 ? 'Lerni' : k.name, ueber: K.length > 1 ? null : 'Lerni', aktionen: [kursKnopf], inhalt, klasse: 'home' });
  },

  kursWahl() {
    const cur = this.kurs();
    return this.seite({ titel: 'Kurs wählen', zurueck: true, inhalt: [el('div', { class: 'liste' }, Lerni.sichtbareKurse().map((k) => {
      const z = Lernlogik.zaehlen(k.alleFragen);
      return el('button', { class: 'zeile' + (k === cur ? ' sel' : ''), onclick: () => { Store.data.set.kurs = k.id; Store.save(); this.tab('lernen'); } }, [
        el('span', { class: 'zb' }, [el('span', { class: 'zt', text: k.name }), el('span', { class: 'zm', text: k.einheitenListe.length + ' Einheiten · ' + k.alleFragen.length + ' Fragen · ' + z.status.sitzt + ' sitzen' })]),
        el('span', { class: 'pf', html: ICON.pfeil }),
      ]);
    }))] });
  },

  starte(modus, opt = {}, titel) {
    const k = this.kurs(), fr = Lernlogik.plan(k.id, modus, opt);
    if (!fr.length) { this.toast('Keine passenden Fragen'); return; }
    this.oeffne(this.lernSeite, new Sitzung(fr, { modus, titel: titel || 'Lernen', kurs: k.id }));
  },

  /* ================= Einheit mit Kurzskript ================= */
  einheit(eid) {
    const k = this.kurs(), e = k.einheitenListe.find((x) => x.id === eid);
    if (!e) return this.home();
    const ef = k.alleFragen.filter((f) => f.einheit === eid), z = Lernlogik.zaehlen(ef);
    const inhalt = [];
    if (e.quelle) inhalt.push(el('p', { class: 'muted small', text: 'Quelle: ' + e.quelle }));
    if (ef.length) inhalt.push(el('div', { class: 'card' }, [
      this.statusBalken(z.status, ef.length), this.legende(),
      el('div', { class: 'row' }, [
        el('button', { class: 'btn primary', text: 'Einheit lernen', onclick: () => this.starte('einheit', { einheit: eid }, e.titel) }),
        ef.some((f) => f.typ === 'offen') ? el('button', { class: 'btn', text: 'Nur offene Fragen', onclick: () => this.starte('offen', { einheit: eid }, e.titel + ' · offen') }) : null,
      ]),
    ]));
    if (e.skript && e.skript.length) {
      inhalt.push(el('h2', { class: 'abschnitt', html: ICON.skript + ' Kurzskript' }));
      inhalt.push(el('p', { class: 'muted small', text: 'Erst lesen, dann üben: Jeder Abschnitt hat seine eigenen Fragen.' }));
      e.skript.forEach((s) => {
        const n = s.thema ? ef.filter((f) => f.thema === s.thema).length : 0;
        inhalt.push(el('details', { class: 'skript' }, [
          el('summary', {}, [el('span', { text: s.titel }), n ? el('small', { text: U.plural(n, 'Frage', 'Fragen') }) : null]),
          el('div', { class: 'md', html: U.md(s.text) + grafikHtml(k.id, s.bild) }),
          n ? el('button', { class: 'btn small primary', text: 'Fragen zu „' + s.titel + '“ üben', onclick: () => this.starte('thema', { einheit: eid, thema: s.thema }, s.titel) }) : null,
        ]));
      });
    }
    inhalt.push(el('h2', { class: 'abschnitt', text: 'Fragen (' + ef.length + ')' }));
    inhalt.push(this.fragenListe(ef));
    return this.seite({ titel: e.titel, ueber: 'Einheit ' + (e.nr + 1) + ' · ' + k.name, zurueck: true, inhalt });
  },

  fragenListe(fragen) {
    if (!fragen.length) return el('p', { class: 'leer', text: 'Keine Fragen in dieser Auswahl.' });
    return el('div', { class: 'liste fragen' }, fragen.map((f) => {
      const inf = Lernlogik.info(f), r = Store.rec(f.qid);
      return el('button', { class: 'zeile frage', onclick: () => this.oeffne(this.frageDetail, f.qid) }, [
        el('i', { class: 'stl', style: 'background:' + STATUS[inf.status].farbe, title: STATUS[inf.status].name }),
        el('span', { class: 'zb' }, [
          el('span', { class: 'zt', text: U.short(f.frage || f.vorne || f.aussage || f.text, 110) }),
          el('span', { class: 'zm' }, [TYPEN[f.typ].name + (inf.n ? ' · ' + inf.n + '× · ' + U.fmtPct(inf.quote) : '') + (inf.fav ? ' · ★' : ''), r ? this.punkte(r.h, 6) : null]),
        ]),
      ]);
    }));
  },

  /* ================= Logbuch ================= */
  logbuch(teil = 'uebersicht', filter = 'alle') {
    const k = this.kurs(), fr = k ? k.alleFragen : [];
    const nav = this.wahl([['uebersicht', 'Übersicht'], ['fragen', 'Fragen'], ['verlauf', 'Verlauf']], teil, (v) => this.ersetze(this.logbuch, v, filter));
    const inhalt = [nav];
    if (teil === 'uebersicht') inhalt.push(...this._logUebersicht(k, fr));
    else if (teil === 'fragen') inhalt.push(...this._logFragen(fr, filter));
    else inhalt.push(...this._logVerlauf(k));
    return this.seite({ titel: 'Logbuch', ueber: k ? k.name : '', inhalt });
  },
  _logUebersicht(k, fr) {
    const T = Store.data.tage, log = Store.data.log.filter((x) => { const f = Lerni.fragen[x[1]]; return f && f.kurs === k.id; });
    if (!log.length) return [el('p', { class: 'leer', text: 'Noch keine Antworten. Nach der ersten Lernrunde siehst du hier deinen Verlauf, deine Schwächen und deinen Stand je Einheit.' })];
    const q7 = Lernlogik.quoten(k.id, 7), qAll = Lernlogik.quoten(k.id), z = Lernlogik.zaehlen(fr);
    const ms = log.reduce((a, x) => a + x[4], 0);
    const kpi = (wert, text) => el('div', { class: 'kpi' }, [el('b', { text: wert }), el('small', { text })]);
    const out = [el('div', { class: 'kpis' }, [
      kpi(U.fmtInt(log.length), 'Antworten'), kpi(q7.ges.n ? U.fmtPct(q7.ges.r / q7.ges.n) : '–', 'richtig (7 Tage)'),
      kpi(String(Lernlogik.serie()), 'Tage in Folge'), kpi(U.fmtDur(ms), 'Lernzeit'),
    ])];
    // 14 Tage
    const heute = U.dayNum(), tage = [];
    for (let d = heute - 13; d <= heute; d++) { const t = T[U.numToKey(d)] || [0, 0, 0]; tage.push({ d, n: t[0], r: t[1] }); }
    const max = Math.max(5, ...tage.map((t) => t.n));
    out.push(el('h2', { class: 'abschnitt', text: 'Letzte 14 Tage' }));
    out.push(el('div', { class: 'card' }, [el('div', { class: 'chart' }, tage.map((t) => el('div', { class: 'cb' + (t.d === heute ? ' heute' : ''), title: U.fmtDay(t.d) + ': ' + t.n + ' Antworten, ' + t.r + ' richtig' }, [
      el('div', { class: 'cs' }, [el('i', { class: 'ca', style: 'height:' + (t.n / max * 100).toFixed(1) + '%' }, [el('i', { class: 'cr', style: 'height:' + (t.n ? t.r / t.n * 100 : 0).toFixed(1) + '%' })])]),
      el('small', { text: U.wtag(t.d)[0] }),
    ]))), el('div', { class: 'legende' }, [el('span', {}, [el('i', { style: 'background:var(--ok)' }), 'richtig']), el('span', {}, [el('i', { style: 'background:var(--bar)' }), 'Antworten'])])]));
    // Stand je Einheit
    out.push(el('h2', { class: 'abschnitt', text: 'Stand je Einheit' }));
    out.push(el('div', { class: 'card' }, [this.statusBalken(z.status, fr.length), el('div', { class: 'muted small', text: 'Gesamt: ' + z.status.sitzt + ' von ' + fr.length + ' sitzen' })].concat(k.einheitenListe.map((e) => {
      const ef = fr.filter((f) => f.einheit === e.id); if (!ef.length) return null;
      const st = Lernlogik.zaehlen(ef).status;
      return el('div', { class: 'eb' }, [el('div', { class: 'ebt' }, [el('span', { text: e.titel }), el('small', { text: st.sitzt + '/' + ef.length })]), this.statusBalken(st, ef.length)]);
    })).concat([this.legende()])));
    // Nach Fragetyp
    const typen = Object.keys(qAll.proTyp);
    if (typen.length) {
      out.push(el('h2', { class: 'abschnitt', text: 'Trefferquote nach Fragetyp' }));
      out.push(el('div', { class: 'card' }, typen.sort((a, b) => qAll.proTyp[a].r / qAll.proTyp[a].n - qAll.proTyp[b].r / qAll.proTyp[b].n).map((t) => {
        const x = qAll.proTyp[t], q = x.r / x.n;
        return el('div', { class: 'eb' }, [el('div', { class: 'ebt' }, [el('span', { text: TYPEN[t].name }), el('small', { text: U.fmtPct(q) + ' · ' + x.n + '×' })]),
          el('div', { class: 'sbar' }, [el('i', { style: `width:${(q * 100).toFixed(1)}%;background:${q >= 0.8 ? 'var(--ok)' : q >= 0.5 ? 'var(--mid)' : 'var(--bad)'}` })])]);
      })));
    }
    // Schwächen
    const krit = Lernlogik.liste('kritisch', fr).slice(0, 5);
    if (krit.length) {
      out.push(el('h2', { class: 'abschnitt', text: 'Größte Baustellen' }));
      out.push(this.fragenListe(krit));
      out.push(el('button', { class: 'btn primary wide', text: 'Die kritischsten jetzt üben', onclick: () => this.starte('liste', { liste: 'kritisch' }, 'Die 10 kritischsten') }));
    }
    return out;
  },
  _logFragen(fr, filter) {
    const z = Lernlogik.zaehlen(fr);
    const chips = el('div', { class: 'chips' }, [this.chip('Alle', filter === 'alle', () => this.ersetze(this.logbuch, 'fragen', 'alle'), fr.length)]
      .concat(LISTEN.filter((l) => l.id !== 'faellig').map((l) => this.chip(l.name.replace('Die 10 ', ''), filter === l.id, () => this.ersetze(this.logbuch, 'fragen', l.id), z[l.id]))));
    const sel = filter === 'alle' ? fr : Lernlogik.liste(filter, fr);
    const out = [chips];
    if (filter !== 'alle') out.push(el('p', { class: 'muted small', text: LISTE_BY_ID[filter].desc }));
    out.push(this.fragenListe(sel));
    if (filter !== 'alle' && sel.length) out.push(el('button', { class: 'btn primary wide', text: 'Diese ' + Math.min(sel.length, Store.data.set.laenge) + ' üben', onclick: () => this.starte('liste', { liste: filter }, LISTE_BY_ID[filter].name) }));
    return out;
  },
  _logVerlauf(k) {
    const S = Store.data.sitzungen.filter((s) => s.kurs === k.id).slice(-40).reverse();
    const L = Store.data.log.filter((x) => { const f = Lerni.fragen[x[1]]; return f && f.kurs === k.id; }).slice(-40).reverse();
    if (!L.length) return [el('p', { class: 'leer', text: 'Noch nichts gelernt.' })];
    const out = [];
    if (S.length) {
      out.push(el('h2', { class: 'abschnitt', text: 'Lernrunden' }));
      out.push(el('div', { class: 'liste' }, S.map((s) => el('div', { class: 'zeile statisch' }, [
        el('span', { class: 'zb' }, [el('span', { class: 'zt', text: s.titel || s.modus }), el('span', { class: 'zm', text: U.fmtDay(U.dayNum(s.t * 1000), true) + ' ' + U.fmtTime(s.t) + ' · ' + U.plural(s.n, 'Frage', 'Fragen') + ' · ' + U.fmtDur(s.ms) })]),
        el('b', { class: 'quote', text: s.pmax ? U.fmtNum(s.p) + '/' + U.fmtNum(s.pmax) + ' P.' : U.fmtPct(s.r / s.n) }),
      ]))));
    }
    out.push(el('h2', { class: 'abschnitt', text: 'Letzte Antworten' }));
    out.push(el('div', { class: 'liste' }, L.map(([t, qid, p, u]) => {
      const f = Lerni.fragen[qid], e = Lernlogik.ergebnis(p / 100);
      return el('button', { class: 'zeile frage', onclick: () => this.oeffne(this.frageDetail, qid) }, [
        el('span', { class: 'dots' }, [el('i', { class: e + (u ? ' u' : '') })]),
        el('span', { class: 'zb' }, [el('span', { class: 'zt', text: U.short(f.frage || f.vorne || f.aussage || f.text, 90) }), el('span', { class: 'zm', text: U.relDay(U.dayNum(t * 1000)) + ' ' + U.fmtTime(t) + ' · ' + p + ' %' + (u ? ' · unsicher' : '') })]),
      ]);
    })));
    return out;
  },

  /* ================= Frage-Details ================= */
  frageDetail(qid) {
    const f = Lerni.fragen[qid]; if (!f) return this.home();
    const e = Lerni.einheitVon(f), inf = Lernlogik.info(f), r = Store.recOderNeu(qid);
    const stern = el('button', { class: 'ib' + (r.fav ? ' on' : ''), 'aria-label': 'Merken', html: ICON.stern, onclick: () => { r.fav = r.fav ? 0 : 1; Store.save(); stern.classList.toggle('on', !!r.fav); this.toast(r.fav ? 'Gemerkt' : 'Nicht mehr gemerkt'); } });
    const inhalt = [
      el('div', { class: 'meta' }, [TYPEN[f.typ].name + ' · ' + STUFEN[f.stufe] + (f.thema ? ' · ' + f.thema : '') + (f.wichtig > 1 ? ' · ' + '★'.repeat(f.wichtig - 1) + ' klausurrelevant' : '')]),
      el('div', { class: 'card frage-k' }, [el('div', { class: 'md', html: frageHtml(f) }), f.typ === 'luecke' ? el('div', { class: 'md', html: '<p>' + U.inline(U.esc(f.text.replace(/\[\[(.+?)\]\]/g, '＿＿＿'))).replace(/\n/g, '<br>') + '</p>' }) : null]),
      el('details', { class: 'card loes' }, [el('summary', { text: 'Lösung anzeigen' }), el('div', { class: 'md', html: loesungHtml(f) })]),
      f.quelle ? el('p', { class: 'muted small', text: 'Quelle: ' + f.quelle }) : null,
    ];
    if (inf.n) {
      inhalt.push(el('div', { class: 'kpis' }, [
        el('div', { class: 'kpi' }, [el('b', { text: String(inf.n) }), el('small', { text: 'Versuche' })]),
        el('div', { class: 'kpi' }, [el('b', { text: U.fmtPct(inf.quote) }), el('small', { text: 'richtig' })]),
        el('div', { class: 'kpi' }, [el('b', { text: STATUS[inf.status].name }), el('small', { text: 'Status' })]),
        el('div', { class: 'kpi' }, [el('b', { text: U.relDay(inf.due) }), el('small', { text: 'wieder dran' })]),
      ]));
      inhalt.push(el('h2', { class: 'abschnitt', text: 'Verlauf' }));
      inhalt.push(el('div', { class: 'liste' }, r.h.slice().reverse().map(([t, p, u]) => el('div', { class: 'zeile statisch' }, [
        el('span', { class: 'dots' }, [el('i', { class: Lernlogik.ergebnis(p / 100) + (u ? ' u' : '') })]),
        el('span', { class: 'zb' }, [el('span', { class: 'zt', text: { richtig: 'Gewusst', teilweise: 'Teilweise', falsch: 'Nicht gewusst' }[Lernlogik.ergebnis(p / 100)] + (u ? ' · unsicher' : '') }), el('span', { class: 'zm', text: U.fmtDay(U.dayNum(t * 1000), true) + ' ' + U.fmtTime(t) + ' · ' + p + ' %' })]),
      ]))));
      if (r.a) inhalt.push(el('details', { class: 'card' }, [el('summary', { text: 'Deine letzte Antwort' }), el('p', { class: 'vorlage', text: r.a })]));
    } else inhalt.push(el('p', { class: 'muted', text: 'Noch nicht beantwortet.' }));
    const notiz = el('textarea', { class: 'notiz', rows: 3, placeholder: 'Eigene Notiz, Eselsbrücke …', 'aria-label': 'Notiz' });
    notiz.value = r.notiz || '';
    notiz.addEventListener('input', () => { clearTimeout(this._nt); this._nt = setTimeout(() => { r.notiz = notiz.value; Store.save(); }, 400); });
    inhalt.push(el('h2', { class: 'abschnitt', text: 'Notiz' }), notiz);
    inhalt.push(el('button', { class: 'btn primary wide', text: 'Diese Frage jetzt üben', onclick: () => this.oeffne(this.lernSeite, new Sitzung([f], { modus: 'fragen', titel: 'Einzelfrage', kurs: f.kurs })) }));
    return this.seite({ titel: TYPEN[f.typ].name, ueber: e ? e.titel : '', zurueck: true, aktionen: [stern], inhalt });
  },

  /* ================= Einstellungen ================= */
  einstellungen() {
    const set = Store.data.set, k = this.kurs(), K = Lerni.sichtbareKurse();
    const setze = (key, v) => { set[key] = v; Store.save(); if (key === 'theme') this.theme(); this.neu(); };
    const zeile = (titel, text, ctrl) => el('div', { class: 'einst' }, [el('div', {}, [el('div', { class: 'et', text: titel }), text ? el('small', { text }) : null]), ctrl]);
    const inhalt = [];
    if (k) {
      inhalt.push(el('h2', { class: 'abschnitt', text: 'Kurs' }));
      const termin = Store.klausurTermin(k.id);
      inhalt.push(el('div', { class: 'card' }, [
        K.length > 1 ? zeile('Aktiver Kurs', null, el('button', { class: 'btn small', text: k.kurz || k.name, onclick: () => this.oeffne(this.kursWahl) })) : zeile('Kurs', k.name, null),
        zeile('Klausurtermin', 'Wiederholungen werden bis dahin eingeplant.', el('input', { type: 'date', class: 'datum', value: termin, onchange: (e) => { Store.setKlausur(k.id, e.target.value); this.neu(); } })),
      ]));
    }
    inhalt.push(el('h2', { class: 'abschnitt', text: 'Lernen' }));
    inhalt.push(el('div', { class: 'card' }, [
      zeile('Tagesziel', 'Antworten pro Tag', this.wahl([[10, '10'], [20, '20'], [30, '30'], [50, '50']], set.ziel, (v) => setze('ziel', v))),
      zeile('Neue Fragen pro Tag', 'Mehr = schneller durch, aber mehr Wiederholungen später', this.wahl([[5, '5'], [10, '10'], [20, '20'], [40, '40']], set.neuProTag, (v) => setze('neuProTag', v))),
      zeile('Länge einer Lernrunde', null, this.wahl([[10, '10'], [15, '15'], [20, '20'], [30, '30']], set.laenge, (v) => setze('laenge', v))),
      zeile('Offene Fragen', 'Aufschreiben trainiert die Klausur am besten. Tipp: Diktieren über das Mikrofon der Tastatur.', this.wahl([['schreiben', 'Aufschreiben'], ['kopf', 'Im Kopf']], set.offen, (v) => setze('offen', v))),
    ]));
    inhalt.push(el('h2', { class: 'abschnitt', text: 'Darstellung' }));
    inhalt.push(el('div', { class: 'card' }, [zeile('Farben', null, this.wahl([['auto', 'Auto'], ['hell', 'Hell'], ['dunkel', 'Dunkel']], set.theme, (v) => setze('theme', v)))]));

    const S = Store.data.sich;
    inhalt.push(el('h2', { class: 'abschnitt', text: 'Sicherung' }));
    inhalt.push(el('div', { class: 'card' }, [
      el('p', { class: 'small', html: 'Dein Lernstand liegt <b>nur auf diesem Gerät</b>, in der App vom Home-Bildschirm. Updates übernehmen ihn automatisch. Eine Sicherungsdatei (z. B. in iCloud Drive) schützt ihn, falls das Symbol gelöscht wird, und bringt ihn auf ein anderes Gerät.' }),
      el('p', { class: 'muted small', text: 'Letzte Sicherung: ' + (S.zuletzt ? U.fmtDay(U.dayNum(S.zuletzt), true) + ' · seitdem ' + U.plural(S.seit, 'Antwort', 'Antworten') : 'noch keine') }),
      el('div', { class: 'row wrap' }, [
        el('button', { class: 'btn primary', html: ICON.teilen + ' Sicherung speichern', onclick: () => this.sichern() }),
        el('button', { class: 'btn', html: ICON.hoch + ' Sicherung laden', onclick: () => this.ladenDatei() }),
      ]),
      el('div', { class: 'row wrap' }, [
        el('button', { class: 'btn small', text: 'Als Text kopieren', onclick: async () => { const ok = await U.kopieren(Store.exportText()); if (ok) Store.merkeExport(); this.toast(ok ? 'Lernstand kopiert' : 'Kopieren ging nicht'); this.neu(); } }),
        el('button', { class: 'btn small', text: 'Text einfügen', onclick: () => this.ladenText() }),
        Store.hatVorImport() ? el('button', { class: 'btn small', text: 'Stand vor dem Laden zurückholen', onclick: async () => { if (await this.bestaetigen('Zurückholen?', 'Der Lernstand von vor dem letzten Laden oder Zurücksetzen kommt zurück.', 'Zurückholen')) { Store.vorImportZurueck(); this.toast('Zurückgeholt'); this.tab('einst'); } } }) : null,
      ]),
    ]));

    const B = typeof LERNI_BUILD !== 'undefined' ? LERNI_BUILD : { stamp: 'Entwicklung', id: '-' };
    inhalt.push(el('h2', { class: 'abschnitt', text: 'App' }));
    inhalt.push(el('div', { class: 'card' }, [
      zeile('Version', B.stamp + (B.commit ? ' · ' + B.commit : ''), el('button', { class: 'btn small', text: 'Nach Update suchen', onclick: () => Updates.pruefen(true) })),
      zeile('Speicher', U.fmtInt(Store.groesse() / 1024) + ' KB belegt' + (Store.fehler ? ' · Fehler: ' + Store.fehler : ''), null),
      zeile('Selbsttest', 'Prüft Inhalte und Lernlogik (für die Entwicklung)', el('button', { class: 'btn small', text: 'Starten', onclick: () => { location.href = location.pathname + '?selftest'; } })),
      zeile('Lernstand löschen', 'Alle Antworten und das Logbuch dieses Geräts', el('button', { class: 'btn small danger', text: 'Löschen', onclick: async () => {
        if (!(await this.bestaetigen('Lernstand löschen?', 'Alle Antworten, das Logbuch und die Wiederholungsplanung werden gelöscht. Einstellungen bleiben. Bis zum nächsten Laden einer Sicherung lässt es sich noch zurückholen.', 'Löschen', true))) return;
        Store.zuruecksetzen(); this.toast('Lernstand gelöscht'); this.tab('lernen');
      } })),
    ]));
    inhalt.push(el('p', { class: 'muted small center', text: 'Lerni · lernt nur auf deinem Gerät, sendet nichts.' }));
    return this.seite({ titel: 'Einstellungen', inhalt });
  },

  /* ---------- Sicherung ---------- */
  async sichern() {
    const text = Store.exportText(), name = Store.exportName();
    let datei = null; try { datei = new File([text], name, { type: 'application/json' }); } catch (e) { /* alter Browser */ }
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      try { await navigator.share({ files: [datei], title: 'Lerni-Sicherung' }); Store.merkeExport(); this.toast('Sicherung gespeichert'); this.neu(); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = el('a', { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    Store.merkeExport(); this.toast('Sicherung gespeichert: ' + name); this.neu();
  },
  ladenDatei() {
    const inp = el('input', { type: 'file', accept: '.json,application/json,text/plain', style: 'display:none' });
    inp.addEventListener('change', async () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) this.importieren(await f.text()); });
    document.body.appendChild(inp); inp.click();
  },
  ladenText() {
    const ta = el('textarea', { rows: 6, placeholder: 'Kopierten Lernstand hier einfügen', 'aria-label': 'Lernstand als Text' });
    const d = el('div', { class: 'dlg' }, [el('div', { class: 'dlgbox' }, [el('h2', { text: 'Lernstand einfügen' }), ta, el('div', { class: 'dlgk' }, [
      el('button', { class: 'btn', text: 'Abbrechen', onclick: () => d.remove() }),
      el('button', { class: 'btn primary', text: 'Laden', onclick: () => { d.remove(); this.importieren(ta.value); } }),
    ])])]);
    document.body.appendChild(d); ta.focus();
  },
  async importieren(text) {
    let wann = '';
    try { const o = JSON.parse(text); if (o && o.exportiert) wann = ' vom ' + new Date(o.exportiert).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { /* Meldung kommt beim Import */ }
    if (!(await this.bestaetigen('Sicherung laden?', 'Die Sicherung' + U.esc(wann) + ' ersetzt den Lernstand auf diesem Gerät. Der jetzige Stand lässt sich danach unter Einstellungen zurückholen.', 'Laden'))) return;
    try { const r = Store.importText(text); this.theme(); this.toast('Geladen: ' + r.fragen + ' Fragen, ' + r.antworten + ' Antworten'); this.tab('lernen'); } catch (e) { this.dialog({ titel: 'Laden ging nicht', text: U.esc(e.message) }); }
  },
};
Object.assign(App, UIScreens);

<script>
/* LERNI – Lernrunde: eine Frage je Seite, Prüfen, Rückmeldung, Weiter; danach das Ergebnis */
'use strict';

const UILernen = {
  lernSeite(s) {
    const f = s.aktuell;
    if (!f) return this.ergebnisSeite(s);
    const e = Lerni.einheitVon(f), inf = Lernlogik.info(f), r = Store.rec(f.qid) || Store.recOderNeu(f.qid);
    const wdh = s.ergebnisse.some((x) => x.f === f);
    s.start();
    let unsicher = false, res = null, geprueft = false;

    const pruefKnopf = el('button', { class: 'btn primary wide', id: 'pruefen', text: 'Prüfen', disabled: true, onclick: () => pruefen() });
    const unsKnopf = el('button', { class: 'unsicher', id: 'unsicher', 'aria-pressed': 'false', text: 'Unsicher', title: 'Markieren, wenn du geraten hast oder nicht sicher bist', onclick: () => { unsicher = !unsicher; unsKnopf.setAttribute('aria-pressed', String(unsicher)); } });
    const fuss = el('div', { class: 'fuss' }, [unsKnopf, pruefKnopf]);
    const rueck = el('div', { class: 'rueck hidden', 'aria-live': 'polite' });

    const naechste = () => {
      if (s.weiter()) this.ersetze(this.lernSeite, s);
      else { s.abschliessen(); this.ersetze(this.ergebnisSeite, s); }
    };
    const weiter = () => { s.erfassen(res.s, unsicher); naechste(); };
    const zeigeErgebnis = () => {
      const erg = Lernlogik.ergebnis(res.s);
      rueck.className = 'rueck ' + erg;
      rueck.innerHTML = '';
      rueck.appendChild(el('div', { class: 'rk' }, [
        el('b', { text: { richtig: 'Richtig', teilweise: 'Teilweise richtig', falsch: 'Leider falsch' }[erg] }),
        res.s > 0 && res.s < 1 ? el('span', { text: U.fmtPct(res.s) }) : null,
        unsicher && erg === 'richtig' ? el('span', { class: 'muted', text: 'kommt trotzdem bald wieder' }) : null,
      ]));
      const mehr = ['wf', 'zahl', 'reihe'].includes(f.typ) ? loesungHtml(f) : grafikHtml(f.kurs, f.bildLoesung) + (f.erklaerung ? '<div class="erkl">' + U.md(f.erklaerung) + '</div>' : '');
      if (mehr) rueck.appendChild(el('div', { class: 'md', html: mehr }));
      if (f.quelle) rueck.appendChild(el('div', { class: 'quelle', text: 'Quelle: ' + f.quelle }));
    };
    const pruefen = () => {
      if (geprueft || !ui.bereit()) return;
      geprueft = true; res = ui.pruefen(); zeigeErgebnis();
      fuss.innerHTML = '';
      fuss.appendChild(el('button', { class: 'btn primary wide', id: 'weiter', text: s.i + 1 < s.anzahl ? 'Weiter' : 'Fertig', onclick: weiter }));
      setTimeout(() => rueck.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 30);
    };
    const ctx = {
      rnd: U.rng(U.hash(f.qid) ^ (Date.now() & 0xffffff)),
      aenderung: () => { pruefKnopf.disabled = !ui.bereit(); },
      enter: () => { if (!geprueft) pruefen(); else weiter(); },
      fertig: (sc, u, text) => { s.erfassen(sc, u, text); naechste(); },
      neueBewertung: (sc) => { res.s = sc; zeigeErgebnis(); },
      aufgedeckt: () => { },
    };
    const ui = TYP_UI[f.typ].render(f, ctx);

    const karte = el('div', { class: 'card frage-k' }, [
      el('div', { class: 'meta' }, [
        wdh ? el('span', { class: 'badge wdh', text: 'Nochmal' }) : inf.neu ? el('span', { class: 'badge neu', text: 'Neu' }) : null,
        el('span', { text: TYPEN[f.typ].name + (e ? ' · ' + e.titel : '') }),
        f.wichtig > 1 ? el('span', { class: 'wichtig', text: '★'.repeat(f.wichtig - 1), title: 'Klausurrelevant' }) : null,
      ]),
      el('div', { class: 'md frage-t', html: frageHtml(f) }),
      ui.el,
    ]);
    const stern = el('button', { class: 'ib' + (r.fav ? ' on' : ''), 'aria-label': 'Merken', html: ICON.stern, onclick: () => { r.fav = r.fav ? 0 : 1; Store.save(); stern.classList.toggle('on', !!r.fav); this.toast(r.fav ? 'Gemerkt' : 'Nicht mehr gemerkt'); } });
    const schliessen = async () => {
      if (s.ergebnisse.length && !(await this.bestaetigen('Runde beenden?', 'Deine bisherigen Antworten sind schon gespeichert.', 'Beenden'))) return;
      s.abschliessen();
      if (s.ergebnisse.length) this.ersetze(this.ergebnisSeite, s); else this.zurueck();
    };
    const fortschritt = el('div', { class: 'fbar' }, [el('i', { style: 'width:' + (s.i / s.anzahl * 100).toFixed(1) + '%' })]);
    const inhalt = [fortschritt, karte, rueck];
    if (!ui.selbst) inhalt.push(fuss);

    // Enter prüft bzw. geht weiter (Tastatur am Rechner)
    const taste = (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && ev.target.tagName !== 'TEXTAREA' && ev.target.tagName !== 'BUTTON' && !ui.selbst) { ev.preventDefault(); ctx.enter(); } };
    document.addEventListener('keydown', taste);
    this._aufraeumen = () => document.removeEventListener('keydown', taste);
    if (ui.fokus) setTimeout(ui.fokus, 60);

    return this.seite({ titel: (s.i + 1) + ' / ' + s.anzahl, ueber: s.info.titel, schliessen, aktionen: [stern], inhalt, ohneTabs: true, klasse: 'lernen' });
  },

  ergebnisSeite(s) {
    const z = s.zusammenfassung();
    const spruch = z.quote >= 0.9 ? 'Stark! Das sitzt.' : z.quote >= 0.7 ? 'Gut dabei.' : z.quote >= 0.4 ? 'Dranbleiben – Wiederholung macht’s.' : 'Genau dafür ist Üben da.';
    const k = Lerni.kursById[s.info.kurs], naechster = k ? Lernlogik.plan(k.id, 'heute') : [];
    const inhalt = [
      el('div', { class: 'card ergebnis' }, [
        this.ring(z.quote, U.fmtPct(z.quote), 'richtig', z.quote >= 0.8 ? 'var(--ok)' : z.quote >= 0.5 ? 'var(--mid)' : 'var(--bad)'),
        el('div', { class: 'einfo' }, [
          el('b', { text: spruch }),
          el('div', { class: 'ezahlen' }, [
            el('span', { class: 'ok', text: z.richtig + ' gewusst' }), el('span', { class: 'mid', text: z.teilweise + ' teilweise' }), el('span', { class: 'bad', text: z.falsch + ' falsch' }),
          ]),
          el('div', { class: 'muted small', text: U.plural(z.n, 'Frage', 'Fragen') + ' in ' + U.fmtDur(z.ms) + (z.unsicher ? ' · ' + z.unsicher + ' unsicher' : '') }),
        ]),
      ]),
      el('div', { class: 'row wrap' }, [
        z.nochmalFalsch.length ? el('button', { class: 'btn primary', text: 'Die ' + z.nochmalFalsch.length + ' nicht gewussten nochmal', onclick: () => this.ersetze(this.lernSeite, new Sitzung(z.nochmalFalsch.map((q) => Lerni.fragen[q]), { modus: 'fragen', titel: 'Nochmal', kurs: s.info.kurs })) }) : null,
        naechster.length ? el('button', { class: 'btn' + (z.nochmalFalsch.length ? '' : ' primary'), text: 'Weiterlernen', onclick: () => this.ersetze(this.lernSeite, new Sitzung(naechster, { modus: 'heute', titel: 'Heute lernen', kurs: s.info.kurs })) }) : null,
        el('button', { class: 'btn', text: 'Zur Übersicht', onclick: () => this.tab('lernen') }),
      ]),
      el('h2', { class: 'abschnitt', text: 'Deine Antworten' }),
      el('div', { class: 'liste' }, s.erste.map((x) => el('button', { class: 'zeile frage', onclick: () => this.oeffne(this.frageDetail, x.f.qid) }, [
        el('span', { class: 'dots' }, [el('i', { class: Lernlogik.ergebnis(x.s) + (x.u ? ' u' : '') })]),
        el('span', { class: 'zb' }, [el('span', { class: 'zt', text: U.short(x.f.frage || x.f.vorne || x.f.aussage || x.f.text, 100) }), el('span', { class: 'zm', text: TYPEN[x.f.typ].name + ' · ' + Math.round(x.s * 100) + ' %' + (x.u ? ' · unsicher' : '') })]),
      ]))),
    ];
    return this.seite({ titel: 'Geschafft', ueber: s.info.titel, schliessen: () => this.tab('lernen'), inhalt, ohneTabs: true });
  },
};
Object.assign(App, UILernen);
